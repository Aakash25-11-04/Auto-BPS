// The backend sends naive datetime strings ("2026-09-12T02:00:00" or
// "2026-09-12 02:00:00", no timezone) that are meant as UTC throughout this
// app (every other UTC*-based computation here assumes it). Handing a
// string like that straight to `new Date(...)` makes the JS engine parse it
// as LOCAL time instead — on a non-UTC machine that silently shifts every
// block by hours and sometimes onto the wrong calendar day, which can push
// it clean out of the visible date range. This is the one, single place
// that parses a server datetime string, specifically so that mistake can't
// recur: always append 'Z' unless one (or another offset) is already there.
function parseServerDt(s){
  const iso = String(s).replace(' ', 'T');
  return new Date(/[Zz]|[+-]\d\d:?\d\d$/.test(iso) ? iso : iso + 'Z');
}

function _tlMinutesOfDay(iso){
  const t = parseServerDt(iso);
  return t.getUTCHours()*60 + t.getUTCMinutes();
}
function _tlPct(mins){ return (mins/1440*100).toFixed(2) + '%'; }

// Shared renderer: real trains (background layer) + available slots + a set
// of scheduled entries, positioned and sized by their REAL assigned times
// (not the enclosing window's times) so multiple tasks packed into one
// window visibly sit at different offsets. Used both by the main Corridor
// Timeline panel and by the Before/After dual timeline.
function buildTimelineDaysHtml(corridorId, templates, slots, entries, horizonDays){
  const today = new Date(); today.setUTCHours(0,0,0,0);
  const days = [];
  for(let i=0;i<Math.min(horizonDays,14);i++){
    days.push(new Date(today.getTime() + i*86400000));
  }

  let html = '';
  days.forEach(day=>{
    const dayStr = day.toISOString().slice(0,10);
    let inner = '<div class="timeline-hour-grid">' + Array.from({length:24}).map(()=>'<div></div>').join('') + '</div>';

    templates.forEach(t=>{
      const startMin = _tlMinutesOfDay(t.scheduled_departure);
      let durMin = (parseServerDt(t.scheduled_arrival) - parseServerDt(t.scheduled_departure)) / 60000;
      if(durMin <= 0) durMin = 5;
      const widthPct = Math.max(0.3, (durMin/1440*100));
      inner += `<div class="tl-train" style="left:${_tlPct(startMin)};width:${widthPct}%;" title="Train ${t.train_id} ${t.train_name}: dep ${t.scheduled_departure.slice(11,16)}"></div>`;
    });

    slots.forEach(s=>{
      const sStart = parseServerDt(s.start_time);
      if(sStart.toISOString().slice(0,10) !== dayStr) return;
      const startMin = sStart.getUTCHours()*60 + sStart.getUTCMinutes();
      const widthPct = Math.max(0.3, (s.duration_hours*60/1440*100));
      inner += `<div class="tl-slot" style="left:${_tlPct(startMin)};width:${widthPct}%;" title="Available slot ${s.slot_id}: ${s.duration_hours}h (${s.derived_from})"></div>`;
    });

    entries.filter(e=>e.corridor_id===corridorId).forEach(e=>{
      const eStart = parseServerDt(e.assigned_window_start);
      if(eStart.toISOString().slice(0,10) !== dayStr) return;
      const startMin = eStart.getUTCHours()*60 + eStart.getUTCMinutes();
      const durMin = (parseServerDt(e.assigned_window_end) - eStart) / 60000;
      const widthPct = Math.max(0.4, (durMin/1440*100));
      const shared = e.co_scheduled_departments && e.co_scheduled_departments.length;
      inner += `<div class="tl-block dept-${e.department}" style="left:${_tlPct(startMin)};width:${widthPct}%;" title="${e.task_id} (${e.department}) ${e.assigned_window_start} - ${e.assigned_window_end}${shared ? ' | shared with '+e.co_scheduled_departments.join(',') : ''}"></div>`;
    });

    html += `<div class="timeline-day"><div class="timeline-day-label">${dayStr}</div><div class="timeline-track">${inner}</div></div>`;
  });
  return html;
}

/* ============================== main corridor timeline (interactive) ==============================
 * FR-COA-03: click a block for full task detail; drag a block to adjust its
 * time (COA + draft plan only, backend re-validates and rejects invalid
 * moves with a specific reason, and a rejected drag snaps back); zoom
 * between day/week/month granularity with prev/next paging; a live "now"
 * marker. Real train movements render as the background layer (unchanged
 * from before) so it stays visible that every block sits in a genuine gap. */
const tlState = {corridorId: '', granularity: 'week', dayOffset: 0, templates: [], slots: [], entries: [], planStatus: null, selectedKey: null};

function computeTimelineDays(granularity, dayOffset){
  const today = new Date(); today.setUTCHours(0,0,0,0);
  const count = granularity === 'day' ? 1 : (granularity === 'month' ? 30 : 7);
  const start = new Date(today.getTime() + dayOffset * count * 86400000);
  const days = [];
  for(let i=0;i<count;i++) days.push(new Date(start.getTime() + i*86400000));
  return days;
}

function entryKey(e){ return e.id != null ? ('id:'+e.id) : ('tk:'+e.task_id+':'+e.assigned_window_start); }

function detailPanelHtml(entry){
  if(!entry){
    return `<h4>Block Details</h4><p class="small-muted">Click (or focus + Enter) a block on the timeline to see its task, priority score, full justification, and which departments share that window.</p>`;
  }
  const shared = entry.co_scheduled_departments || [];
  return `
    <h4 class="mono">${escapeHtml(entry.task_id)}</h4>
    <div class="dp-row"><div class="dp-label">Department</div><span class="badge dept-${entry.department}">${entry.department}</span></div>
    <div class="dp-row"><div class="dp-label">Corridor</div><span class="mono">${escapeHtml(entry.corridor_id)}</span></div>
    <div class="dp-row"><div class="dp-label">Window</div><span class="mono">${fmtDt(entry.assigned_window_start)}<br/>&rarr; ${fmtDt(entry.assigned_window_end)}</span></div>
    ${entry.priority_score != null ? `<div class="dp-row"><div class="dp-label">Priority Score</div><span class="score-pill mono" style="color:${TIER_COLOR[priorityTier(entry.priority_score)]}">${entry.priority_score.toFixed(1)}</span> <span class="small-muted">${priorityTier(entry.priority_score)}</span></div>` : ''}
    ${entry.priority_reason ? `<div class="dp-row"><div class="dp-label">Justification</div><div class="justification">${escapeHtml(entry.priority_reason)}</div></div>` : ''}
    <div class="dp-row"><div class="dp-label">Shared With</div>${shared.length ? shared.map(d=>`<span class="badge dept-${d}">${d}</span>`).join(' ') : '<span class="small-muted">Solo block</span>'}</div>
    ${entry.id != null ? `<div class="dp-row"><div class="dp-label">Adjust</div><p class="small-muted" style="margin:0;">${state.currentUser.role==='COA' && tlState.planStatus==='draft' ? 'Drag this block left/right to change its time. Every move is re-validated against real trains, corridor capacity, and mutual exclusion — an invalid move snaps back with the reason.' : 'Only the Control Office can adjust a block, and only while its plan is still a draft.'}</p></div>` : ''}
  `;
}

function buildInteractiveTimelineHtml(days){
  const now = new Date();
  const nowDayStr = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate())).toISOString().slice(0,10);
  const nowMinutes = now.getUTCHours()*60 + now.getUTCMinutes();
  const canDrag = state.currentUser.role === 'COA' && tlState.planStatus === 'draft';

  let html = '';
  days.forEach(day=>{
    const dayStr = day.toISOString().slice(0,10);
    let inner = '<div class="timeline-hour-grid">' + Array.from({length:24}).map(()=>'<div></div>').join('') + '</div>';

    tlState.templates.forEach(t=>{
      const startMin = _tlMinutesOfDay(t.scheduled_departure);
      let durMin = (parseServerDt(t.scheduled_arrival) - parseServerDt(t.scheduled_departure)) / 60000;
      if(durMin <= 0) durMin = 5;
      const widthPct = Math.max(0.3, (durMin/1440*100));
      inner += `<div class="tl-train" style="left:${_tlPct(startMin)};width:${widthPct}%;" title="Train ${t.train_id} ${t.train_name}: dep ${t.scheduled_departure.slice(11,16)}"></div>`;
    });

    tlState.slots.forEach(s=>{
      const sStart = parseServerDt(s.start_time);
      if(sStart.toISOString().slice(0,10) !== dayStr) return;
      const startMin = sStart.getUTCHours()*60 + sStart.getUTCMinutes();
      const widthPct = Math.max(0.3, (s.duration_hours*60/1440*100));
      inner += `<div class="tl-slot" style="left:${_tlPct(startMin)};width:${widthPct}%;" title="Available slot ${s.slot_id}: ${s.duration_hours}h (${s.derived_from})"></div>`;
    });

    tlState.entries.filter(e=>e.corridor_id===tlState.corridorId).forEach(e=>{
      const eStart = parseServerDt(e.assigned_window_start);
      if(eStart.toISOString().slice(0,10) !== dayStr) return;
      const startMin = eStart.getUTCHours()*60 + eStart.getUTCMinutes();
      const durMin = (parseServerDt(e.assigned_window_end) - eStart) / 60000;
      const widthPct = Math.max(0.4, (durMin/1440*100));
      const shared = e.co_scheduled_departments && e.co_scheduled_departments.length;
      const key = entryKey(e);
      const label = `${e.task_id} (${e.department}) ${e.assigned_window_start} to ${e.assigned_window_end}${shared ? ', shared with '+e.co_scheduled_departments.join(', ') : ''}`;
      inner += `<div class="tl-block dept-${e.department}${tlState.selectedKey===key?' selected':''}" style="left:${_tlPct(startMin)};width:${widthPct}%;"
        data-key="${escapeHtml(key)}" data-day="${dayStr}" ${e.id!=null && canDrag ? '' : 'style="cursor:pointer;"'}
        role="button" tabindex="0" aria-label="${escapeHtml(label)}" title="${escapeHtml(label)}"></div>`;
    });

    if(dayStr === nowDayStr){
      inner += `<div class="tl-now-marker" style="left:${_tlPct(nowMinutes)};" aria-hidden="true"></div>`;
    }

    html += `<div class="timeline-day"><div class="timeline-day-label">${dayStr}</div><div class="timeline-track">${inner}</div></div>`;
  });
  return html;
}

async function renderMainTimeline(corridorId){
  const body = document.getElementById('timeline-body');
  if(!corridorId){ body.innerHTML = '<div class="small-muted">Enter a corridor ID.</div>'; return; }
  body.innerHTML = `<div class="skeleton-line w80"></div><div class="skeleton-line w60"></div><div class="skeleton-line w40"></div>`;

  let templates, slots, plan;
  try{
    templates = await api('/api/timetable?corridor_id=' + encodeURIComponent(corridorId) + '&limit=2000');
    slots = await api('/api/corridor-availability?corridor_id=' + encodeURIComponent(corridorId) + '&horizon=' + state.horizon);
    plan = await fetchCurrentPlanOrNull();
  }catch(e){
    body.innerHTML = `
      <div class="state-box error"><div class="state-icon">&#9888;</div>
      <div class="state-msg">${escapeHtml(e.message)}</div>
      <button class="btn secondary small" id="tl-retry-btn">Retry</button></div>`;
    document.getElementById('tl-retry-btn').onclick = ()=>renderMainTimeline(corridorId);
    return;
  }

  if(!templates.length){
    body.innerHTML = `
      <div class="state-box"><div class="state-icon">&#9675;</div>
      <div class="state-msg">No timetable entries for corridor "${escapeHtml(corridorId)}".</div>
      <div class="state-hint">Load the timetable and check the spelling — see the corridor chips above.</div></div>`;
    return;
  }

  tlState.corridorId = corridorId;
  tlState.templates = templates;
  tlState.slots = slots;
  tlState.entries = plan ? plan.entries : [];
  tlState.planStatus = plan ? plan.status : null;
  drawMainTimeline();
}

function drawMainTimeline(){
  const body = document.getElementById('timeline-body');
  const days = computeTimelineDays(tlState.granularity, tlState.dayOffset);
  const selected = tlState.entries.find(e=>entryKey(e)===tlState.selectedKey) || null;

  body.innerHTML = `
    <div class="tl-toolbar">
      <div class="tl-zoom-group" role="group" aria-label="Timeline granularity">
        ${['day','week','month'].map(g=>`<button type="button" class="btn secondary small ${tlState.granularity===g?'active':''}" data-gran="${g}">${g[0].toUpperCase()+g.slice(1)}</button>`).join('')}
      </div>
      <div class="btn-row" style="margin-top:0;">
        <button type="button" class="btn secondary small" id="tl-prev">&larr; Earlier</button>
        <button type="button" class="btn secondary small" id="tl-today">Today</button>
        <button type="button" class="btn secondary small" id="tl-next">Later &rarr;</button>
      </div>
    </div>
    <div class="timeline-split">
      <div class="tl-main">
        <div id="tl-days"></div>
      </div>
      <div class="tl-detail-panel" id="tl-detail" aria-live="polite">${detailPanelHtml(selected)}</div>
    </div>
  `;
  document.getElementById('tl-days').innerHTML = buildInteractiveTimelineHtml(days);

  document.querySelectorAll('[data-gran]').forEach(btn=>{
    btn.onclick = ()=>{ tlState.granularity = btn.dataset.gran; tlState.dayOffset = 0; drawMainTimeline(); };
  });
  document.getElementById('tl-prev').onclick = ()=>{ tlState.dayOffset -= 1; drawMainTimeline(); };
  document.getElementById('tl-next').onclick = ()=>{ tlState.dayOffset += 1; drawMainTimeline(); };
  document.getElementById('tl-today').onclick = ()=>{ tlState.dayOffset = 0; drawMainTimeline(); };

  const canDrag = state.currentUser.role === 'COA' && tlState.planStatus === 'draft';
  document.querySelectorAll('#tl-days .tl-block').forEach(blockEl=>{
    const key = blockEl.dataset.key;
    const entry = tlState.entries.find(e=>entryKey(e)===key);
    if(!entry) return;

    function select(){ tlState.selectedKey = key; document.getElementById('tl-detail').innerHTML = detailPanelHtml(entry); document.querySelectorAll('#tl-days .tl-block.selected').forEach(b=>b.classList.remove('selected')); blockEl.classList.add('selected'); }
    blockEl.addEventListener('click', select);
    blockEl.addEventListener('keydown', (ev)=>{ if(ev.key==='Enter' || ev.key===' '){ ev.preventDefault(); select(); } });

    if(canDrag && entry.id != null){
      wireBlockDrag(blockEl, entry);
    }
  });
}

function wireBlockDrag(blockEl, entry){
  let dragging = false, startX = 0, startLeftPct = 0, trackWidth = 0;
  const track = blockEl.closest('.timeline-track');

  blockEl.addEventListener('pointerdown', (ev)=>{
    if(ev.button !== 0) return;
    dragging = true;
    blockEl.setPointerCapture(ev.pointerId);
    blockEl.classList.add('dragging');
    startX = ev.clientX;
    trackWidth = track.getBoundingClientRect().width;
    startLeftPct = parseFloat(blockEl.style.left);
  });
  blockEl.addEventListener('pointermove', (ev)=>{
    if(!dragging) return;
    const deltaPct = ((ev.clientX - startX) / trackWidth) * 100;
    const widthPct = parseFloat(blockEl.style.width);
    const newLeftPct = Math.max(0, Math.min(100 - widthPct, startLeftPct + deltaPct));
    blockEl.style.left = newLeftPct + '%';
  });
  blockEl.addEventListener('pointerup', async (ev)=>{
    if(!dragging) return;
    dragging = false;
    blockEl.classList.remove('dragging');
    try{ blockEl.releasePointerCapture(ev.pointerId); }catch(_e){}

    const newLeftPct = parseFloat(blockEl.style.left);
    const newStartMin = Math.round((newLeftPct/100) * 1440 / 5) * 5; // snap to 5 minutes
    const dayStr = blockEl.dataset.day;
    if(Math.round(startLeftPct*100) === Math.round(newLeftPct*100)) return; // no real move — don't call the API for a click-release

    const newStart = new Date(dayStr + 'T00:00:00Z');
    newStart.setUTCMinutes(newStartMin);
    const isoLocal = newStart.toISOString().slice(0,19);

    try{
      const result = await api(`/api/schedule/entries/${entry.id}/reschedule`, {method:'POST', body:{new_start: isoLocal}});
      toast(`Block moved to ${fmtDt(result.assigned_window_start)}`, 'ok');
      await renderMainTimeline(tlState.corridorId); // redraw from authoritative server state
      loadPlanDependentPanels(); // metrics/unscheduled/plan-approval all depend on the plan too
    }catch(e){
      toast('Move rejected — snapped back: ' + e.message, 'err');
      drawMainTimeline(); // snap back: redraw from the last-known-good (unmutated) tlState
    }
  });
}

async function renderComparisonTimelines(corridorId, comparison){
  const baseWrap = document.getElementById('cmp-timeline-baseline');
  const optWrap = document.getElementById('cmp-timeline-optimized');
  if(!baseWrap || !optWrap) return;
  if(!corridorId){
    baseWrap.innerHTML = optWrap.innerHTML = '<div class="small-muted">Enter a corridor ID.</div>';
    return;
  }
  baseWrap.innerHTML = optWrap.innerHTML = '<div class="small-muted">Loading...</div>';
  const horizonDays = state.horizon === 'monthly' ? 30 : 7;

  let templates = [], slots = [], plan = null;
  try{
    templates = await api('/api/timetable?corridor_id=' + encodeURIComponent(corridorId) + '&limit=2000');
    slots = await api('/api/corridor-availability?corridor_id=' + encodeURIComponent(corridorId) + '&horizon=' + state.horizon);
    plan = await api('/api/schedule/plan?horizon=' + state.horizon).catch(()=>null);
  }catch(e){
    baseWrap.innerHTML = optWrap.innerHTML = `<div class="row-errors">${escapeHtml(e.message)}</div>`;
    return;
  }
  if(!templates.length){
    const msg = `<div class="small-muted">No timetable entries for corridor "${escapeHtml(corridorId)}".</div>`;
    baseWrap.innerHTML = optWrap.innerHTML = msg;
    return;
  }

  // baseline_entries use {start,end}; reshape to the {assigned_window_start,
  // assigned_window_end, co_scheduled_departments} field names the shared
  // renderer expects. Baseline coordination is always empty by construction
  // (whole-window exclusive claim), which the timeline will visibly show as
  // one solid single-department block per window versus the optimized
  // timeline's tightly packed, multi-department blocks below it.
  const baselineEntries = (comparison.baseline_entries || []).map(e => ({
    task_id: e.task_id, department: e.department, corridor_id: e.corridor_id,
    assigned_window_start: e.start, assigned_window_end: e.end, co_scheduled_departments: [],
  }));
  const optimizedEntries = plan ? plan.entries : [];

  baseWrap.innerHTML = buildTimelineDaysHtml(corridorId, templates, slots, baselineEntries, horizonDays);
  optWrap.innerHTML = buildTimelineDaysHtml(corridorId, templates, slots, optimizedEntries, horizonDays);
}

/* ============================== ADMIN VIEW ============================== */
const WEIGHT_META = {
  w_severity: 'Points per severity point (1-5)',
  w_overdue: 'Points per overdue day (capped at 60 days)',
  w_criticality: 'Points per asset criticality point (1-5)',
  w_safety_flag: 'Flat bonus if safety-critical or interlocking-critical',
};

async function renderAdmin(content){
  content.innerHTML = `
    <div class="grid-2">
      <div class="panel">
        <h2>Scoring Weights</h2>
        <p class="hint">score = w_severity&times;severity + w_overdue&times;min(overdue,60) + w_criticality&times;criticality + w_safety_flag (if flagged).
        Changing a weight immediately rescores every task in the system.</p>
        <div id="weights-form"></div>
        <div class="hint" style="border-top:1px solid var(--border);margin-top:14px;padding-top:12px;">
          <b>Scoring source</b> (Layer 3) &mdash; switches every task between the rule-based formula above,
          the ML risk model, or a 50/50 blend. Changing it immediately rescores every task.
        </div>
        <div id="scoring-source-admin-body"></div>
      </div>

      <div class="panel">
        <h2>Asset Criticality Registry</h2>
        <p class="hint">Assets not listed here default to criticality 3/5 when scored. CSV import requires the asset_id to be registered here first.</p>
        <form id="asset-form" class="btn-row" style="margin-top:0;align-items:flex-end;">
          <div style="flex:1;"><label for="asset-form-id">Asset ID</label><input type="text" id="asset-form-id" name="asset_id" required /></div>
          <div style="width:100px;"><label for="asset-form-crit">Criticality</label><input type="number" id="asset-form-crit" name="criticality" min="1" max="5" value="3" required /></div>
          <button class="btn" type="submit">Set</button>
        </form>
        <div id="asset-registry" style="margin-top:12px;"></div>
      </div>
    </div>

    <div class="panel">
      <h2>Users</h2>
      <div id="users-table"></div>
    </div>

    <div class="panel">
      <h2>Full Audit Trail</h2>
      <div id="audit-table"></div>
    </div>
  `;

  async function loadWeights(){
    return loadSection('weights-form', ()=>api('/api/admin/scoring-config'), (weights)=>
      Object.keys(WEIGHT_META).map(k=>`
        <div class="weight-row">
          <label for="w-${k}">${k}</label>
          <input type="number" step="0.1" id="w-${k}" value="${weights[k]}" />
          <span class="desc">${WEIGHT_META[k]}</span>
        </div>
      `).join('') + '<div class="btn-row"><button class="btn" id="save-weights-btn">Save &amp; Rescore</button></div>',
      {
        isEmpty: ()=>false,
        afterRender: ()=>{
          document.getElementById('save-weights-btn').onclick = async ()=>{
            try{
              for(const k of Object.keys(WEIGHT_META)){
                const val = parseFloat(document.getElementById('w-'+k).value);
                await api('/api/admin/scoring-config', {method:'POST', body:{key:k, value:val}});
              }
              toast('Weights saved, all tasks rescored', 'ok');
            }catch(e){ toast('Failed: ' + e.message, 'err'); }
          };
        },
      }
    );
  }

  async function loadScoringSourceAdmin(){
    return loadSection('scoring-source-admin-body', ()=>api('/api/admin/scoring-source'), (s)=>`
      <div class="btn-row" style="margin-top:0;">
        <select id="admin-scoring-source-select" style="width:140px;">
          ${(s.valid_sources||['rule','ml','blend']).map(v=>`<option value="${v}" ${v===s.source?'selected':''}>${v}</option>`).join('')}
        </select>
        <button class="btn secondary small" id="admin-save-scoring-source-btn">Apply</button>
      </div>
    `, {
      isEmpty: ()=>false,
      afterRender: ()=>{
        document.getElementById('admin-save-scoring-source-btn').onclick = async ()=>{
          const src = document.getElementById('admin-scoring-source-select').value;
          try{
            const r = await api('/api/admin/scoring-source', {method:'POST', body:{source: src}});
            toast(`Scoring source set to ${src} — ${r.tasks_rescored} task(s) rescored`, 'ok');
          }catch(e){ toast('Failed: ' + e.message, 'err'); }
        };
      },
    });
  }

  // renderSortableTable draws directly into its container, which doesn't fit
  // loadSection's "return HTML string" contract — so this loader is hand-rolled
  // (skeleton / error+retry / empty / real table) rather than going through it.
  async function loadAssetsReal(){
    const el = document.getElementById('asset-registry');
    el.innerHTML = `<div class="skeleton-line w60"></div><div class="skeleton-line w40"></div>`;
    let assets;
    try{ assets = await api('/api/admin/asset-criticality'); }
    catch(e){
      el.innerHTML = `<div class="state-box error"><div class="state-icon">&#9888;</div><div class="state-msg">${escapeHtml(e.message)}</div><button class="btn secondary small" id="asset-retry">Retry</button></div>`;
      document.getElementById('asset-retry').onclick = loadAssetsReal;
      return;
    }
    if(!assets.length){
      el.innerHTML = `<div class="state-box"><div class="state-icon">&#9675;</div><div class="state-msg">No assets registered yet.</div><div class="state-hint">Register one with the form above.</div></div>`;
      return;
    }
    renderSortableTable('asset-registry', assets, {
      rowKey: a=>a.asset_id, defaultSortKey: 'asset_id', searchFields: ['asset_id'], pageSize: 15,
      emptyMessage: 'No assets match the search.',
      columns: [
        {key:'asset_id', label:'Asset ID', sortable:true, render:a=>`<span class="mono">${escapeHtml(a.asset_id)}</span>`},
        {key:'criticality', label:'Criticality', sortable:true, render:a=>`<span class="mono">${a.criticality}/5</span>`},
      ],
    });
  }

  async function loadUsers(){
    const el = document.getElementById('users-table');
    el.innerHTML = `<div class="skeleton-line w80"></div><div class="skeleton-line w60"></div>`;
    let users;
    try{ users = await api('/api/admin/users'); }
    catch(e){
      el.innerHTML = `<div class="state-box error"><div class="state-icon">&#9888;</div><div class="state-msg">${escapeHtml(e.message)}</div><button class="btn secondary small" id="users-retry">Retry</button></div>`;
      document.getElementById('users-retry').onclick = loadUsers;
      return;
    }
    renderSortableTable('users-table', users, {
      rowKey: u=>u.user_id, defaultSortKey: 'user_id', searchFields: ['user_id','name','role','department'], pageSize: 25,
      emptyMessage: 'No users.',
      columns: [
        {key:'user_id', label:'User ID', sortable:true, render:u=>`<span class="mono">${escapeHtml(u.user_id)}</span>`},
        {key:'name', label:'Name', sortable:true, render:u=>escapeHtml(u.name)},
        {key:'role', label:'Role', sortable:true, render:u=>`<span class="badge dept-${u.role}">${u.role}</span>`},
        {key:'department', label:'Department', sortable:true, render:u=>`<span class="mono">${escapeHtml(u.department||'—')}</span>`},
        {key:'active', label:'Active', sortable:true, sortValue:u=>u.active?1:0, render:u=>u.active?'<span class="lamp green" style="display:inline-block;" role="img" aria-label="active"></span>':'<span class="lamp red" style="display:inline-block;" role="img" aria-label="inactive"></span>'},
      ],
    });
  }

  async function loadAudit(){
    const el = document.getElementById('audit-table');
    el.innerHTML = `<div class="skeleton-line w80"></div><div class="skeleton-line w60"></div><div class="skeleton-line w40"></div>`;
    let audit;
    try{ audit = await api('/api/admin/audit-log?limit=300'); }
    catch(e){
      el.innerHTML = `<div class="state-box error"><div class="state-icon">&#9888;</div><div class="state-msg">${escapeHtml(e.message)}</div><button class="btn secondary small" id="audit-retry">Retry</button></div>`;
      document.getElementById('audit-retry').onclick = loadAudit;
      return;
    }
    renderSortableTable('audit-table', audit, {
      rowKey: a=>a.log_id, defaultSortKey: 'timestamp', searchFields: ['action','user_id'], pageSize: 30,
      emptyMessage: 'No audit entries match.',
      columns: [
        {key:'timestamp', label:'Time', sortable:true, render:a=>`<span class="mono">${fmtDt(a.timestamp)}</span>`},
        {key:'action', label:'Action', sortable:true, render:a=>`<span class="mono">${escapeHtml(a.action)}</span>`},
        {key:'user_id', label:'User', sortable:true, render:a=>`<span class="mono">${escapeHtml(a.user_id)}</span>`},
        {key:'details', label:'Details', render:a=>`<span class="mono small-muted">${escapeHtml(JSON.stringify(a.details))}</span>`},
      ],
    });
  }

  document.getElementById('asset-form').onsubmit = async (ev)=>{
    ev.preventDefault();
    const fd = new FormData(ev.target);
    try{
      await api('/api/admin/asset-criticality', {method:'POST', body:{asset_id: fd.get('asset_id'), criticality: parseInt(fd.get('criticality'))}});
      toast('Asset criticality set', 'ok');
      loadAssetsReal();
    }catch(e){ toast('Failed: ' + e.message, 'err'); }
  };

  loadWeights();
  loadAssetsReal();
  loadScoringSourceAdmin();
  loadUsers();
  loadAudit();
}

boot();
</script>
