<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ABPS &mdash; Automatic Block Planning System</title>
<!-- Leaflet (open source, OpenStreetMap tiles, no API key) for the Network Map view. SRI-pinned. -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<style>
:root{
  /* ---- daylight control room: light base, saturated signal colors ---- */
  --bg:#F7F9FA; --panel:#FFFFFF; --panel2:#EEF2F4; --border:#E1E6EA;
  --text:#1A2226; --text-dim:#5B6770; --text-bright:#0B1114;
  --accent:#2563A8; --accent-dim:#1D4D85; --accent-tint:#E8F0F8;
  --green:#1E8E4F; --green-tint:#E5F4EB;
  --amber:#C7861A; --amber-tint:#FBF0DF;
  --red:#C4392F; --red-tint:#FBEAE8;
  --blue:#2563A8; --blue-tint:#E8F0F8;
  --purple:#7A4FB0; --purple-tint:#F1EAF9;
  /* Department colors — fixed everywhere: ENG=blue, TD=amber, SNT=green */
  --eng:#2563A8; --td:#C7861A; --snt:#1E8E4F; --coa:#2563A8;
  /* Sidebar stays a deep slate anchor against the light body */
  --sb-bg:#1F2933; --sb-panel:#29343E; --sb-border:#37434D;
  --sb-text:#C7D0D6; --sb-text-dim:#8B98A3; --sb-text-bright:#FFFFFF;
  --shadow-sm: 0 1px 3px rgba(20,30,40,0.08), 0 1px 2px rgba(20,30,40,0.06);
  --shadow-md: 0 4px 16px rgba(20,30,40,0.12), 0 2px 6px rgba(20,30,40,0.08);
  --shadow-lg: 0 16px 48px rgba(20,30,40,0.22), 0 4px 12px rgba(20,30,40,0.10);
  --mono: ui-monospace, "Cascadia Mono", "Consolas", "SFMono-Regular", Menlo, monospace;
  --sans: "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:13px;height:100%;}
body{min-height:100vh;}
#app-shell{display:flex;min-height:100vh;}
#app-shell[hidden]{display:none;}

/* ---------- login screen ---------- */
#login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;background:var(--bg);}
#login-screen[hidden]{display:none;}
.login-card{width:100%;max-width:340px;background:var(--panel);border-radius:12px;padding:28px 26px;box-shadow:var(--shadow-lg);}
.login-card .logo{font-family:var(--mono);font-weight:700;font-size:22px;color:var(--text-bright);letter-spacing:1px;text-align:center;}
.login-card .logo .dot{color:var(--accent);}
.login-card .sub{font-size:11px;color:var(--text-dim);text-align:center;margin-top:4px;margin-bottom:22px;text-transform:uppercase;letter-spacing:0.5px;}
.login-card .btn{width:100%;margin-top:16px;padding:9px 16px;}
#login-error{color:var(--red);font-size:11.5px;margin-top:10px;min-height:14px;}
.login-hint{font-size:10.5px;color:var(--text-dim);margin-top:18px;padding-top:14px;border-top:1px solid var(--border);line-height:1.6;}

/* ---------- current user / impersonation (sidebar, dark context) ---------- */
.current-user-card{border:1px solid var(--sb-border);border-radius:6px;padding:10px;background:var(--sb-panel);}
.current-user-card .cu-name{color:var(--sb-text-bright);font-size:12.5px;margin-top:6px;}
.current-user-card .cu-id{color:var(--sb-text-dim);font-size:10.5px;margin-top:2px;}
.impersonating-banner{background:#3A2C12;border:1px solid #6b4a1a;color:#f2c078;font-size:10.5px;padding:6px 8px;border-radius:5px;margin-top:8px;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-track{background:var(--bg);}
::-webkit-scrollbar-thumb{background:#C7CFD5;border-radius:4px;}
::-webkit-scrollbar-thumb:hover{background:#AEB8BF;}

a{color:var(--accent);}
button{font-family:var(--sans);cursor:pointer;}
input,select,textarea{font-family:var(--sans);}

/* ---------- sidebar (dark slate anchor) ---------- */
#sidebar{
  width:230px;min-width:230px;background:var(--sb-bg);border-right:1px solid var(--sb-border);
  display:flex;flex-direction:column;padding:16px 12px;gap:18px;
}
#brand{padding:4px 4px 12px 4px;border-bottom:1px solid var(--sb-border);}
#brand .logo{font-family:var(--mono);font-weight:700;font-size:18px;color:var(--sb-text-bright);letter-spacing:1px;}
#brand .logo .dot{color:#5FA8E0;}
#brand .sub{font-size:10.5px;color:var(--sb-text-dim);margin-top:4px;letter-spacing:0.5px;text-transform:uppercase;}

.sidebar-section-label{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--sb-text-dim);margin-bottom:6px;padding-left:2px;}
#user-switcher{display:flex;flex-direction:column;gap:4px;}
.user-btn{
  display:flex;align-items:center;gap:8px;background:transparent;border:1px solid transparent;
  color:var(--sb-text);padding:8px 8px;border-radius:6px;text-align:left;font-size:12.5px;
}
.user-btn:hover{background:var(--sb-panel);}
.user-btn.active{background:var(--sb-panel);border-color:var(--sb-border);color:var(--sb-text-bright);}
.user-btn .role-chip{
  font-family:var(--mono);font-size:9.5px;font-weight:700;padding:2px 5px;border-radius:3px;
  background:rgba(255,255,255,0.08);color:var(--sb-text-dim);letter-spacing:0.5px;
}
.role-ENG .role-chip{color:#6FA8DC;}
.role-TD .role-chip{color:#E0B060;}
.role-SNT .role-chip{color:#6FC090;}
.role-COA .role-chip{color:#5FC7D8;}
.role-ADMIN .role-chip{color:#E88080;}

#lamp-strip{margin-top:auto;padding-top:12px;border-top:1px solid var(--sb-border);display:flex;flex-direction:column;gap:6px;font-size:10.5px;color:var(--sb-text-dim);}
.lamp-row{display:flex;align-items:center;gap:7px;}
.lamp{width:8px;height:8px;border-radius:50%;flex:none;box-shadow:0 0 6px currentColor;}
.lamp.green{background:var(--green);color:var(--green);}
.lamp.amber{background:var(--amber);color:var(--amber);}
.lamp.red{background:var(--red);color:var(--red);}
.lamp.grey{background:#4A5762;color:#4A5762;box-shadow:none;}

/* ---------- main ---------- */
#main{flex:1;min-width:0;display:flex;flex-direction:column;height:100vh;overflow:hidden;}
#topbar{
  padding:12px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;
  background:var(--panel);
}
#topbar h1{font-size:15px;margin:0;color:var(--text);font-weight:700;}
#topbar .meta{font-family:var(--mono);font-size:11px;color:var(--text-dim);}
#content{flex:1;overflow-y:auto;padding:20px 22px 60px 22px;}

.panel{background:var(--panel);border:none;box-shadow:var(--shadow-sm);border-radius:10px;padding:16px 18px;margin-bottom:18px;}
.panel h2{font-size:12px;text-transform:uppercase;letter-spacing:0.8px;color:var(--text-dim);margin:0 0 14px 0;font-weight:700;}
.panel h2 .accent{color:var(--accent);}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
@media (max-width:900px){.grid-2,.grid-3{grid-template-columns:1fr;}}

label{display:block;font-size:11px;color:var(--text-dim);margin-bottom:4px;margin-top:10px;font-weight:600;}
label:first-child{margin-top:0;}
input[type=text],input[type=number],input[type=date],input[type=password],select,textarea{
  width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);
  padding:7px 9px;border-radius:6px;font-size:12.5px;
}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-tint);}
.checkbox-row{display:flex;align-items:center;gap:6px;margin-top:10px;}
.checkbox-row input{width:auto;}
.checkbox-row label{margin:0;color:var(--text);}

.btn{
  background:var(--accent);color:#FFFFFF;border:1px solid var(--accent);padding:8px 16px;
  border-radius:6px;font-size:12px;font-weight:700;letter-spacing:0.3px;transition:background 0.12s ease, box-shadow 0.12s ease, transform 0.06s ease;
}
.btn:hover{background:var(--accent-dim);border-color:var(--accent-dim);box-shadow:var(--shadow-sm);}
.btn:active{transform:translateY(1px);}
.btn.secondary{background:var(--panel);border-color:var(--border);color:var(--text);}
.btn.secondary:hover{background:var(--panel2);color:var(--text);}
.btn.danger{background:#FFFFFF;border-color:var(--red);color:var(--red);}
.btn.danger:hover{background:var(--red-tint);}
.btn.small{padding:4px 9px;font-size:10.5px;}
.btn:disabled{opacity:0.45;cursor:not-allowed;transform:none;}
.btn-row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;}

.mono{font-family:var(--mono);}
table{width:100%;border-collapse:collapse;font-size:12px;}
th{text-align:left;color:var(--text-dim);font-weight:700;font-size:10.5px;text-transform:uppercase;letter-spacing:0.4px;
  padding:6px 8px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--panel);}
td{padding:7px 8px;border-bottom:1px solid var(--border);vertical-align:top;}
tr:hover td{background:var(--panel2);}
.table-wrap{max-height:420px;overflow-y:auto;border:1px solid var(--border);border-radius:8px;}

.badge{display:inline-block;padding:2px 7px;border-radius:4px;font-size:10px;font-weight:700;font-family:var(--mono);letter-spacing:0.3px;}
.badge.scheduled{background:var(--green-tint);color:var(--green);}
.badge.submitted{background:var(--amber-tint);color:var(--amber);}
.badge.unscheduled{background:var(--red-tint);color:var(--red);}
.badge.draft{background:var(--amber-tint);color:var(--amber);}
.badge.published{background:var(--green-tint);color:var(--green);}
.badge.rejected,.badge.superseded{background:var(--purple-tint);color:var(--purple);}
.badge.dept-ENG{background:var(--blue-tint);color:var(--eng);}
.badge.dept-TD{background:var(--amber-tint);color:var(--td);}
.badge.dept-SNT{background:var(--green-tint);color:var(--snt);}
.badge.src-manual{background:var(--panel2);color:var(--text-dim);}
.badge.src-csv{background:var(--blue-tint);color:var(--accent);}
.badge.src-demo{background:var(--red-tint);color:var(--red);}
.badge.src-adapter{background:var(--panel2);color:var(--text-dim);}

.score-pill{font-family:var(--mono);font-weight:700;color:var(--text-bright);}
.justification{font-size:11px;color:var(--text-dim);margin-top:3px;max-width:520px;}
.small-muted{color:var(--text-dim);font-size:11px;}

.metrics-strip{display:flex;gap:0;border-radius:10px;overflow:hidden;margin-bottom:18px;box-shadow:var(--shadow-sm);background:var(--panel);}
.metric-cell{flex:1;padding:12px 16px;border-right:1px solid var(--border);background:var(--panel);}
.metric-cell:last-child{border-right:none;}
.metric-cell .val{font-family:var(--mono);font-size:20px;color:var(--text-bright);font-weight:700;transition:color 0.2s ease;}
.metric-cell .lbl{font-size:10px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.5px;margin-top:2px;}
.metric-cell.good .val{color:var(--green);}
.metric-cell.warn .val{color:var(--amber);}
.delta-good{color:var(--green);font-weight:700;}
.delta-bad{color:var(--red);font-weight:700;}
.delta-neutral{color:var(--text-dim);}

.toast-wrap{position:fixed;top:16px;right:16px;display:flex;flex-direction:column;gap:8px;z-index:999;}
.toast{padding:10px 14px;border-radius:8px;font-size:12px;max-width:360px;border-left:4px solid;background:var(--panel);box-shadow:var(--shadow-md);color:var(--text);}
.toast.ok{border-left-color:var(--green);}
.toast.err{border-left-color:var(--red);}
.toast.info{border-left-color:var(--accent);}
.toast.warn{border-left-color:var(--amber);}
.toast .toast-title{font-weight:700;margin-bottom:2px;color:var(--text-bright);}
.toast .toast-progress{margin-top:6px;font-family:var(--mono);font-size:10.5px;color:var(--text-dim);}

.row-errors{color:var(--red);font-size:11px;}
.hint{font-size:11px;color:var(--text-dim);margin-top:6px;line-height:1.5;}

/* timeline / gantt — the hero element: bold saturated bars on a clean white track */
#timeline-wrap{overflow-x:auto;}
/* --- Gantt geometry -------------------------------------------------
 * Every day row shares ONE 00:00-24:00 IST scale, so a single time axis
 * at the top lines up with every track below it. --tl-track-min is set
 * per zoom level (day/week/month) on the scroll container and is applied
 * to BOTH the axis column and the day columns, which is what guarantees
 * a tick and the block under it stay pixel-aligned. */
.timeline-day{display:flex;align-items:stretch;margin-bottom:4px;}
.timeline-day-label{width:78px;flex:none;font-family:var(--mono);font-size:10.5px;color:var(--text-dim);padding-top:22px;line-height:1.35;}
.timeline-day-label .tl-dow{color:var(--text);font-weight:700;}
.tl-day-col{flex:1;min-width:var(--tl-track-min,900px);display:flex;flex-direction:column;gap:3px;}
.timeline-track{position:relative;flex:none;width:100%;height:46px;background:#FFFFFF;border:1px solid var(--border);border-radius:6px;}

/* scrollable body with the axis pinned to the top while scrolling */
.tl-scroll{overflow:auto;max-height:min(70vh,720px);border:1px solid var(--border);border-radius:10px;background:var(--panel);padding:0 10px 10px 10px;}
.tl-axis-row{display:flex;align-items:stretch;position:sticky;top:0;z-index:20;background:var(--panel);padding-top:8px;
  border-bottom:1px solid var(--border);margin-bottom:6px;}
.tl-axis-spacer{width:78px;flex:none;font-family:var(--mono);font-size:9px;color:var(--text-dim);
  display:flex;align-items:flex-end;padding-bottom:5px;letter-spacing:0.3px;}
.tl-axis-col{flex:1;min-width:var(--tl-track-min,900px);position:relative;height:30px;}
.tl-tick{position:absolute;top:14px;bottom:0;border-left:1px solid var(--border);}
.tl-tick.major{border-left-color:#AAB4BC;}
.tl-tick-label{position:absolute;top:0;transform:translateX(-50%);font-family:var(--mono);font-size:9.5px;
  color:var(--text-dim);white-space:nowrap;}
.tl-tick-label.major{color:var(--text);font-weight:700;}
.tl-axis-now{position:absolute;top:0;bottom:0;width:2px;background:var(--red);z-index:22;}
.tl-axis-now::after{content:'NOW';position:absolute;top:0;left:3px;font-family:var(--mono);font-size:8.5px;
  font-weight:700;color:#FFFFFF;background:var(--red);padding:0 3px;border-radius:2px;letter-spacing:0.4px;}

/* weather overlay band — sits directly above that day's timeline track so a
   user can SEE why a candidate window was excluded rather than the
   optimizer silently declining it. Colored by severity: clear / elevated
   (soft duration buffer territory) / severe (hard exclusion territory). */
.weather-strip{display:flex;align-items:center;gap:6px;height:18px;padding:0 6px;border-radius:4px;font-size:10px;font-family:var(--mono);white-space:nowrap;overflow:hidden;}
.weather-strip.wx-clear{background:var(--panel2);color:var(--text-dim);}
.weather-strip.wx-elevated{background:var(--amber-tint);color:var(--amber);}
.weather-strip.wx-severe{background:var(--red-tint);color:var(--red);font-weight:700;}
.weather-strip.wx-none{background:transparent;color:var(--text-dim);font-style:italic;opacity:0.7;}
.weather-strip .wx-src-badge{font-family:var(--mono);font-size:8.5px;font-weight:700;padding:0 4px;border-radius:3px;background:var(--red-tint);color:var(--red);letter-spacing:0.3px;}
.wx-reason-badge{display:inline-block;font-family:var(--mono);font-size:9px;font-weight:700;padding:1px 5px;border-radius:3px;background:var(--red-tint);color:var(--red);letter-spacing:0.3px;}
/* gridlines are generated at the SAME tick positions as the axis above,
   so a block edge can be read straight up to a time label */
.timeline-hour-grid{position:absolute;inset:0;pointer-events:none;}
.tl-grid-line{position:absolute;top:0;bottom:0;border-left:1px solid #EEF1F3;}
.tl-grid-line.major{border-left-color:#DDE3E8;}
/* real train movements: deliberately THIN GREY TICKS, visually nothing like
   a bold colored block chip, so context is never mistaken for scheduled work */
.tl-train{position:absolute;top:3px;height:4px;background:#B9C2C9;border-radius:2px;opacity:0.95;}
.tl-slot{position:absolute;top:9px;height:8px;background:var(--green-tint);border:1px solid #BFE3CD;border-radius:3px;}
/* top/height are set inline per lane — see TL_BLOCK_TOP / assignLanes */
.tl-block{position:absolute;top:20px;height:18px;border-radius:4px;border:1px solid rgba(0,0,0,0.12);cursor:default;
  box-shadow:0 1px 2px rgba(20,30,40,0.18);transition:opacity 0.15s ease, filter 0.15s ease, box-shadow 0.15s ease;
  overflow:visible;display:flex;align-items:center;}
/* the times printed ON the chip — the whole point of this panel */
.tl-block-label{font-family:var(--mono);font-size:9.5px;font-weight:700;color:#FFFFFF;line-height:1;
  padding:0 4px;width:100%;overflow:hidden;white-space:nowrap;text-shadow:0 1px 1px rgba(0,0,0,0.35);}
/* chips too narrow for any inner text get their start time just above instead
   of losing it entirely */
/* Placed BESIDE the chip, not above it: blocks are lane-stacked only ~2px
   apart, so an above-chip label would land on the lane above. The space
   immediately right of a short block is almost always free — that is
   precisely why the block is short. */
.tl-block-extlabel{position:absolute;left:calc(100% + 3px);top:50%;transform:translateY(-50%);
  font-family:var(--mono);font-size:8.5px;font-weight:700;color:var(--text-bright);background:var(--panel);
  padding:0 2px;border-radius:2px;white-space:nowrap;pointer-events:none;box-shadow:0 0 0 1px var(--border);z-index:7;}
/* already finished: visibly receded relative to upcoming work */
.tl-block.past{opacity:0.45;filter:saturate(0.55);}
.tl-block.past .tl-block-label{text-shadow:none;}
.tl-block.dept-ENG{background:var(--eng);}
.tl-block.dept-TD{background:var(--td);}
.tl-block.dept-SNT{background:var(--snt);}
/* coordinated (2+ department) blocks: diagonal blend so sharing reads at a glance */
.tl-block.coord-2{background:linear-gradient(135deg, var(--c1) 0%, var(--c1) 48%, var(--c2) 52%, var(--c2) 100%);}
.tl-block.coord-3{background:linear-gradient(135deg, var(--c1) 0%, var(--c1) 32%, var(--c2) 32%, var(--c2) 65%, var(--c3) 65%, var(--c3) 100%);}
.tl-block.linked{box-shadow:0 0 0 2px var(--text-bright), 0 2px 6px rgba(20,30,40,0.3);z-index:6;}
.tl-block.dimmed{opacity:0.28;}
/* Manually overridden blocks (FR-COA-03) must be visually distinct at a
   glance, never only on hover — a corner "hand" marker plus a dashed
   outline, layered on top of whatever dept/coord color the block already
   has, so the optimizer-vs-manual split is legible without interaction. */
.tl-block.override{outline:2px dashed rgba(255,255,255,0.9);outline-offset:-2px;}
.tl-block.override::after{content:'\270B';position:absolute;top:-8px;right:-4px;font-size:10px;line-height:1;
  background:var(--amber);color:#3a2a00;border-radius:50%;width:14px;height:14px;display:flex;align-items:center;
  justify-content:center;box-shadow:0 1px 2px rgba(0,0,0,0.4);z-index:9;}
.badge.manually_removed{background:var(--purple-tint);color:var(--purple);}
.badge.displaced{background:var(--red-tint);color:var(--red);}
.override-chip{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-size:9.5px;font-weight:700;
  padding:2px 7px;border-radius:4px;background:var(--amber-tint);color:var(--amber);letter-spacing:0.3px;}

/* Right-click context menu — empty timeline space -> manual schedule;
   existing block -> unschedule/swap/history. One generic component reused
   for both, styled to match the existing modal-card/btn language. */
.ctx-menu{position:fixed;z-index:1000;min-width:220px;background:var(--panel);border:1px solid var(--border);
  border-radius:8px;box-shadow:0 8px 24px rgba(20,30,40,0.28);padding:4px;font-size:12.5px;}
.ctx-menu-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:5px;cursor:pointer;color:var(--text);}
.ctx-menu-item:hover{background:var(--panel2);}
.ctx-menu-item.danger{color:var(--red);}
.ctx-menu-item[aria-disabled="true"]{color:var(--text-dim);cursor:default;}
.ctx-menu-item[aria-disabled="true"]:hover{background:transparent;}
.ctx-menu-sep{height:1px;background:var(--border);margin:4px 2px;}
.ctx-menu-label{padding:6px 10px 2px;font-size:10px;text-transform:uppercase;letter-spacing:0.4px;color:var(--text-dim);}

/* Manual-override actions are a deliberate, distinct style from routine
   actions (never the plain .btn) — the Control Office should never mistake
   "confirm override" for an everyday button. */
.btn.override{background:var(--amber);border-color:var(--amber);color:#3a2a00;font-weight:700;}
.btn.override:hover{background:#b57616;}
.btn.override:disabled{opacity:0.5;cursor:not-allowed;}
.override-warning-list{margin:8px 0;padding:0;list-style:none;}
.override-warning-list li{background:var(--amber-tint);color:#7a5610;border-left:3px solid var(--amber);
  border-radius:4px;padding:6px 9px;margin-bottom:6px;font-size:11.5px;}
.override-hard-error{background:var(--red-tint);color:var(--red);border-left:3px solid var(--red);
  border-radius:4px;padding:8px 10px;font-size:12px;margin:8px 0;font-weight:600;}
.task-pick-list{max-height:220px;overflow-y:auto;border:1px solid var(--border);border-radius:6px;margin:6px 0;}
.task-pick-row{display:flex;align-items:center;gap:8px;padding:7px 10px;border-bottom:1px solid var(--border);
  cursor:pointer;font-size:12px;}
.task-pick-row:last-child{border-bottom:none;}
.task-pick-row:hover{background:var(--panel2);}
.task-pick-row.selected{background:var(--blue-tint);}
.timeline-legend{display:flex;gap:16px;margin-top:10px;font-size:10.5px;color:var(--text-dim);flex-wrap:wrap;}
.timeline-legend .sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:middle;}

.corridor-picker{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;}
.corridor-picker > div{flex:1;min-width:160px;}
.chip-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
.chip{font-family:var(--mono);font-size:10.5px;padding:3px 8px;border:1px solid var(--border);border-radius:12px;color:var(--text-dim);cursor:pointer;background:var(--panel);}
.chip:hover{border-color:var(--accent);color:var(--accent);}

.weight-row{display:flex;align-items:center;gap:10px;margin-top:10px;}
.weight-row label{margin:0;width:160px;flex:none;}
.weight-row input{width:110px;}
.weight-row .desc{font-size:10.5px;color:var(--text-dim);}

footer.note{font-size:10.5px;color:var(--text-dim);margin-top:24px;padding-top:14px;border-top:1px solid var(--border);}

/* ---------- accessibility: focus ring on every interactive element ---------- */
a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible,
textarea:focus-visible, [tabindex]:focus-visible{
  outline:2px solid var(--accent); outline-offset:2px; border-radius:2px;
}
input:focus-visible, select:focus-visible{ outline-offset:0; }
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}

/* ---------- async section states: loading / error / empty ---------- */
@keyframes shimmer{0%{background-position:-300px 0;}100%{background-position:300px 0;}}
.skeleton-line{height:13px;border-radius:4px;margin-bottom:8px;background:linear-gradient(90deg,#EEF1F3 25%,#F7F9FA 37%,#EEF1F3 63%);background-size:600px 100%;animation:shimmer 1.4s ease-in-out infinite;}
.skeleton-line.w60{width:60%;} .skeleton-line.w80{width:80%;} .skeleton-line.w40{width:40%;}
.state-box{padding:20px 16px;text-align:center;border:1px dashed var(--border);border-radius:10px;background:var(--panel);}
.state-box.error{border-color:#E3B3AD;background:var(--red-tint);}
.state-box .state-icon{font-family:var(--mono);font-size:18px;margin-bottom:6px;}
.state-box.error .state-icon{color:var(--red);}
.state-box .state-msg{color:var(--text);font-size:12px;margin-bottom:10px;}
.state-box.error .state-msg{color:#8A2A21;}
.state-box .state-hint{color:var(--text-dim);font-size:11px;margin-top:4px;}

/* ---------- modal / confirm dialog ---------- */
.modal-overlay{position:fixed;inset:0;background:rgba(15,20,24,0.55);display:flex;align-items:center;justify-content:center;z-index:1000;padding:16px;}
.modal-card{background:var(--panel);border:none;border-radius:12px;padding:22px;max-width:460px;width:100%;box-shadow:var(--shadow-lg);}
.modal-card h3{margin:0 0 10px 0;color:var(--text-bright);font-size:14px;}
.modal-card .modal-body{font-size:12.5px;color:var(--text);line-height:1.6;}
.modal-card .modal-body .summary-line{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--border);font-family:var(--mono);font-size:11.5px;}
.modal-card .btn-row{justify-content:flex-end;margin-top:18px;}
/* the approve/publish modal is deliberately weightier — slower to appear, more shadow, a firmer border accent */
.modal-overlay.weighty{background:rgba(15,20,24,0.68);transition:background 0.28s ease;}
.modal-card.weighty{border-top:4px solid var(--accent);box-shadow:0 24px 64px rgba(20,30,40,0.32), 0 6px 16px rgba(20,30,40,0.14);animation:modalRise 0.42s cubic-bezier(0.16,1,0.3,1);}
@keyframes modalRise{from{opacity:0;transform:translateY(14px) scale(0.98);}to{opacity:1;transform:translateY(0) scale(1);}}
.publish-success{text-align:center;padding:22px 6px 6px 6px;}
.publish-success .ps-icon{width:56px;height:56px;border-radius:50%;background:var(--green-tint);color:var(--green);display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 16px auto;animation:psPop 0.5s cubic-bezier(0.34,1.56,0.64,1);}
@keyframes psPop{0%{transform:scale(0);opacity:0;}70%{transform:scale(1.12);}100%{transform:scale(1);opacity:1;}}
.publish-success h3{margin-bottom:6px;}
.publish-success p{color:var(--text-dim);font-size:12.5px;}

/* ---------- filters ---------- */
.filter-bar{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-bottom:12px;padding:10px;background:var(--panel2);border-radius:8px;}
.filter-bar > div{min-width:130px;}
.filter-bar label{margin:0 0 3px 0;}
.active-filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;}
.filter-chip{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10.5px;padding:3px 6px 3px 9px;border-radius:12px;background:var(--blue-tint);color:var(--eng);border:1px solid #C9DCEE;}
.filter-chip button{background:none;border:none;color:inherit;padding:0 2px;font-size:12px;line-height:1;}

/* ---------- data table: sortable / searchable / paginated / bulk-select ---------- */
.table-toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap;}
.table-search{max-width:220px;}
th.sortable{cursor:pointer;user-select:none;}
th.sortable button{background:none;border:none;color:inherit;font:inherit;text-transform:inherit;letter-spacing:inherit;padding:0;cursor:pointer;display:flex;align-items:center;gap:4px;}
th.sortable .sort-arrow{font-size:9px;opacity:0.4;}
th.sortable.sorted .sort-arrow{opacity:1;color:var(--accent);}
.bulk-bar{display:none;align-items:center;gap:10px;background:var(--blue-tint);border:1px solid #C9DCEE;border-radius:8px;padding:8px 10px;margin-bottom:8px;font-size:11.5px;}
.bulk-bar.active{display:flex;}
.pagination{display:flex;align-items:center;gap:8px;justify-content:flex-end;margin-top:8px;font-size:11px;color:var(--text-dim);}
.pagination button{background:var(--panel);border:1px solid var(--border);color:var(--text);padding:3px 9px;border-radius:5px;font-size:11px;}
.pagination button:disabled{opacity:0.35;cursor:not-allowed;}

/* ---------- keyboard shortcuts overlay ---------- */
.shortcuts-hint{position:fixed;bottom:14px;right:14px;font-size:10.5px;color:var(--text-dim);background:var(--panel);border:none;box-shadow:var(--shadow-sm);padding:5px 10px;border-radius:14px;z-index:50;}
.shortcuts-hint kbd{font-family:var(--mono);background:var(--panel2);padding:1px 5px;border-radius:3px;color:var(--text-bright);}
.shortcuts-table{width:100%;font-size:12px;}
.shortcuts-table td{padding:6px 4px;border-bottom:1px solid var(--border);}
.shortcuts-table kbd{font-family:var(--mono);background:var(--panel2);border:1px solid var(--border);padding:2px 7px;border-radius:4px;color:var(--text-bright);}

/* ---------- timeline v2: zoom/pan controls, now-marker, detail panel, drag ---------- */
.tl-toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px;}
.tl-zoom-group{display:flex;gap:4px;}
.tl-zoom-group button.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.tl-now-marker{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--red);z-index:8;box-shadow:0 0 4px rgba(196,57,47,0.5);}
.tl-now-marker::before{content:'NOW';position:absolute;top:-2px;left:3px;font-family:var(--mono);font-size:8px;
  font-weight:700;color:#FFFFFF;background:var(--red);padding:0 3px;border-radius:2px;letter-spacing:0.4px;}
/* rich hover tooltip — full block detail without needing to click */
#tl-tooltip{position:fixed;z-index:999;max-width:320px;background:var(--sb-bg);color:var(--sb-text-bright);
  border-radius:8px;padding:10px 12px;font-size:11.5px;line-height:1.55;box-shadow:var(--shadow-lg);
  pointer-events:none;opacity:0;transition:opacity 0.12s ease;}
#tl-tooltip.visible{opacity:1;}
#tl-tooltip .tt-title{font-family:var(--mono);font-weight:700;font-size:12px;margin-bottom:5px;color:#FFFFFF;}
#tl-tooltip .tt-row{display:flex;justify-content:space-between;gap:14px;}
#tl-tooltip .tt-k{color:var(--sb-text-dim);}
#tl-tooltip .tt-v{font-family:var(--mono);color:var(--sb-text-bright);text-align:right;}
#tl-tooltip .tt-sep{height:1px;background:var(--sb-border);margin:6px 0;}
.tl-block{cursor:grab;touch-action:none;}
.tl-block:active{cursor:grabbing;}
.tl-block.dragging{opacity:0.9;z-index:10;box-shadow:0 6px 18px rgba(20,30,40,0.35);}
.tl-block.drag-valid{outline:3px solid var(--green);outline-offset:1px;}
.tl-block.drag-invalid{outline:3px solid var(--red);outline-offset:1px;}
.tl-block.selected{outline:2px solid var(--text-bright);outline-offset:1px;}
.tl-block.entering{animation:blockEnter 0.42s cubic-bezier(0.16,1,0.3,1) both;}
@keyframes blockEnter{from{opacity:0;transform:translateY(5px) scaleX(0.85);}to{opacity:1;transform:translateY(0) scaleX(1);}}
.timeline-track{position:relative;}
.timeline-split{display:flex;gap:16px;align-items:flex-start;}
.timeline-split > .tl-main{flex:1;min-width:0;}
.tl-detail-panel{width:280px;flex:none;background:var(--panel2);border-radius:10px;padding:14px;position:sticky;top:0;}
.tl-detail-panel h4{margin:0 0 10px 0;font-size:12px;color:var(--text-bright);}
.tl-detail-panel .dp-row{margin-bottom:9px;font-size:11.5px;}
.tl-detail-panel .dp-label{color:var(--text-dim);font-size:10px;text-transform:uppercase;letter-spacing:0.4px;margin-bottom:2px;}
.tl-drag-reason{font-size:11px;color:var(--red);background:var(--red-tint);border-radius:6px;padding:6px 8px;margin-top:6px;}
@media (max-width:1100px){.timeline-split{flex-direction:column;} .tl-detail-panel{width:100%;position:static;}}

/* ---------- FLIP re-sort transition helper ---------- */
.flip-move{transition:transform 0.35s cubic-bezier(0.2,0.6,0.2,1);}

/* ---------- sidebar navigation ---------- */
#main-nav{display:flex;flex-direction:column;gap:3px;}
.nav-btn{display:flex;align-items:center;gap:8px;background:transparent;border:1px solid transparent;color:var(--sb-text);
  padding:7px 8px;border-radius:6px;text-align:left;font-size:12.5px;width:100%;}
.nav-btn:hover{background:var(--sb-panel);}
.nav-btn.active{background:var(--sb-panel);border-color:var(--sb-border);color:var(--sb-text-bright);font-weight:700;}
.nav-btn .nav-ico{width:16px;text-align:center;color:#5FA8E0;}

/* ---------- Feature 10: crew / resource utilization strip ---------- */
.resource-strip{display:flex;align-items:stretch;gap:0;border-radius:10px;overflow:hidden;margin:-8px 0 18px 0;box-shadow:var(--shadow-sm);background:var(--panel);flex-wrap:wrap;}
.rs-label{padding:10px 14px;font-size:10px;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-dim);display:flex;align-items:center;border-right:1px solid var(--border);background:var(--panel2);max-width:150px;line-height:1.4;}
.rs-cell{flex:1;min-width:170px;padding:9px 14px;border:none;border-right:1px solid var(--border);background:var(--panel);text-align:left;cursor:pointer;
  border-top:3px solid transparent;font-family:var(--sans);color:var(--text);}
.rs-cell:last-child{border-right:none;}
.rs-cell:hover{background:var(--panel2);}
.rs-cell .rs-val{font-family:var(--mono);font-size:16px;font-weight:700;color:var(--text-bright);}
.rs-cell .rs-sub{font-size:10.5px;color:var(--text-dim);margin-top:2px;}
.rs-cell.rs-green{border-top-color:var(--green);} .rs-cell.rs-green .rs-val{color:var(--green);}
.rs-cell.rs-amber{border-top-color:var(--amber);} .rs-cell.rs-amber .rs-val{color:var(--amber);}
.rs-cell.rs-red{border-top-color:var(--red);background:var(--red-tint);} .rs-cell.rs-red .rs-val{color:var(--red);}
.crew-reason-badge{display:inline-block;font-family:var(--mono);font-size:9px;font-weight:700;padding:1px 5px;border-radius:3px;background:var(--purple-tint);color:var(--purple);letter-spacing:0.3px;margin-right:5px;}
.gang-chip{display:inline-block;font-family:var(--mono);font-size:9.5px;font-weight:700;padding:1px 6px;border-radius:3px;background:var(--panel2);color:var(--text-bright);border:1px solid var(--border);white-space:nowrap;}
.gang-chip.dept-ENG{border-color:#B9D0E8;background:var(--blue-tint);color:var(--eng);}
.gang-chip.dept-TD{border-color:#EED8B0;background:var(--amber-tint);color:#8a5d10;}
.gang-chip.dept-SNT{border-color:#BFE3CD;background:var(--green-tint);color:var(--snt);}
/* timeline gang lanes: a faint lane band + label per gang */
.tl-gang-lane{position:absolute;left:0;right:0;border-top:1px dashed #E3E8EC;pointer-events:none;}
.tl-gang-label{position:absolute;left:3px;font-family:var(--mono);font-size:8.5px;font-weight:700;color:var(--text-dim);background:rgba(255,255,255,0.85);padding:0 3px;border-radius:2px;pointer-events:none;z-index:1;line-height:12px;}
.gang-sheet-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;margin-top:12px;}
.gang-sheet{border:1px solid var(--border);border-radius:8px;padding:10px 12px;background:var(--panel);}
.gang-sheet h4{margin:0 0 6px 0;font-size:12.5px;display:flex;justify-content:space-between;align-items:center;gap:6px;}
.gang-sheet ol{margin:0;padding-left:18px;font-size:11.5px;line-height:1.6;}
.capacity-warning{background:var(--amber-tint);color:#7a5610;border-left:3px solid var(--amber);border-radius:4px;padding:7px 10px;font-size:11.5px;margin-top:8px;}
.capacity-warning.ok{background:var(--green-tint);color:var(--green);border-left-color:var(--green);}

/* ---------- Feature 11: live railway network map ---------- */
#content.map-mode{padding:0;overflow:hidden;display:flex;flex-direction:column;}
.map-view{display:flex;flex-direction:column;flex:1;min-height:0;}
.map-toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--border);font-size:11.5px;}
.map-toolbar label{margin:0;display:inline;font-size:11px;}
.map-toolbar input[type=date],.map-toolbar select{width:auto;padding:4px 6px;font-size:11.5px;}
.map-toolbar .map-meta{font-family:var(--mono);font-size:10.5px;color:var(--text-dim);}
.map-toolbar .map-updated{font-family:var(--mono);font-size:11px;color:var(--text);background:var(--panel2);padding:3px 8px;border-radius:10px;}
.map-banner{display:flex;align-items:center;gap:8px;padding:4px 10px;border-radius:14px;background:var(--blue-tint);color:var(--eng);font-size:11px;font-weight:600;}
#net-map{flex:1;min-height:420px;background:#DDE6EC;}
.map-status-chip{display:inline-block;font-family:var(--mono);font-size:9.5px;font-weight:700;padding:1px 6px;border-radius:3px;text-transform:uppercase;letter-spacing:0.3px;}
.map-status-chip.st-active{background:var(--red-tint);color:var(--red);}
.map-status-chip.st-upcoming{background:var(--amber-tint);color:var(--amber);}
.map-status-chip.st-completed{background:var(--green-tint);color:var(--green);}
.map-status-chip.st-clear{background:var(--panel2);color:var(--text-dim);}
/* active corridors (SVG renderer): pulsing red with a soft glow */
@keyframes mapPulse{0%,100%{stroke-opacity:1;}50%{stroke-opacity:0.55;}}
@keyframes mapGlow{0%,100%{stroke-width:12px;stroke-opacity:0.18;}50%{stroke-width:18px;stroke-opacity:0.34;}}
.map-corridor-active{animation:mapPulse 1.6s ease-in-out infinite;}
.map-corridor-glow{animation:mapGlow 1.6s ease-in-out infinite;}
/* status-change flash: a wide yellow halo that blinks three times, drawn under the corridor line */
@keyframes mapFlash{0%{stroke-opacity:0;}12%,40%,68%{stroke-opacity:0.95;}26%,54%{stroke-opacity:0.1;}100%{stroke-opacity:0;}}
.map-flash{animation:mapFlash 2.6s ease-in-out 1 forwards;}
.map-focus-outline{stroke-dasharray:10 7;}
.leaflet-tooltip.map-station-label{background:rgba(255,255,255,0.88);border:none;box-shadow:none;padding:0 3px;font-family:var(--mono);font-size:9.5px;font-weight:700;color:#1A2226;}
.leaflet-tooltip.map-station-label::before{display:none;}
.leaflet-tooltip.map-gang-label{background:var(--sb-bg);color:#fff;border:none;font-family:var(--mono);font-size:10px;font-weight:700;padding:2px 6px;}
.leaflet-tooltip.map-gang-label::before{border-top-color:var(--sb-bg);}
.map-popup{font-family:var(--sans);font-size:12px;line-height:1.5;min-width:260px;max-height:360px;overflow-y:auto;}
.map-popup h4{margin:0 0 4px 0;font-size:13px;font-family:var(--mono);display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
.map-popup .mp-sub{color:var(--text-dim);font-size:11px;margin-bottom:6px;}
.map-popup .mp-sec{margin-top:8px;padding-top:6px;border-top:1px solid var(--border);}
.map-popup .mp-sec-title{font-size:9.5px;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-dim);font-weight:700;margin-bottom:3px;}
.map-popup .mp-block{padding:4px 0;border-bottom:1px dashed var(--border);}
.map-popup .mp-block:last-child{border-bottom:none;}
.map-popup .mp-task{font-size:11px;display:flex;gap:5px;align-items:center;flex-wrap:wrap;margin-top:2px;}
.map-popup .btn{margin-top:4px;}
.map-legend{background:var(--panel);border-radius:8px;box-shadow:var(--shadow-md);padding:8px 10px;font-size:11px;min-width:150px;}
.map-legend .ml-head{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:700;cursor:pointer;user-select:none;}
.map-legend .ml-row{display:flex;align-items:center;gap:7px;margin-top:5px;}
.map-legend .ml-line{display:inline-block;width:22px;border-radius:2px;}
.map-legend .ml-dot{display:inline-block;width:10px;height:10px;border-radius:50%;}
.map-legend.collapsed .ml-body{display:none;}

/* ---------- narrow-width graceful degradation ---------- */
@media (max-width:860px){
  #app-shell[hidden]{display:none;}
  #app-shell{flex-direction:column;height:auto;}
  #sidebar{width:100%;min-width:0;flex-direction:row;flex-wrap:wrap;height:auto;padding:10px 12px;gap:10px;}
  #brand{border-bottom:none;padding:0;flex:none;}
  #lamp-strip{margin-top:0;padding-top:0;border-top:none;flex-direction:row;flex-wrap:wrap;gap:12px;}
  #main{height:auto;}
  #content{padding:14px;}
  .grid-2,.grid-3{grid-template-columns:1fr;}
  .timeline-track{min-width:600px;}
}
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-card">
    <div class="logo">ABPS<span class="dot">&#9679;</span></div>
    <div class="sub">Automatic Block Planning &mdash; Sign In</div>
    <form id="login-form">
      <label>Username</label>
      <input type="text" name="username" autocomplete="username" required autofocus />
      <label>Password</label>
      <input type="password" name="password" autocomplete="current-password" required />
      <div id="login-error"></div>
      <button type="submit" class="btn">Sign In</button>
    </form>
    <div class="login-hint">Demo accounts: eng.desk / td.desk / snt.desk / coa.controller / admin.
    Passwords are printed to the server console on startup &mdash; see README.md.</div>
  </div>
</div>

<div id="app-shell" hidden>
  <div id="sidebar">
    <div id="brand">
      <div class="logo">ABPS<span class="dot">&#9679;</span></div>
      <div class="sub">Automatic Block Planning</div>
    </div>

    <div>
      <div class="sidebar-section-label">Signed in as</div>
      <div id="user-switcher"></div>
    </div>

    <div id="lamp-strip" role="status" aria-live="polite">
      <div class="lamp-row"><span class="lamp grey" id="lamp-api" role="img" aria-label="API status: unknown"></span><span id="lamp-api-txt">API</span></div>
      <div class="lamp-row"><span class="lamp grey" id="lamp-timetable" role="img" aria-label="Timetable status: unknown"></span><span id="lamp-timetable-txt">Timetable data</span></div>
      <div class="lamp-row"><span class="lamp grey" id="lamp-plan" role="img" aria-label="Plan status: unknown"></span><span id="lamp-plan-txt">Weekly plan</span></div>
    </div>
  </div>

  <div id="main">
    <div id="topbar">
      <h1 id="view-title">ABPS</h1>
      <div class="meta" id="clock"></div>
    </div>
    <div id="content"></div>
  </div>
</div>

<div class="toast-wrap" id="toasts" role="status" aria-live="polite"></div>
<div id="modal-root"></div>

<script>
/* ============================== state & api ============================== */
const state = {
  accessToken: null,
  refreshToken: null,   // null while impersonating (impersonation tokens are access-only)
  currentUser: null,    // {user_id, name, role, department}
  adminSession: null,   // stashed {accessToken, refreshToken, user} while impersonating
  horizon: 'weekly',
  lastImportResult: null, // {department, html} — survives the re-render an import triggers
  view: 'home',          // 'home' (the role's own desk) | 'map' (Network Map, every role)
  mapIntent: null,       // {focusCorridor, highlightDept, date} handed to the map view on open
  pendingTimelineCorridor: null, // set by the map's "View timeline" link, consumed by renderCOA
};

// Toast notifications: 'ok'|'err'|'info'|'warn', auto-dismiss, stackable.
// This — not window.alert() — is the ONLY feedback mechanism used anywhere
// in this app; there are no alert() calls to replace.
function toast(msg, kind, opts){
  kind = kind || 'info';
  opts = opts || {};
  const el = document.createElement('div');
  el.className = 'toast ' + kind;
  el.setAttribute('role', kind === 'err' ? 'alert' : 'status');
  if(opts.title){
    const t = document.createElement('div');
    t.className = 'toast-title';
    t.textContent = opts.title;
    el.appendChild(t);
  }
  const body = document.createElement('div');
  body.textContent = msg;
  el.appendChild(body);
  document.getElementById('toasts').appendChild(el);
  const life = opts.sticky ? null : (opts.duration || 5500);
  if(life) setTimeout(()=>el.remove(), life);
  return el; // caller can .remove() early or mutate contents (used by the scheduler-run progress toast)
}

// Custom, theme-matched confirmation modal — replaces window.confirm() for
// irreversible actions (publishing a plan, rejecting one, bulk-flagging).
// Resolves true/false. Focus is trapped to the dialog and Escape cancels.
function confirmDialog({title, bodyHtml, confirmLabel, cancelLabel, danger, weighty, confirmDelayMs}){
  return new Promise((resolve)=>{
    const root = document.getElementById('modal-root');
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay' + (weighty ? ' weighty' : '');
    overlay.setAttribute('role', 'presentation');
    overlay.innerHTML = `
      <div class="modal-card${weighty ? ' weighty' : ''}" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <h3 id="modal-title">${escapeHtml(title)}</h3>
        <div class="modal-body">${bodyHtml}</div>
        <div class="btn-row">
          <button class="btn secondary" id="modal-cancel">${escapeHtml(cancelLabel || 'Cancel')}</button>
          <button class="btn ${danger ? 'danger' : ''}" id="modal-confirm">${escapeHtml(confirmLabel || 'Confirm')}</button>
        </div>
      </div>`;
    root.appendChild(overlay);

    const confirmBtn = overlay.querySelector('#modal-confirm');
    const cancelBtn = overlay.querySelector('#modal-cancel');
    const previouslyFocused = document.activeElement;

    // Deliberate slowdown for weighty confirmations (publishing a plan): the
    // confirm button is briefly disabled so accepting takes a real, felt
    // pause — a genuine interaction difference, not just a visual one, and
    // the one place in this UI where motion slows down instead of speeding up.
    if(confirmDelayMs){
      confirmBtn.disabled = true;
      const original = confirmBtn.textContent;
      let remaining = Math.ceil(confirmDelayMs/1000);
      confirmBtn.textContent = `${original} (${remaining})`;
      const tick = setInterval(()=>{
        remaining -= 1;
        if(remaining > 0) confirmBtn.textContent = `${original} (${remaining})`;
      }, 1000);
      setTimeout(()=>{ clearInterval(tick); confirmBtn.disabled = false; confirmBtn.textContent = original; }, confirmDelayMs);
    }

    function close(result){
      root.removeChild(overlay);
      document.removeEventListener('keydown', onKeydown, true);
      if(previouslyFocused && previouslyFocused.focus) previouslyFocused.focus();
      resolve(result);
    }
    function onKeydown(ev){
      if(ev.key === 'Escape'){ ev.preventDefault(); close(false); }
      if(ev.key === 'Tab'){
        const focusables = overlay.querySelectorAll('button');
        const first = focusables[0], last = focusables[focusables.length-1];
        if(ev.shiftKey && document.activeElement === first){ ev.preventDefault(); last.focus(); }
        else if(!ev.shiftKey && document.activeElement === last){ ev.preventDefault(); first.focus(); }
      }
    }
    confirmBtn.onclick = ()=>close(true);
    cancelBtn.onclick = ()=>close(false);
    overlay.addEventListener('click', (ev)=>{ if(ev.target === overlay) close(false); });
    document.addEventListener('keydown', onKeydown, true);
    (confirmDelayMs ? cancelBtn : confirmBtn).focus(); // a disabled button can't receive focus
  });
}

// A published plan is a real, weighty event — it closes real corridors —
// so it gets a distinct success STATE, not a small toast that could be
// missed. Requires an explicit "Done" click to dismiss.
function showPublishSuccessModal({planId, horizon, blocks, corridors, departments}){
  return new Promise((resolve)=>{
    const root = document.getElementById('modal-root');
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay weighty';
    overlay.innerHTML = `
      <div class="modal-card weighty" role="dialog" aria-modal="true" aria-labelledby="publish-success-title">
        <div class="publish-success">
          <div class="ps-icon" aria-hidden="true">&#10003;</div>
          <h3 id="publish-success-title">Plan Published</h3>
          <p><span class="mono">${escapeHtml(planId)}</span> is now live for every department's ${escapeHtml(horizon)} dashboard.</p>
          <div class="modal-body" style="text-align:left;margin-top:14px;">
            <div class="summary-line"><span>Blocks now closing the corridor</span><span class="mono">${blocks}</span></div>
            <div class="summary-line"><span>Corridors affected</span><span class="mono">${corridors}</span></div>
            <div class="summary-line"><span>Departments affected</span><span class="mono">${departments}</span></div>
          </div>
        </div>
        <div class="btn-row" style="justify-content:center;">
          <button class="btn" id="publish-success-done">Done</button>
        </div>
      </div>`;
    root.appendChild(overlay);
    const doneBtn = overlay.querySelector('#publish-success-done');
    function close(){ root.removeChild(overlay); resolve(); }
    doneBtn.onclick = close;
    overlay.addEventListener('click', (ev)=>{ if(ev.target === overlay) close(); });
    doneBtn.focus();
  });
}

/* Generic right-click / long-press context menu (FR-COA-03's manual-override
 * entry points: empty timeline space -> "Manually schedule a task here",
 * an existing block -> unschedule/swap/history). One reusable component
 * rather than a bespoke menu per call site — items are
 * {label, danger, disabled, disabledReason, onSelect}. Dismissed on outside
 * click, Escape, or scroll, and repositioned to stay on-screen. */
function showContextMenu(x, y, items){
  closeContextMenu();
  const menu = document.createElement('div');
  menu.className = 'ctx-menu';
  menu.setAttribute('role', 'menu');
  menu.innerHTML = items.map((it, i)=>{
    if(it.separator) return '<div class="ctx-menu-sep"></div>';
    if(it.label_only) return `<div class="ctx-menu-label">${escapeHtml(it.label_only)}</div>`;
    const disabled = !!it.disabled;
    return `<div class="ctx-menu-item${it.danger?' danger':''}" role="menuitem" tabindex="0" data-idx="${i}"
      aria-disabled="${disabled}" title="${disabled && it.disabledReason ? escapeHtml(it.disabledReason) : ''}">${escapeHtml(it.label)}</div>`;
  }).join('');
  document.body.appendChild(menu);

  // Position after measuring, then clamp so it never renders off-screen.
  const rect = menu.getBoundingClientRect();
  const left = Math.min(x, window.innerWidth - rect.width - 8);
  const top = Math.min(y, window.innerHeight - rect.height - 8);
  menu.style.left = Math.max(4, left) + 'px';
  menu.style.top = Math.max(4, top) + 'px';

  menu.querySelectorAll('.ctx-menu-item').forEach(el=>{
    el.addEventListener('click', ()=>{
      const it = items[parseInt(el.dataset.idx, 10)];
      if(it.disabled) return;
      closeContextMenu();
      it.onSelect && it.onSelect();
    });
  });

  window._ctxMenuEl = menu;
  window._ctxMenuOutsideHandler = (ev)=>{ if(!menu.contains(ev.target)) closeContextMenu(); };
  window._ctxMenuKeyHandler = (ev)=>{ if(ev.key === 'Escape') closeContextMenu(); };
  setTimeout(()=>{
    document.addEventListener('click', window._ctxMenuOutsideHandler, true);
    document.addEventListener('contextmenu', window._ctxMenuOutsideHandler, true);
    document.addEventListener('keydown', window._ctxMenuKeyHandler, true);
    window.addEventListener('scroll', closeContextMenu, true);
  }, 0);
}
function closeContextMenu(){
  if(window._ctxMenuEl){ window._ctxMenuEl.remove(); window._ctxMenuEl = null; }
  if(window._ctxMenuOutsideHandler){
    document.removeEventListener('click', window._ctxMenuOutsideHandler, true);
    document.removeEventListener('contextmenu', window._ctxMenuOutsideHandler, true);
  }
  if(window._ctxMenuKeyHandler) document.removeEventListener('keydown', window._ctxMenuKeyHandler, true);
  window.removeEventListener('scroll', closeContextMenu, true);
}

/* ============================== Corridor Search (§10) ==============================
 * Reachable from EVERY role via the sidebar button (renderSidebar), not one
 * department's view — read-only, never touches scheduling/the optimizer/
 * governance. All times shown are IST, explicitly labeled, via the exact
 * same fmtDt()/toIST()/_tlMinutesOfDay() helpers the rest of the app uses —
 * this feature was built IST-correct from the start rather than retrofitted. */
async function openCorridorSearch(){
  const root = document.getElementById('modal-root');
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay weighty';
  const todayIst = istDateStr(new Date());
  overlay.innerHTML = `
    <div class="modal-card weighty" role="dialog" aria-modal="true" aria-labelledby="cs-title" style="max-width:960px;width:95vw;max-height:88vh;overflow-y:auto;text-align:left;">
      <h3 id="cs-title">Corridor Search</h3>
      <p class="small-muted" style="margin-top:-6px;">Every real train, the weather forecast, and existing corridor context between two stations, for one IST date. Read-only.</p>
      <form id="cs-form" class="grid-3" style="margin-top:12px;">
        <div><label for="cs-from">From station</label><input type="text" id="cs-from" list="cs-station-list" placeholder="code or name" required autocomplete="off" /></div>
        <div><label for="cs-to">To station</label><input type="text" id="cs-to" list="cs-station-list" placeholder="code or name" required autocomplete="off" /></div>
        <div><label for="cs-date">Date (IST)</label><input type="date" id="cs-date" value="${todayIst}" required /></div>

      </form>

      <div class="btn-row" style="justify-content:flex-end;">
        <button class="btn secondary" id="cs-close-btn">Close</button>
      </div>
    </div>`;
  root.appendChild(overlay);

  function close(){ root.removeChild(overlay); document.removeEventListener('keydown', onKeydown, true); }
  function onKeydown(ev){ if(ev.key === 'Escape'){ ev.preventDefault(); close(); } }
  overlay.querySelector('#cs-close-btn').onclick = close;
  overlay.addEventListener('click', (ev)=>{ if(ev.target === overlay) close(); });
  document.addEventListener('keydown', onKeydown, true);

  // Autocomplete is a convenience only — typing an exact station code still
  // works without it, so a failure here is silently tolerated.
  try{
    const stations = await api('/api/stations?limit=500');
    document.getElementById('cs-station-list').innerHTML = stations.map(s=>`<option value="${escapeHtml(s.station_code)} - ${escapeHtml(s.station_name)}">`).join('');

// The datalist option text is "CODE - Name"; a user picking from it (or
// just typing a code/substring) both work since the backend does its own
// fuzzy resolution — this just strips the "- Name" suffix when present so
// an autocompleted selection doesn't get sent as one long, unmatchable string.
function _csStationQuery(raw){ return raw.split(' - ')[0].trim(); }

async function runCorridorSearch(overlay){
  const resultsEl = overlay.querySelector('#cs-results');
  const from_station = _csStationQuery(overlay.querySelector('#cs-from').value.trim());
  const to_station = _csStationQuery(overlay.querySelector('#cs-to').value.trim());
  const date = overlay.querySelector('#cs-date').value; // IST calendar date, as typed
  resultsEl.innerHTML = `<div class="skeleton-line w80"></div><div class="skeleton-line w60"></div><div class="skeleton-line w40"></div>`;

  let r;
  try{
    r = await api(`/api/corridor-search?from_station=${encodeURIComponent(from_station)}&to_station=${encodeURIComponent(to_station)}&date=${encodeURIComponent(date)}`);
  }catch(e){
    resultsEl.innerHTML = `<div class="state-box error"><div class="state-icon">&#9888;</div><div class="state-msg">${escapeHtml(e.message)}</div>
      <button class="btn secondary small" id="cs-retry-btn">Retry</button></div>`;
    const retryBtn = resultsEl.querySelector('#cs-retry-btn');
    if(retryBtn) retryBtn.onclick = ()=>runCorridorSearch(overlay);
    return;
  }

  resultsEl.innerHTML = renderCorridorSearchResult(r);
  renderSortableTable('cs-trains-table', r.trains, {
    rowKey: t=>t.train_number + ':' + t.direction, defaultSortKey: 'departure_ist', searchFields: ['train_number','train_name'], pageSize: 20,
    emptyMessage: 'No real trains found for this corridor on this date.',
    columns: [
      {key:'train_number', label:'Train', sortable:true, render:t=>`<span class="mono">${escapeHtml(t.train_number)}</span>`},
      {key:'train_name', label:'Name', sortable:true, render:t=>escapeHtml(t.train_name || '')},
      {key:'direction', label:'Direction', sortable:true, render:t=>`<span class="badge ${t.direction==='forward'?'dept-ENG':'dept-TD'}">${escapeHtml(t.direction)}</span>`},
      {key:'departure_ist', label:'Departure (IST)', sortable:true, render:t=>`<span class="mono">${fmtDt(t.departure_ist,{noLabel:true})}</span> <span class="small-muted">${escapeHtml(t.from_station_code)}</span>`},
      {key:'arrival_ist', label:'Arrival (IST)', sortable:true, render:t=>`<span class="mono">${fmtDt(t.arrival_ist,{noLabel:true})}</span> <span class="small-muted">${escapeHtml(t.to_station_code)}</span>`},
      {key:'service_type', label:'Service', render:t=>t.service_type ? escapeHtml(t.service_type) : '&mdash;'},
    ],
  });
}

    <h4 style="margin:14px 0 6px;">Corridor Timeline</h4>
    ${timelineHtml}

    <h4 style="margin:14px 0 6px;">Corridor Availability</h4>

  `;
}

async function api(path, opts, _isRetry){
  opts = opts || {};
  const headers = opts.headers ? {...opts.headers} : {};
  if(state.accessToken){ headers['Authorization'] = 'Bearer ' + state.accessToken; }
  if(opts.body && !(opts.body instanceof FormData)){
    headers['Content-Type'] = 'application/json';
    opts.body = JSON.stringify(opts.body);
  }
  let res;
  try{
    res = await fetch(path, {...opts, headers});
    setLamp('api', 'green', 'API');
  }catch(e){
    setLamp('api', 'red', 'API unreachable');
    // A fetch-level failure (backend down, DNS, CORS, offline) has no HTTP
    // status at all — tagged 0 so callers can tell "server said no" (404,
    // 400...) apart from "there is no server to ask." This is what makes it
    // possible for a panel to show "no plan yet, run the scheduler" for a
    // real 404 while still showing a hard error+retry when the backend is
    // simply unreachable, instead of conflating the two into one silent
    // empty state.
    const err = new Error('Cannot reach the ABPS server — it may be down. Check the API status lamp and retry.');
    err.status = 0;
    err.networkError = true;
    throw err;
  }

  // 401: the access token is missing/expired/invalid. Try exactly one silent
  // refresh-and-retry (this is the whole point of keeping a refresh token
  // around); if that doesn't work, this is a real "please log in again."
  if(res.status === 401 && !_isRetry){
    const refreshed = await tryRefresh();
    if(refreshed){ return api(path, opts, true); }
    handleSessionExpired();
    const err = new Error('Session expired — please log in again.');
    err.status = 401;
    throw err;
  }

  // 403: the caller IS authenticated, just not permitted. Distinct from 401
  // on purpose — the user needs to know which one happened.
  if(res.status === 403){
    let detail = 'Forbidden';
    try{ const j = await res.json(); detail = j.detail || detail; }catch(e){}
    const err = new Error("You don't have permission to do that: " + detail);
    err.status = 403;
    throw err;
  }

  if(!res.ok){
    let detail = res.statusText;
    try{ const j = await res.json(); detail = j.detail || JSON.stringify(j); }catch(e){}
    const err = new Error(detail);
    err.status = res.status;
    throw err;
  }
  const ct = res.headers.get('content-type') || '';
  if(ct.includes('application/json')) return res.json();
  return res.text();
}

async function tryRefresh(){
  if(!state.refreshToken) return false;
  try{
    const res = await fetch('/api/auth/refresh', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({refresh_token: state.refreshToken}),
    });
    if(!res.ok) return false;
    const data = await res.json();
    state.accessToken = data.access_token;
    state.refreshToken = data.refresh_token;
    return true;
  }catch(e){ return false; }
}

function handleSessionExpired(){
  // If an admin was impersonating someone and the (access-only, non-
  // refreshable) impersonated session expired, fall back to the admin's own
  // still-valid session instead of forcing a full re-login.
  if(state.adminSession){
    const admin = state.adminSession;
    state.accessToken = admin.accessToken;
    state.refreshToken = admin.refreshToken;
    state.currentUser = admin.user;
    state.adminSession = null;
    toast('The impersonated session expired — back to your admin session.', 'info');
    renderSidebar();
    render();
    return;
  }
  state.accessToken = null;
  state.refreshToken = null;
  state.currentUser = null;
  showLogin('Your session expired. Please log in again.');
}

function setLamp(key, color, text){
  const l = document.getElementById('lamp-'+key);
  const t = document.getElementById('lamp-'+key+'-txt');
  if(l){
    l.className = 'lamp ' + color;
    if(text) l.setAttribute('aria-label', t ? (t.textContent + ' status: ' + text) : ('status: ' + text));
  }
  if(t && text){ t.textContent = text; }
}

/* ============================== generic async section loader ============================== *
 * Every data-dependent panel in this app goes through this instead of a
 * bare Promise.all + innerHTML swap, so a failed fetch always shows a real
 * error state with a working Retry button (never a silently blank panel),
 * loading always shows a skeleton, and an empty result always explains what
 * to do next instead of rendering nothing. */
async function loadSection(containerId, loaderFn, renderFn, opts){
  opts = opts || {};
  const el = document.getElementById(containerId);
  if(!el) return null;
  el.innerHTML = opts.skeleton || `
    <div class="skeleton-line w80"></div><div class="skeleton-line w60"></div><div class="skeleton-line w40"></div>
  `;
  let data;
  try{
    data = await loaderFn();
  }catch(e){
    if(!el.isConnected) return null; // navigated away while loading — nothing left to render into
    el.innerHTML = `
      <div class="state-box error">
        <div class="state-icon">&#9888;</div>
        <div class="state-msg">${escapeHtml(e.message)}</div>
        <button class="btn secondary small retry-btn">Retry</button>
      </div>`;
    el.querySelector('.retry-btn').onclick = ()=>loadSection(containerId, loaderFn, renderFn, opts);
    return null;
  }
  if(!el.isConnected) return null;
  const empty = opts.isEmpty ? opts.isEmpty(data) : (Array.isArray(data) && data.length === 0);
  if(empty){
    el.innerHTML = `
      <div class="state-box">
        <div class="state-icon">&#9675;</div>
        <div class="state-msg">${opts.emptyMessage || 'Nothing here yet.'}</div>
        ${opts.emptyHint ? `<div class="state-hint">${opts.emptyHint}</div>` : ''}
      </div>`;
    if(opts.afterEmpty) opts.afterEmpty(el);
    return data;
  }
  el.innerHTML = renderFn(data);
  if(opts.afterRender) opts.afterRender(data, el);
  return data;
}

/* ============================== login / logout ============================== */
function showLogin(message){
  document.getElementById('login-screen').hidden = false;
  document.getElementById('app-shell').hidden = true;
  document.getElementById('login-error').textContent = message || '';
  const pwField = document.querySelector('#login-form input[name=password]');
  if(pwField) pwField.value = '';
}

function showApp(){
  document.getElementById('login-screen').hidden = true;
  document.getElementById('app-shell').hidden = false;
}

async function handleLoginSubmit(ev){
  ev.preventDefault();
  const fd = new FormData(ev.target);
  const username = fd.get('username');
  const password = fd.get('password');
  const errEl = document.getElementById('login-error');
  errEl.textContent = '';
  try{
    const res = await fetch('/api/auth/login', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({username, password}),
    });
    if(!res.ok){
      const j = await res.json().catch(()=>({}));
      errEl.textContent = j.detail || 'Login failed';
      return;
    }
    const data = await res.json();
    state.accessToken = data.access_token;
    state.refreshToken = data.refresh_token;
    state.currentUser = data.user;
    state.adminSession = null;
    state.view = 'home';
    showApp();
    renderSidebar();
    await render();
    refreshHealthLamps();
  }catch(e){
    errEl.textContent = 'Could not reach server: ' + e.message;
  }
}

async function doLogout(){
  try{
    await api('/api/auth/logout', {method:'POST', body:{refresh_token: state.refreshToken || null}});
  }catch(e){ /* logging out anyway */ }
  state.accessToken = null;
  state.refreshToken = null;
  state.currentUser = null;
  state.adminSession = null;
  state.view = 'home';
  if(typeof teardownNetworkMap === 'function') teardownNetworkMap();
  toast('Logged out', 'info');
  showLogin();
}

/* ============================== bootstrap ============================== */
async function boot(){
  tickClock();
  setInterval(tickClock, 1000);
  document.getElementById('login-form').addEventListener('submit', handleLoginSubmit);
  showLogin();
}

function tickClock(){
  // This is an Indian Railways system — the topbar clock is IST, explicitly
  // labeled, computed via the same fixed +5:30 conversion as everything
  // else (never the browser's own local time).
  const now = new Date();
  document.getElementById('clock').textContent = `${istDateStr(now)} ${istTimeStr(now, true)} IST`;
}

async function refreshHealthLamps(){
  try{
    await fetch('/health');
    setLamp('api','green','API online');
  }catch(e){ setLamp('api','red','API offline'); }
  try{
    const tt = await api('/api/timetable?limit=1');
    setLamp('timetable', tt.length ? 'green' : 'amber', tt.length ? 'Timetable loaded' : 'Timetable not loaded');
  }catch(e){ setLamp('timetable','amber','Timetable not loaded'); }
  try{
    const plan = await api('/api/schedule/plan?horizon=' + state.horizon);
    setLamp('plan', plan.status === 'published' ? 'green' : 'amber', 'Plan: ' + plan.status);

async function renderImpersonationPicker(){
  const panel = document.getElementById('impersonate-panel');
  if(!panel) return;
  panel.innerHTML = '<div class="sidebar-section-label" style="margin-top:14px;">Login as (admin only)</div><div class="small-muted">Loading users&hellip;</div>';

  const adminToken = state.adminSession ? state.adminSession.accessToken : state.accessToken;
  const excludeId = state.adminSession ? state.adminSession.user.user_id : state.currentUser.user_id;
  try{
    const res = await fetch('/api/admin/users', {headers: {'Authorization': 'Bearer ' + adminToken}});
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const users = await res.json();
    const others = users.filter(x => x.user_id !== excludeId && x.active);
    panel.innerHTML = '<div class="sidebar-section-label" style="margin-top:14px;">Login as (admin only)</div>' +
      (others.length ? others.map(x => `
        <button class="user-btn role-${x.role} impersonate-btn" data-uid="${x.user_id}">
          <span class="role-chip">${x.role}</span><span>${escapeHtml(x.name)}</span>
        </button>
      `).join('') : '<div class="small-muted">No other users.</div>');
    panel.querySelectorAll('.impersonate-btn').forEach(btn=>{
      btn.onclick = () => doImpersonate(btn.dataset.uid);
    });
  }catch(e){
    panel.innerHTML += '<div class="small-muted">Could not load user list.</div>';
  }
}

async function doImpersonate(targetUserId){
  const adminToken = state.adminSession ? state.adminSession.accessToken : state.accessToken;
  try{
    const res = await fetch('/api/auth/impersonate', {
      method: 'POST', headers: {'Content-Type':'application/json', 'Authorization':'Bearer ' + adminToken},
      body: JSON.stringify({target_user_id: targetUserId}),
    });
    if(!res.ok){ const j = await res.json().catch(()=>({})); throw new Error(j.detail || ('HTTP ' + res.status)); }
    const data = await res.json();
    if(!state.adminSession){
      state.adminSession = {accessToken: state.accessToken, refreshToken: state.refreshToken, user: state.currentUser};
    }
    state.accessToken = data.access_token;
    state.refreshToken = null; // impersonated sessions are access-only by design — see routers/auth.py
    state.currentUser = data.user;
    toast('Now acting as ' + data.user.user_id + ' (' + data.user.role + ')', 'info');
    renderSidebar();
    await render();
  }catch(e){ toast('Impersonate failed: ' + e.message, 'err'); }
}

// Views load asynchronously, and navigation (sidebar, strip -> map, map ->
// timeline) can start a new render while the previous one is still awaiting
// data. Each render takes a generation number; a superseded render must never
// write its late error (or anything else) over the view that replaced it.
let _renderGen = 0;
function isCurrentRender(gen){ return gen === _renderGen; }

async function render(){
  const gen = ++_renderGen;
  const role = state.currentUser ? state.currentUser.role : null;
  const title = document.getElementById('view-title');
  const content = document.getElementById('content');
  // Leaving the map (or re-rendering it) always stops its refresh timer and
  // restores the normal padded/scrolling content area.
  if(typeof teardownNetworkMap === 'function') teardownNetworkMap();
  content.classList.remove('map-mode');
  content.innerHTML = '<div class="small-muted">Loading&hellip;</div>';
  try{
    if(state.view === 'map' && role){
      title.textContent = 'Network Map';
      await renderNetworkMapView(content, gen);
    } else if(role === 'ENG' || role === 'TD' || role === 'SNT'){
      title.textContent = deptFullName(role) + ' Desk';
      await renderDeptDesk(role, content);
    } else if(role === 'COA'){
      title.textContent = 'Control Office';
      await renderCOA(content);
    } else if(role === 'ADMIN'){
      title.textContent = 'Administrator';
      await renderAdmin(content);
    } else {
      title.textContent = 'ABPS';
      content.innerHTML = '<div class="panel">No user selected.</div>';
    }
  }catch(e){
    if(!isCurrentRender(gen)) return; // a newer view owns #content now
    content.innerHTML = `
      <div class="panel">
        <div class="state-box error">
          <div class="state-icon">&#9888;</div>
          <div class="state-msg">${escapeHtml(e.message)}</div>
          <button class="btn secondary small" id="view-retry-btn">Retry</button>
        </div>
      </div>`;
    document.getElementById('view-retry-btn').onclick = render;
  }
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
// The one function nearly every timestamp display in this app goes
// through — fixing it fixes task lists, plan views, the audit log, and the
// timeline detail panel all at once. Always IST, always explicitly
// labeled (this is an Indian Railways system; no raw timestamp should ever
// be ambiguous about which timezone it's in) — see toIST()/istDateStr()/
// istTimeStr() below for the fixed +5:30 conversion this relies on.
function fmtDt(s, opts){
  opts = opts || {};
  if(!s) return '&mdash;';
  const text = `${istDateStr(s)} ${istTimeStr(s, opts.seconds)}`;
  return opts.noLabel ? text : text + ' IST';
}
