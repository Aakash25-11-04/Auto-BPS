/* ============================== live number tweening (KPI count-up) ============================== */
function tweenNumber(el, toValue, opts){
  opts = opts || {};
  const duration = opts.duration || 700;
  const decimals = opts.decimals || 0;
  const suffix = opts.suffix || '';
  if(!el) return;
  const fromParsed = parseFloat(String(el.textContent).replace(suffix, '').trim());
  const from = isNaN(fromParsed) ? toValue : fromParsed;
  if(Math.abs(from - toValue) < (decimals ? 0.005 : 0.5)){
    el.textContent = toValue.toFixed(decimals) + suffix;
    return;
  }
  const start = performance.now();
  function step(now){
    const t = Math.min(1, (now - start) / duration);
    const eased = 1 - Math.pow(1 - t, 3); // ease-out cubic
    const current = from + (toValue - from) * eased;
    el.textContent = current.toFixed(decimals) + suffix;
    if(t < 1) requestAnimationFrame(step);
    else el.textContent = toValue.toFixed(decimals) + suffix;
  }
  requestAnimationFrame(step);
}

/* ============================== FLIP re-sort transitions ============================== */
// Call recordFlipPositions() BEFORE mutating the DOM (old order still in place),
// then rebuild the list with the SAME data-flip-key values in their NEW order,
// then call playFlip(recorded) to animate each element from its old screen
// position to its new one. No library — this is the whole technique.
function recordFlipPositions(containerEl){
  const map = new Map();
  if(!containerEl) return map;
  containerEl.querySelectorAll('[data-flip-key]').forEach(el=>{
    map.set(el.dataset.flipKey, el.getBoundingClientRect());
  });
  return map;
}
function playFlip(containerEl, oldRects){
  if(!containerEl || !oldRects || !oldRects.size) return;
  const moved = [];
  containerEl.querySelectorAll('[data-flip-key]').forEach(el=>{
    const oldRect = oldRects.get(el.dataset.flipKey);
    if(!oldRect) return;
    const newRect = el.getBoundingClientRect();
    const dy = oldRect.top - newRect.top;
    const dx = oldRect.left - newRect.left;
    if(Math.abs(dy) < 0.5 && Math.abs(dx) < 0.5) return;
    el.style.transition = 'none';
    el.style.transform = `translate(${dx}px, ${dy}px)`;
    moved.push(el);
  });
  if(!moved.length) return;
  // Force one synchronous layout so the browser actually commits/paints the
  // "inverted" starting position before the transition-to-neutral is
  // scheduled — without this forced reflow, a browser can coalesce both
  // style writes into a single frame and the animation never becomes
  // visible even though the final position ends up correct either way.
  // eslint-disable-next-line no-unused-expressions
  void containerEl.offsetHeight;
  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>{
      moved.forEach(el=>{
        el.style.transition = 'transform 0.4s cubic-bezier(0.2,0.6,0.2,1)';
        el.style.transform = '';
        el.addEventListener('transitionend', function cleanup(){ el.style.transition = ''; el.removeEventListener('transitionend', cleanup); });
      });
    });
  });
}

/* ============================== reusable filter bar (FR-DASH-05) ==============================
 * Combinable filters over an in-memory array of task-shaped objects
 * ({department, corridor_id, priority_score, ...}). Renders active-filter
 * chips so it's always visible which filters are currently applied, and a
 * one-click "clear all". Calls onChange(filteredArray) whenever the filter
 * set changes; the caller re-renders whatever it wants with the result. */
function renderFilterBar(containerId, sourceRows, options, onChange){
  const el = document.getElementById(containerId);
  if(!el) return;
  options = options || {};
  const state_ = {department: '', corridor: '', tier: ''};

  const depts = options.showDepartment !== false ? [...new Set(sourceRows.map(r=>r.department))].sort() : [];
  const corridors = [...new Set(sourceRows.map(r=>r.corridor_id))].filter(Boolean).sort();

  function apply(){
    let rows = sourceRows;
    if(state_.department) rows = rows.filter(r=>r.department === state_.department);
    if(state_.corridor) rows = rows.filter(r=>r.corridor_id === state_.corridor);
    if(state_.tier) rows = rows.filter(r=>priorityTier(r.priority_score) === state_.tier);
    renderChips();
    onChange(rows);
  }

  function renderChips(){
    const chipsEl = el.querySelector('.active-filters');
    if(!chipsEl) return;
    const chips = [];
    if(state_.department) chips.push(['department', 'Dept: ' + state_.department]);
    if(state_.corridor) chips.push(['corridor', 'Corridor: ' + state_.corridor]);
    if(state_.tier) chips.push(['tier', 'Tier: ' + state_.tier]);
    chipsEl.innerHTML = chips.map(([key,label])=>
      `<span class="filter-chip">${escapeHtml(label)}<button type="button" data-clear="${key}" aria-label="Remove filter ${escapeHtml(label)}">&times;</button></span>`
    ).join('') + (chips.length ? `<button type="button" class="btn secondary small" id="${containerId}-clear-all">Clear all</button>` : '');
    chipsEl.querySelectorAll('[data-clear]').forEach(btn=>{
      btn.onclick = ()=>{ state_[btn.dataset.clear] = ''; syncSelects(); apply(); };
    });
    const clearAll = document.getElementById(containerId+'-clear-all');
    if(clearAll) clearAll.onclick = ()=>{ state_.department=''; state_.corridor=''; state_.tier=''; syncSelects(); apply(); };
  }

  function syncSelects(){
    const d = el.querySelector('[data-f=department]'); if(d) d.value = state_.department;
    const c = el.querySelector('[data-f=corridor]'); if(c) c.value = state_.corridor;
    const t = el.querySelector('[data-f=tier]'); if(t) t.value = state_.tier;
  }

  el.innerHTML = `
    <div class="filter-bar" role="group" aria-label="Filters">
      ${depts.length > 1 ? `<div><label for="${containerId}-dept">Department</label>
        <select id="${containerId}-dept" data-f="department"><option value="">All</option>${depts.map(d=>`<option value="${d}">${d}</option>`).join('')}</select></div>` : ''}
      <div><label for="${containerId}-corridor">Corridor</label>
        <select id="${containerId}-corridor" data-f="corridor"><option value="">All</option>${corridors.map(c=>`<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('')}</select></div>
      <div><label for="${containerId}-tier">Priority tier</label>
        <select id="${containerId}-tier" data-f="tier"><option value="">All</option>${['Critical','High','Medium','Low'].map(t=>`<option value="${t}">${t}</option>`).join('')}</select></div>
    </div>
    <div class="active-filters"></div>
  `;
  const deptSel = el.querySelector('[data-f=department]'); if(deptSel) deptSel.onchange = (e)=>{ state_.department = e.target.value; apply(); };
  el.querySelector('[data-f=corridor]').onchange = (e)=>{ state_.corridor = e.target.value; apply(); };
  el.querySelector('[data-f=tier]').onchange = (e)=>{ state_.tier = e.target.value; apply(); };
  renderChips();
  onChange(sourceRows);
}

/* ============================== reusable sortable/searchable/paginated table ==============================
 * columns: [{key, label, sortable, render(row)->html, sortValue(row)->comparable}]
 * bulkActions: [{label, run(selectedRowObjects)->Promise}] — shown once >=1 row checked
 * Renders its own toolbar (search + bulk bar) and pagination, and re-renders
 * itself in place on sort/search/page changes (no full parent re-render). */
function renderSortableTable(containerId, rows, config){
  const el = document.getElementById(containerId);
  if(!el) return;
  const cfg = Object.assign({pageSize: 25, rowKey: r=>r.id, searchFields: [], bulkActions: null, emptyMessage: 'No rows.'}, config);
  const tstate = {sortKey: cfg.defaultSortKey || null, sortDir: -1, search: '', page: 1, selected: new Set()};

  function filtered(){
    let out = rows;
    if(tstate.search){
      const q = tstate.search.toLowerCase();
      out = out.filter(r => cfg.searchFields.some(f => String(r[f] ?? '').toLowerCase().includes(q)));
    }
    if(tstate.sortKey){
      const col = cfg.columns.find(c=>c.key === tstate.sortKey);
      const sv = col.sortValue || (r=>r[col.key]);
      out = [...out].sort((a,b)=>{
        const av = sv(a), bv = sv(b);
        if(av < bv) return -1 * tstate.sortDir;
        if(av > bv) return 1 * tstate.sortDir;
        return 0;
      });
    }
    return out;
  }

  function draw(){
    const all = filtered();
    const totalPages = Math.max(1, Math.ceil(all.length / cfg.pageSize));
    tstate.page = Math.min(tstate.page, totalPages);
    const pageRows = all.slice((tstate.page-1)*cfg.pageSize, tstate.page*cfg.pageSize);

    const showBulk = !!cfg.bulkActions;
    el.innerHTML = `
      <div class="table-toolbar">
        ${cfg.searchFields.length ? `<input type="text" class="table-search" placeholder="Search&hellip;" value="${escapeHtml(tstate.search)}" aria-label="Search table" id="${containerId}-search" />` : '<div></div>'}
        <div class="small-muted">${all.length} row${all.length===1?'':'s'}${all.length !== rows.length ? ` (of ${rows.length})` : ''}</div>
      </div>
      ${showBulk ? `<div class="bulk-bar" id="${containerId}-bulkbar"><span id="${containerId}-bulkcount"></span>${cfg.bulkActions.map((a,i)=>`<button class="btn small" data-bulk="${i}">${escapeHtml(a.label)}</button>`).join('')}<button class="btn secondary small" id="${containerId}-bulkclear">Clear selection</button></div>` : ''}
      <div class="table-wrap">
        <table>
          <thead><tr>
            ${showBulk ? `<th style="width:26px;"><input type="checkbox" id="${containerId}-selectall" aria-label="Select all rows on this page" /></th>` : ''}
            ${cfg.columns.map(c => c.sortable ? `
              <th class="sortable ${tstate.sortKey===c.key?'sorted':''}"><button type="button" data-sort="${c.key}">${escapeHtml(c.label)}<span class="sort-arrow">${tstate.sortKey===c.key ? (tstate.sortDir===1?'▲':'▼') : '▼'}</span></button></th>
            ` : `<th>${escapeHtml(c.label)}</th>`).join('')}
          </tr></thead>
          <tbody>
            ${pageRows.length ? pageRows.map(r=>`
              <tr>
                ${showBulk ? `<td><input type="checkbox" class="row-check" data-key="${escapeHtml(String(cfg.rowKey(r)))}" aria-label="Select row" ${tstate.selected.has(cfg.rowKey(r))?'checked':''} /></td>` : ''}
                ${cfg.columns.map(c=>`<td>${c.render ? c.render(r) : escapeHtml(String(r[c.key] ?? ''))}</td>`).join('')}
              </tr>
            `).join('') : `<tr><td colspan="${cfg.columns.length + (showBulk?1:0)}" class="small-muted">${cfg.emptyMessage}</td></tr>`}
          </tbody>
        </table>
      </div>
      ${totalPages > 1 ? `
      <div class="pagination">
        <span>Page ${tstate.page} of ${totalPages}</span>
        <button type="button" id="${containerId}-prev" ${tstate.page<=1?'disabled':''}>&larr; Prev</button>
        <button type="button" id="${containerId}-next" ${tstate.page>=totalPages?'disabled':''}>Next &rarr;</button>
      </div>` : ''}
    `;

    const searchInput = document.getElementById(containerId+'-search');
    if(searchInput){
      searchInput.oninput = ()=>{ tstate.search = searchInput.value; tstate.page = 1; draw(); };
    }
    el.querySelectorAll('[data-sort]').forEach(btn=>{
      btn.onclick = ()=>{
        const key = btn.dataset.sort;
        if(tstate.sortKey === key){ tstate.sortDir *= -1; } else { tstate.sortKey = key; tstate.sortDir = 1; }
        draw();
      };
    });
    const prevBtn = document.getElementById(containerId+'-prev');
    if(prevBtn) prevBtn.onclick = ()=>{ tstate.page--; draw(); };
    const nextBtn = document.getElementById(containerId+'-next');
    if(nextBtn) nextBtn.onclick = ()=>{ tstate.page++; draw(); };

    if(showBulk){
      const selectAll = document.getElementById(containerId+'-selectall');
      if(selectAll) selectAll.onchange = ()=>{
        pageRows.forEach(r => selectAll.checked ? tstate.selected.add(cfg.rowKey(r)) : tstate.selected.delete(cfg.rowKey(r)));
        draw();
      };
      el.querySelectorAll('.row-check').forEach(cb=>{
        cb.onchange = ()=>{
          const key = cb.dataset.key;
          const match = all.find(r => String(cfg.rowKey(r)) === key);
          if(cb.checked) tstate.selected.add(cfg.rowKey(match)); else tstate.selected.delete(cfg.rowKey(match));
          draw();
        };
      });
      const bulkBar = document.getElementById(containerId+'-bulkbar');
      const bulkCount = document.getElementById(containerId+'-bulkcount');
      if(bulkBar){
        bulkBar.classList.toggle('active', tstate.selected.size > 0);
        if(bulkCount) bulkCount.textContent = tstate.selected.size + ' selected';
      }
      el.querySelectorAll('[data-bulk]').forEach(btn=>{
        btn.onclick = async ()=>{
          const action = cfg.bulkActions[parseInt(btn.dataset.bulk)];
          const selectedRows = rows.filter(r => tstate.selected.has(cfg.rowKey(r)));
          if(!selectedRows.length) return;
          const ok = await confirmDialog({
            title: action.label,
            bodyHtml: `Apply <b>${escapeHtml(action.label)}</b> to <b>${selectedRows.length}</b> selected task(s)? This cannot be bulk-undone.`,
            confirmLabel: action.label, danger: !!action.danger,
          });
          if(!ok) return;
          try{
            await action.run(selectedRows);
            tstate.selected.clear();
          }catch(e){ toast('Bulk action failed: ' + e.message, 'err'); }
        };
      });
      const clearBtn = document.getElementById(containerId+'-bulkclear');
      if(clearBtn) clearBtn.onclick = ()=>{ tstate.selected.clear(); draw(); };
    }
  }
  draw();
}

  async function flagTask(taskId, kind){

      searchFields: ['task_id','asset_id','defect_type','corridor_id'],

        {

            for(const t of targets){
              try{ await flagTask(t.task_id, 'safety'); ok++; }catch(e){ fail++; }

            toast(`Flagged ${ok} task(s) safety-critical${fail?`, ${fail} failed`:''}.`, fail ? 'warn' : 'ok');

      ],

        {key:'task_id', label:'Task ID', sortable:true, render:t=>`<span class="mono">${escapeHtml(t.task_id)}</span>`},

        {key:'defect_type', label:'Defect', sortable:true, render:t=>`${escapeHtml(t.defect_type)}${t.safety_critical?' <span class="badge unscheduled">SAFETY</span>':''}${t.interlocking_critical?' <span class="badge" style="background:var(--purple-tint);color:var(--purple);">INTLK</span>':''}`},

        {key:'status', label:'Status', sortable:true, render:t=>`<span class="badge ${t.status}">${t.status}</span>${t.unscheduled_reason ? `<div class="justification">${escapeHtml(t.unscheduled_reason)}</div>`:''}`},

        {key:'required_duration_hours', label:'Duration', sortable:true, render:t=>`<span class="mono">${t.required_duration_hours}h</span>`},
        {key:'corridor_id', label:'Corridor', sortable:true, render:t=>`<span class="mono">${escapeHtml(t.corridor_id)}</span>`},
        {key:'actions', label:'Actions', render:t=>`
          ${!t.safety_critical ? `<button class="btn secondary small" data-act="safety" data-id="${escapeHtml(t.task_id)}">+Safety</button>` : ''}
          ${role==='SNT' && !t.interlocking_critical ? `<button class="btn secondary small" data-act="interlock" data-id="${escapeHtml(t.task_id)}">+Interlock</button>` : ''}
          ${['unscheduled','manually_removed','displaced'].includes(t.status) ? `<button class="btn secondary small" data-act="request-override" data-id="${escapeHtml(t.task_id)}">Request priority scheduling</button>` : ''}

          toast('Flag applied and task rescored.', 'ok');
          loadTasks();
        }catch(e){ toast('Failed: ' + e.message, 'err'); }
      };
    });

  // FR-COA-03: a department can only REQUEST an override, never execute one.
  function openRequestOverrideModal(taskId){
    const root = document.getElementById('modal-root');
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.innerHTML = `
      <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="ro-title">
        <h3 id="ro-title">Request Priority Scheduling &mdash; ${escapeHtml(taskId)}</h3>
        <div class="modal-body">

          <label for="ro-reason">Reason <span class="small-muted">(mandatory)</span></label>
          <textarea id="ro-reason" rows="3" required placeholder="Why should this be prioritized ahead of the optimizer's own placement?"></textarea>
          <div id="ro-error" class="row-errors"></div>

          <button class="btn secondary" id="ro-cancel">Cancel</button>
          <button class="btn" id="ro-submit">Send Request</button>

  async function loadMyOverrideRequests(){

  async function loadTasks(){
    const filtersEl = document.getElementById('task-filters');
    const tableEl = document.getElementById('task-table-wrap');
    filtersEl.innerHTML = '';
    tableEl.innerHTML = `<div class="skeleton-line w80"></div><div class="skeleton-line w60"></div><div class="skeleton-line w40"></div>`;
    let tasks;
    try{
      tasks = await api('/api/tasks?department=' + role);
    }catch(e){
      tableEl.innerHTML = `
        <div class="state-box error"><div class="state-icon">&#9888;</div>
        <div class="state-msg">${escapeHtml(e.message)}</div>
        <button class="btn secondary small" id="task-retry-btn">Retry</button></div>`;

      tableEl.innerHTML = `
        <div class="state-box"><div class="state-icon">&#9675;</div>
        <div class="state-msg">No tasks yet.</div>

  loadTasks();
  loadMyOverrideRequests();

  loadSection('my-windows', ()=>api('/api/schedule/plan?horizon=' + state.horizon), (plan)=>{
    const myEntries = plan.entries.filter(e=>e.department === role);
    if(!myEntries.length){
      return `<div class="state-box"><div class="state-icon">&#9675;</div><div class="state-msg">No blocks allocated to this department in the current plan.</div></div>`;
    }
    const byStart = (a,b)=>parseServerDt(a.assigned_window_start) - parseServerDt(b.assigned_window_start);
    myEntries.sort(byStart);
    const mine = plan.resource_summary ? plan.resource_summary.find(r=>r.department === role) : null;
    return `
      <p class="small-muted">Plan status: <span class="badge ${plan.status}">${plan.status}</span>
      ${mine ? `&middot; crew: peak <b>${mine.peak_concurrent}</b> of <b>${mine.capacity_at_peak != null ? mine.capacity_at_peak : mine.gangs_available}</b> gangs at once, <b>${mine.gangs_used}</b> gang(s) used` : ''}</p>
      <div class="table-wrap">
        <table><thead><tr><th>Task</th><th>Gang</th><th>Corridor</th><th>Window Start (IST)</th><th>Window End (IST)</th><th>Shared With</th></tr></thead>
        <tbody>
          ${myEntries.map(e=>`
            <tr>
              <td class="mono">${e.task_id}${e.override ? ' <span class="override-chip" title="Manually placed by '+escapeHtml(e.override_by||'')+': '+escapeHtml(e.override_reason||'')+'">&#9995; MANUAL</span>' : ''}</td>
              <td>${e.gang_id ? `<span class="gang-chip dept-${e.department}">${escapeHtml(e.gang_id)}</span>` : '<span class="small-muted">&mdash;</span>'}</td>
              <td class="mono">${e.corridor_id}</td>
              <td class="mono">${fmtDt(e.assigned_window_start, {noLabel:true})}</td>
              <td class="mono">${fmtDt(e.assigned_window_end, {noLabel:true})}</td>
              <td>${e.co_scheduled_departments.length ? e.co_scheduled_departments.map(d=>`<span class="badge dept-${d}">${d}</span>`).join(' ') : '<span class="small-muted">solo block</span>'}</td>
            </tr>

        </tbody></table>
      </div>
      ${gangSheetsHtml(myEntries)}

  }, {
    isEmpty: ()=>false,
    emptyMessage: 'No plan has been run yet for this horizon.',
  }).catch(()=>{});

  document.getElementById('task-form').onsubmit = async (ev)=>{
    ev.preventDefault();
    const fd = new FormData(ev.target);
    const payload = {
      department: role,
      asset_id: fd.get('asset_id'),
      defect_type: fd.get('defect_type'),
      severity: parseInt(fd.get('severity')),
      overdue_days: parseInt(fd.get('overdue_days') || '0'),
      required_duration_hours: parseFloat(fd.get('required_duration_hours')),
      corridor_id: fd.get('corridor_id'),
      safety_critical: fd.get('safety_critical') === 'on',
      interlocking_critical: fd.get('interlocking_critical') === 'on',
      source: 'manual',
    };
    try{
      const t = await api('/api/tasks', {method:'POST', body: payload});
      toast(`Task ${t.task_id} submitted &mdash; score ${t.priority_score.toFixed(1)}`, 'ok');
      render();
    }catch(e){ toast('Submit failed: ' + e.message, 'err'); }
  };

  document.getElementById('import-btn').onclick = async ()=>{
    const fileInput = document.getElementById('import-file');
    if(!fileInput.files.length){ toast('Choose a file first', 'err'); return; }
    const fd = new FormData();
    fd.append('file', fileInput.files[0]);
    try{
      const result = await api('/api/tasks/import?department=' + role, {method:'POST', body: fd});
      let html = `<div class="hint"><b>${result.imported_count}</b> imported, <b>${result.rejected_count}</b> rejected.</div>`;
      if(result.row_errors && result.row_errors.length){
        html += '<div class="row-errors" style="margin-top:8px;">' + result.row_errors.map(re=>
          `Row ${re.row}: ${re.errors.join('; ')}`
        ).join('<br/>') + '</div>';
      }
      // Stashed in state (not just written to the DOM) because a successful
      // import triggers render() below to refresh the task list, which
      // rebuilds this whole panel from scratch and would otherwise wipe the
      // message before the user ever sees it.
      state.lastImportResult = {department: role, html};
      document.getElementById('import-result').innerHTML = html;
      toast(`Import complete: ${result.imported_count} ok, ${result.rejected_count} rejected`, result.rejected_count ? 'info':'ok');
      if(result.imported_count) render();
    }catch(e){ toast('Import failed: ' + e.message, 'err'); }
  };
}

/* Feature 10: "your gang's schedule" — one card per assigned gang, in time
 * order, so a supervisor can hand each crew its own sheet: "Gang 2, you're on
 * NDLS-GZB 01:30–03:45 IST, here's your task list." */
function gangSheetsHtml(entries){
  const withGang = entries.filter(e=>e.gang_id);
  if(!withGang.length) return '';
  const gangNum = g => parseInt(String(g).split('-').pop(), 10) || 0;
  const byGang = {};
  withGang.forEach(e=>{ (byGang[e.gang_id] = byGang[e.gang_id] || []).push(e); });
  const gangs = Object.keys(byGang).sort((a,b)=>gangNum(a) - gangNum(b));
  return `<h3 style="font-size:11px;color:var(--text-dim);text-transform:uppercase;margin:16px 0 0 0;">Gang Work Sheets</h3>
    <div class="gang-sheet-grid">${gangs.map(g=>{
      const work = byGang[g];
      const text = `${g}\n` + work.map((e,i)=>`${i+1}. ${istDateStr(e.assigned_window_start)} ${istTimeStr(e.assigned_window_start)}-${istTimeStr(e.assigned_window_end)} IST  ${e.corridor_id}  ${e.task_id}${e.defect_type ? '  '+e.defect_type : ''}${e.asset_id ? ' ('+e.asset_id+')' : ''}`).join('\n');
      return `<div class="gang-sheet">
        <h4><span class="gang-chip dept-${work[0].department}">${escapeHtml(g)}</span>
          <span class="small-muted" style="font-weight:400;">${work.length} task(s)</span>
          <button class="btn secondary small gang-copy-btn" data-sheet="${escapeHtml(text)}" title="Copy this gang's sheet as plain text">Copy</button></h4>
        <ol>${work.map(e=>`<li><span class="mono">${istDateStr(e.assigned_window_start).slice(5)} ${istTimeStr(e.assigned_window_start)}&ndash;${istTimeStr(e.assigned_window_end)} IST</span>
          on <b class="mono">${escapeHtml(e.corridor_id)}</b><br/><span class="small-muted">${escapeHtml(e.task_id)}${e.defect_type ? ' &middot; '+escapeHtml(e.defect_type) : ''}${e.asset_id ? ' &middot; '+escapeHtml(e.asset_id) : ''}</span></li>`).join('')}</ol>
      </div>`;
    }).join('')}</div>`;
}
document.addEventListener('click', (ev)=>{
  const btn = ev.target.closest && ev.target.closest('.gang-copy-btn');
  if(!btn) return;
  navigator.clipboard.writeText(btn.dataset.sheet).then(()=>toast('Gang sheet copied', 'ok'), ()=>toast('Copy failed — select the text manually', 'warn'));
});

// state, not an error. Anything else (network down, 500, auth) is a real
// failure the caller must surface with a retry, never silently treated the
// same as "no plan."
async function fetchCurrentPlanOrNull(){
  try{
    return await api('/api/schedule/plan?horizon=' + state.horizon);
  }catch(e){
    if(e.status === 404) return null;
    throw e;
  }
}

          <div style="width:100px;">
            <label for="derive-buffer">Buffer (min)</label>

          <div style="width:110px;">
            <label for="derive-min-gap">Min window (h)</label>

        <div class="chip-list" id="corridor-chips"></div>
        <div id="derive-result" class="hint"></div>

    </div>

    <div class="panel">
      <h2>Add Manual Corridor Slot</h2>
      <p class="hint">For a window not captured by the real timetable gap-derivation above (e.g. a special
      possession). Times you enter here are <b>IST</b> &mdash; type the wall-clock time you mean; the backend
      converts and stores it correctly regardless of server timezone.</p>
      <form id="manual-slot-form" class="corridor-picker" style="align-items:flex-end;">
        <div>
          <label for="ms-corridor">Corridor ID</label>
          <input type="text" id="ms-corridor" required placeholder="e.g. THK-KYN" />
        </div>
        <div>
          <label for="ms-start">Start (IST)</label>
          <input type="datetime-local" id="ms-start" required step="60" />
        </div>
        <div>
          <label for="ms-end">End (IST)</label>
          <input type="datetime-local" id="ms-end" required step="60" />
        </div>
        <div style="flex:none;"><button class="btn" type="submit" style="margin-top:0;">Add Slot</button></div>
      </form>
      <div id="manual-slot-result" class="hint"></div>
    </div>

    <div class="panel">
      <h2>3. Run Scheduler</h2>
      <p class="hint">Runs the CP-SAT optimizer (25s time budget, deterministic greedy fallback) over all submitted tasks
      and available corridor slots for the <b>${state.horizon}</b> horizon. Produces a new DRAFT plan &mdash; never
      overwrites what's published. <kbd style="font-family:var(--mono);background:var(--panel2);color:var(--text);padding:1px 5px;border-radius:3px;">R</kbd></p>
      <div class="checkbox-row">
        <input type="checkbox" id="preserve-overrides-cb" checked />
        <label for="preserve-overrides-cb" title="When on, every manually-placed block (FR-COA-03) is pinned before this run — the optimizer works around it instead of moving or dropping it. Uncheck to let this run reconsider manual overrides exactly like any other task.">Preserve manual overrides <span class="small-muted">(recommended)</span></label>
      </div>
      <div class="btn-row"><button class="btn" id="run-btn">Run Scheduler (${state.horizon})</button></div>
      <div id="run-result" class="hint"></div>
    </div>

    <div id="metrics-strip-wrap"></div>
    <div id="resource-strip-wrap"></div>

    <div class="panel" id="comparison-panel">
      <h2>Before vs After &mdash; Manual Process vs ABPS (<span class="accent">${state.horizon}</span>)</h2>
      <p class="hint">Simulates today's manual process &mdash; departments claim windows independently, sequentially
      (ENG, then TD, then SNT), first-come-first-served, and each claim reserves the WHOLE window exclusively for
      that department &mdash; and compares it against the optimizer's actual draft/published plan for this horizon.</p>
      <div class="btn-row" style="margin-top:0;"><button class="btn" id="cmp-load-btn">Compute Comparison</button></div>
      <div id="cmp-body"></div>
    </div>

    <div class="panel">
      <h2>Corridor Timeline</h2>
      <div class="corridor-picker">
        <div>
          <label for="tl-corridor">Corridor to visualize</label>
          <input type="text" id="tl-corridor" placeholder="e.g. THK-KYN" value="THK-KYN" />
        </div>
        <div style="flex:none;"><button class="btn secondary" id="tl-render-btn" style="margin-top:0;">Render Timeline</button></div>
        ${state.currentUser.role === 'COA' ? '<div style="flex:none;"><button class="btn secondary" id="tl-ingest-weather-btn" style="margin-top:0;">Refresh Weather Forecast</button></div>' : ''}
      </div>
      <div id="timeline-body"><div class="small-muted" style="margin-top:10px;">Enter a corridor and click Render Timeline.</div></div>
      <div class="timeline-legend">
        <span><span class="sw" style="background:#B9C2C9;height:4px;border-radius:1px;"></span>Real train movement (thin grey tick)</span>
        <span><span class="sw" style="background:var(--green-tint);border:1px solid #BFE3CD;"></span>Available corridor slot</span>
        <span><span class="sw" style="background:var(--eng);"></span>ENG block</span>
        <span><span class="sw" style="background:var(--td);"></span>TD block</span>
        <span><span class="sw" style="background:var(--snt);"></span>SNT block</span>
        <span><span class="sw" style="background:var(--eng);opacity:0.45;filter:saturate(0.55);"></span>Past block (dimmed)</span>
        <span><span class="sw" style="background:var(--red);"></span>NOW marker (IST)</span>
        <span><span class="sw" style="background:var(--panel2);"></span>Weather: clear</span>
        <span><span class="sw" style="background:var(--amber-tint);border:1px solid var(--amber);"></span>Weather: elevated (soft duration buffer)</span>
        <span><span class="sw" style="background:var(--red-tint);border:1px solid var(--red);"></span>Weather: severe (hard-excludes weather-sensitive work)</span>
      </div>
    </div>

    <div class="panel">
      <h2>Unscheduled Tasks</h2>
      <div id="unscheduled-filters"></div>
      <div id="unscheduled-table-wrap"></div>
    </div>

    <div class="panel">
      <h2>Plan Approval</h2>
      <div id="plan-approval-body"></div>
    </div>

    <div class="panel">
      <h2>AI Priority &amp; Risk Queue <span class="small-muted" style="text-transform:none;font-weight:400;">&mdash; Layer 3</span></h2>
      <p class="hint">Two model families that only ever estimate PARAMETERS &mdash; a failure-risk probability, a
      forecasted low-traffic window &mdash; the CP-SAT optimizer still makes every scheduling decision. Both are
      trained on clearly-labelled SYNTHETIC data (see README) since real TMS/SMMS/TDMS failure history isn't public.</p>
      <div id="ml-control-body"></div>
    </div>

    <div class="panel">
      <h2>Decision Intelligence <span class="small-muted" style="text-transform:none;font-weight:400;">&mdash; Layer 5</span></h2>
      <div id="decision-intelligence-body"></div>
    </div>

    <div class="panel">
      <h2>Corridor Network Map</h2>
      <div id="network-map-body"></div>
    </div>

    <div class="panel">
      <h2>Data Pipeline <span class="small-muted" style="text-transform:none;font-weight:400;">&mdash; Layer 2</span></h2>
      <div id="pipeline-body"></div>
    </div>

    <div class="panel">
      <h2>Freight Forecast</h2>
      <div id="freight-list"></div>
    </div>
  `;

  document.getElementById('h-weekly').onclick = ()=>{ state.horizon='weekly'; render(); };
  document.getElementById('h-monthly').onclick = ()=>{ state.horizon='monthly'; render(); };

  loadSection('corridor-chips', ()=>api('/api/timetable/top-corridors?limit=12'), (corridors)=>
    corridors.map(c=>`<span class="chip" data-c="${escapeHtml(c.corridor_id)}">${escapeHtml(c.corridor_id)} &middot; ${c.segment_count} trains/wk</span>`).join(''),
    {emptyMessage:'No corridors yet — load the timetable first.'}
  ).then(()=>{
    document.querySelectorAll('#corridor-chips .chip').forEach(chip=>{
      chip.onclick = ()=>{
        document.getElementById('derive-corridor').value = chip.dataset.c;
        document.getElementById('tl-corridor').value = chip.dataset.c;
      };
    });
  });

  document.getElementById('load-tt-btn').onclick = async ()=>{
    const el = document.getElementById('tt-result');
    el.textContent = 'Loading real timetable dataset...';
    try{
      const r = await api('/api/data/load-timetable', {method:'POST'});
      el.innerHTML = `Loaded <b>${r.segments_loaded}</b> real segments &middot; <b>${r.distinct_trains}</b> trains &middot;
        <b>${r.distinct_corridors}</b> corridors &middot; <b>${r.stations_loaded}</b> stations.
        Sample train numbers: ${r.sample_train_numbers.join(', ')}. Source: ${r.source}.`;
      toast('Real timetable loaded', 'ok');
      refreshHealthLamps();
    }catch(e){ el.innerHTML = `<span class="row-errors">${escapeHtml(e.message)}</span>`; toast('Timetable load failed', 'err'); }
  };

  document.getElementById('manual-slot-form').onsubmit = async (ev)=>{
    ev.preventDefault();
    const corridor_id = document.getElementById('ms-corridor').value.trim();
    // Send the <input type=datetime-local> value EXACTLY as typed — it's
    // already a naive "YYYY-MM-DDTHH:MM" string with no timezone info, which
    // is precisely what the backend's IstIn validator expects and correctly
    // interprets as IST (see schemas.py/tz_utils.parse_user_local_datetime).
    // Do NOT run this through `new Date(...)` first — that would silently
    // reinterpret it through the VIEWING BROWSER's own local timezone,
    // corrupting exactly the value this form exists to get right.
    const start_time = document.getElementById('ms-start').value;
    const end_time = document.getElementById('ms-end').value;
    const el = document.getElementById('manual-slot-result');
    if(!corridor_id || !start_time || !end_time){ toast('Fill in corridor, start, and end', 'err'); return; }
    el.textContent = 'Adding...';
    try{
      const r = await api('/api/corridor-availability', {method:'POST', body:{corridor_id, start_time, end_time, horizon: state.horizon}});
      el.innerHTML = `Added <span class="mono">${escapeHtml(r.slot_id)}</span>: `+
        `<span class="mono">${fmtDt(r.start_time)}</span> &rarr; <span class="mono">${fmtDt(r.end_time)}</span> `+
        `<span class="small-muted">(you typed ${escapeHtml(start_time)} &rarr; ${escapeHtml(end_time)} IST)</span>`;
      toast('Manual corridor slot added', 'ok');
      ev.target.reset();
    }catch(e){ el.innerHTML = `<span class="row-errors">${escapeHtml(e.message)}</span>`; toast('Failed: ' + e.message, 'err'); }
  };

  // Default the vacancy date range to today..+horizon in IST.
  (function initDeriveDates(){
    const from = document.getElementById('derive-from'), to = document.getElementById('derive-to');
    if(!from || !to) return;
    const todayIst = istDateStr(new Date());
    const days = state.horizon === 'monthly' ? 29 : 6;
    const end = new Date(new Date(todayIst + 'T00:00:00Z').getTime() + days*86400000);
    from.value = todayIst;
    to.value = end.toISOString().slice(0,10);
  })();

  document.getElementById('derive-btn').onclick = async ()=>{
    const corridor_id = document.getElementById('derive-corridor').value.trim();
    const min_window_hours = parseFloat(document.getElementById('derive-min-gap').value);
    const buffer_minutes = parseInt(document.getElementById('derive-buffer').value, 10);
    const date_from = document.getElementById('derive-from').value;
    const date_to = document.getElementById('derive-to').value;
    const el = document.getElementById('derive-result');
    if(!corridor_id){ toast('Enter a corridor ID', 'err'); return; }
    el.textContent = 'Computing vacancy from real train movements...';
    try{
      // Query params (not a JSON body) — matches the endpoint's signature.
      const qs = new URLSearchParams({corridor_id, date_from, date_to, buffer_minutes, min_window_hours, horizon: state.horizon});
      const r = await api('/api/corridor-availability/derive?' + qs.toString(), {method:'POST'});
      const slots = r.slots_created || [];
      el.innerHTML =
        `Found <b>${r.windows_found}</b> vacancy window(s) (<b>${r.total_available_hours}h</b> total) across
         <b>${r.section_count}</b> section(s) that must ALL be free, against
         <b>${r.real_train_movements_considered}</b> real train movements,
         with a <b>${r.buffer_minutes}-minute</b> safety buffer.` +
        (slots.length
          ? `<br/>Example: <span class="mono">${escapeHtml(slots[0].start_ist)} &rarr; ${escapeHtml(slots[0].end_ist)} IST</span>
             (${slots[0].duration_hours}h) &mdash; after train
             <span class="mono">${escapeHtml(slots[0].train_before_id || 'range start')}</span>, before train
             <span class="mono">${escapeHtml(slots[0].train_after_id || 'range end')}</span>`
          : '<br/><span class="small-muted">No window long enough — this corridor is continuously occupied in that range.</span>');
      toast(`${r.windows_found} vacancy window(s) computed for ${corridor_id}`, 'ok');
    }catch(e){ el.innerHTML = `<span class="row-errors">${escapeHtml(e.message)}</span>`; toast('Derive failed: ' + e.message, 'err'); }
  };

  // ---- Run scheduler: staged progress feedback, button disabled while running ----
  document.getElementById('run-btn').onclick = async ()=>{
    const btn = document.getElementById('run-btn');
    const el = document.getElementById('run-result');
    btn.disabled = true;
    btn.setAttribute('aria-busy', 'true');
    const stages = ['Scoring tasks&hellip;', 'Building the constraint model&hellip;', 'Solving constraints (may take up to 20s)&hellip;', 'Finalizing plan&hellip;'];
    let stageIdx = 0;
    const startedAt = Date.now();
    el.innerHTML = `<span class="mono" id="run-stage">${stages[0]}</span> <span class="mono small-muted" id="run-elapsed">0.0s</span>`;
    const stageTimer = setInterval(()=>{
      stageIdx = Math.min(stageIdx + 1, stages.length - 1);
      const s = document.getElementById('run-stage'); if(s) s.innerHTML = stages[stageIdx];
    }, 2200);
    const elapsedTimer = setInterval(()=>{
      const s = document.getElementById('run-elapsed'); if(s) s.textContent = ((Date.now()-startedAt)/1000).toFixed(1) + 's';
    }, 150);
    try{
      const preserveOverrides = document.getElementById('preserve-overrides-cb').checked;
      const r = await api(`/api/schedule/run?horizon=${state.horizon}&preserve_manual_overrides=${preserveOverrides}`, {method:'POST'});
      el.innerHTML = `Plan <b>${r.plan_id}</b> (v${r.version}): <b>${r.metrics.scheduled_count}</b> scheduled,
        <b>${r.metrics.unscheduled_count}</b> unscheduled, <b>${r.metrics.coordinated_blocks}</b> coordinated blocks,
        engine <b>${r.metrics.engine_used}</b>, solved in ${r.metrics.solve_time_seconds}s.`;
      toast(`Scheduler run complete &mdash; found ${r.metrics.coordinated_blocks} coordinated block(s)`, 'ok');
      loadPlanDependentPanels();
    }catch(e){
      el.innerHTML = `<span class="row-errors">${escapeHtml(e.message)}</span>`;
      toast('Scheduler run failed', 'err');
    }finally{
      clearInterval(stageTimer); clearInterval(elapsedTimer);
      btn.disabled = false;
      btn.removeAttribute('aria-busy');
    }
  };

  document.getElementById('tl-render-btn').onclick = ()=>renderMainTimeline(document.getElementById('tl-corridor').value.trim());
  document.getElementById('cmp-load-btn').onclick = ()=>loadComparison();
  const ingestWxBtn = document.getElementById('tl-ingest-weather-btn');
  if(ingestWxBtn){
    ingestWxBtn.onclick = async ()=>{
      const corridorId = document.getElementById('tl-corridor').value.trim();
      if(!corridorId){ toast('Enter a corridor first', 'warn'); return; }
      ingestWxBtn.disabled = true;
      try{
        // force=true: the button is an explicit user request, so bypass the
        // 6h cache TTL rather than silently returning the cached forecast.
        const r = await api('/api/weather/ingest?force=true', {method:'POST', body:{corridor_id: corridorId, days: 7}});
        if(r.available){
          toast(`Weather updated for ${corridorId} — ${r.hours_ingested} hourly rows from Open-Meteo ` +
                `(${r.location.lat}, ${r.location.lon}; ${r.location.basis})`, 'ok');
        }else{
          // No fabricated fallback exists: say unavailable, plainly.
          toast(`Weather UNAVAILABLE for ${corridorId} — provider unreachable. No values were fabricated. ${r.error || ''}`, 'err');
        }
        await renderMainTimeline(corridorId);
      }catch(e){ toast('Weather refresh failed: ' + e.message, 'err'); }
      finally{ ingestWxBtn.disabled = false; }
    };
  }

  loadSection('freight-list', ()=>api('/api/freight-forecast'), (forecasts)=>`
      <div class="table-wrap"><table><thead><tr><th>Corridor</th><th>Window (IST)</th><th>Expected Traffic</th></tr></thead>
      <tbody>${forecasts.map(f=>`<tr><td class="mono">${f.corridor_id}</td><td class="mono">${fmtDt(f.forecast_window_start, {noLabel:true})} &rarr; ${fmtDt(f.forecast_window_end, {noLabel:true})}</td><td>${f.expected_goods_traffic}</td></tr>`).join('')}</tbody></table></div>
    `, {emptyMessage: 'No freight forecast entries yet.'});

  const jumpToCorridor = state.pendingTimelineCorridor;
  if(jumpToCorridor){
    tlState.corridorId = jumpToCorridor;
    document.getElementById('tl-corridor').value = jumpToCorridor;
  }
  await loadPlanDependentPanels();
  if(jumpToCorridor){
    state.pendingTimelineCorridor = null;
    if(tlState.corridorId !== jumpToCorridor || !document.querySelector('#timeline-body .tl-toolbar')) await renderMainTimeline(jumpToCorridor);
    const tlPanel = document.getElementById('timeline-body');
    if(tlPanel) tlPanel.closest('.panel').scrollIntoView({behavior:'smooth', block:'start'});
  }
  loadMlControlPanel();
  loadDecisionIntelligencePanel();
  loadNetworkMap();
  loadPipelinePanel();
  installCOAShortcuts();
}

/* ============================== Layer 3: AI Priority & Risk Queue ============================== */
async function loadMlControlPanel(){
  await loadSection('ml-control-body', async ()=>{
    const [source, tasks] = await Promise.all([
      api('/api/admin/scoring-source').catch(()=>({source:'rule', valid_sources:['rule','ml','blend']})),
      api('/api/tasks?status=submitted').catch(()=>[]),
    ]);
    let evaluation = null;
    try{ evaluation = await api('/api/ml/evaluation'); }catch(e){ /* no model trained yet */ }
    return {source, tasks, evaluation};
  }, (data)=>{
    const {source, tasks, evaluation} = data;
    const rows = tasks.slice(0, 15);
    return `
      <div class="btn-row" style="margin-top:0;align-items:center;">
        <label style="margin:0;">Scoring source</label>
        <select id="scoring-source-select" style="width:140px;" ${source.can_change ? '' : 'disabled title="Admin only"'}>
          ${(source.valid_sources||['rule','ml','blend']).map(s=>`<option value="${s}" ${s===source.source?'selected':''}>${s}</option>`).join('')}
        </select>
        <button class="btn secondary small" id="save-scoring-source-btn" ${source.can_change ? '' : 'disabled title="Admin only"'}>Apply</button>
        <button class="btn small" id="train-ml-btn">Train / Retrain Models</button>
        <span id="ml-train-status" class="small-muted"></span>
        ${source.can_change===false ? '<span class="small-muted">(changing this requires Admin)</span>' : ''}
      </div>
      ${evaluation ? `
      <div class="metrics-strip" style="margin-top:14px;">
        <div class="metric-cell good"><div class="val mono">${evaluation.classification.chosen_model_auc}</div><div class="lbl">AUC (${escapeHtml(evaluation.classification.chosen_model)})</div></div>
        <div class="metric-cell"><div class="val mono">${evaluation.regression.xgboost_rmse}h</div><div class="lbl">Duration RMSE</div></div>
        <div class="metric-cell"><div class="val mono">${evaluation.ranking_agreement_with_true_generating_probability}</div><div class="lbl">True-Signal Correlation</div></div>
        <div class="metric-cell warn"><div class="val mono" style="font-size:12px;">SYNTHETIC</div><div class="lbl">Trained On</div></div>
      </div>
      <details style="margin-bottom:10px;"><summary class="small-muted" style="cursor:pointer;">Honest limitations (click to expand)</summary>
        <ul style="font-size:11px;color:var(--text-dim);margin:8px 0;">${evaluation.limitations.map(l=>`<li style="margin-bottom:6px;">${escapeHtml(l)}</li>`).join('')}</ul>
      </details>
      ` : '<p class="hint">No model trained yet this session &mdash; click "Train / Retrain Models" (trains XGBoost + Random Forest on 2000 synthetic records, ~3-5s).</p>'}
      <div class="table-wrap">
        <table><thead><tr><th>Task</th><th>Dept</th><th>Rule Score</th><th>ML Risk</th><th></th></tr></thead>
        <tbody>${rows.map(t=>`
          <tr>
            <td class="mono">${escapeHtml(t.task_id)}</td>
            <td><span class="badge dept-${t.department}">${t.department}</span></td>
            <td class="mono">${t.priority_score.toFixed(1)}</td>
            <td class="mono" id="ml-risk-${t.task_id}"><button class="btn secondary small" data-predict="${t.task_id}">Predict</button></td>
            <td></td>
          </tr>
        `).join('') || '<tr><td colspan="5" class="small-muted">No submitted tasks.</td></tr>'}</tbody></table>
      </div>
    `;
  }, {
    emptyMessage: 'No data yet.',
    afterRender: ()=>{
      document.getElementById('save-scoring-source-btn').onclick = async ()=>{
        const src = document.getElementById('scoring-source-select').value;
        try{
          const r = await api('/api/admin/scoring-source', {method:'POST', body:{source: src}});
          toast(`Scoring source set to ${src} &mdash; ${r.tasks_rescored} task(s) rescored`, 'ok');
          render();
        }catch(e){ toast('Failed: ' + e.message, 'err'); }
      };
      document.getElementById('train-ml-btn').onclick = async ()=>{
        const status = document.getElementById('ml-train-status');
        status.textContent = 'Training (XGBoost + Random Forest on synthetic data)...';
        try{
          const r = await api('/api/ml/train', {method:'POST'});
          status.textContent = '';
          toast(`Trained ${r.classification.chosen_model} &mdash; AUC ${r.classification.chosen_model_auc}`, 'ok');
          loadMlControlPanel();
        }catch(e){ status.textContent = ''; toast('Training failed: ' + e.message, 'err'); }
      };
      document.querySelectorAll('[data-predict]').forEach(btn=>{
        btn.onclick = async ()=>{
          const taskId = btn.dataset.predict;
          const cell = document.getElementById('ml-risk-' + taskId);
          cell.innerHTML = '<span class="small-muted">predicting&hellip;</span>';
          try{
            const p = await api('/api/ml/predict/' + encodeURIComponent(taskId));
            cell.innerHTML = `<span title="${escapeHtml(p.shap_explanation)}">${(p.failure_risk_probability*100).toFixed(0)}%</span>`;
          }catch(e){ cell.innerHTML = `<span class="small-muted">${e.message.includes('no trained') ? 'no model' : 'error'}</span>`; }
        };
      });
    },
  });
}

/* ============================== Layer 5: Decision Intelligence ============================== */
async function loadDecisionIntelligencePanel(){
  const el = document.getElementById('decision-intelligence-body');
  if(!el) return;
  el.innerHTML = `
    <div class="grid-3">
      <div>
        <h3 style="font-size:11.5px;color:var(--text-dim);text-transform:uppercase;margin-bottom:8px;">Emergency Re-optimization</h3>
        <form id="emergency-form">
          <label>Department</label>
          <select name="department"><option>ENG</option><option>TD</option><option>SNT</option></select>
          <label>Asset ID</label><input type="text" name="asset_id" required placeholder="registered asset" />
          <label>Defect type</label><input type="text" name="defect_type" required value="rail_fracture" />
          <label>Duration (h)</label><input type="number" name="required_duration_hours" value="1" min="0.1" step="0.1" required />
          <label>Corridor</label><input type="text" name="corridor_id" required value="THK-KYN" />
          <div class="btn-row"><button type="submit" class="btn small">Inject &amp; Re-optimize</button></div>
        </form>
        <div id="emergency-result" class="hint"></div>
      </div>
      <div>
        <h3 style="font-size:11.5px;color:var(--text-dim);text-transform:uppercase;margin-bottom:8px;">What-If Scenarios</h3>
        <p class="hint" style="margin-top:0;">Compares baseline capacity vs. a reduced-capacity vs. a corridor-closed
        scenario &mdash; entirely read-only, nothing is persisted.</p>
        <div class="btn-row" style="margin-top:0;"><button class="btn small" id="whatif-btn">Run 3 Scenarios</button></div>
        <div id="whatif-result"></div>
      </div>
      <div>
        <h3 style="font-size:11.5px;color:var(--text-dim);text-transform:uppercase;margin-bottom:8px;">Shadow Price</h3>
        <label>Corridor</label><input type="text" id="shadow-corridor" value="THK-KYN" />
        <label>Extra hours</label><input type="number" id="shadow-hours" value="4" min="0.5" step="0.5" />
        <div class="btn-row"><button class="btn small" id="shadow-btn">Compute Marginal Value</button></div>
        <div id="shadow-result" class="hint"></div>
      </div>
    </div>
  `;

  document.getElementById('emergency-form').onsubmit = async (ev)=>{
    ev.preventDefault();
    const fd = new FormData(ev.target);
    const payload = Object.fromEntries(fd.entries());
    payload.required_duration_hours = parseFloat(payload.required_duration_hours);
    payload.safety_critical = true;
    payload.stability_bonus = 60;
    const out = document.getElementById('emergency-result');
    out.textContent = 'Injecting and re-solving (may take up to 20s)...';
    try{
      const r = await api('/api/decision/emergency-reoptimize?horizon=' + state.horizon, {method:'POST', body:payload});
      out.innerHTML = `Emergency task <b>${r.emergency_task_id}</b> scheduled: <b>${r.emergency_task_scheduled}</b>.
        <b>${r.tasks_unchanged}</b> previously-published task(s) stayed exactly where they were;
        <b>${r.tasks_moved.length}</b> moved; <b>${r.tasks_newly_unscheduled.length}</b> newly bumped.`;
      toast('Emergency re-optimization complete', 'ok');
      loadPlanDependentPanels();
    }catch(e){ out.innerHTML = `<span class="row-errors">${escapeHtml(e.message)}</span>`; toast('Emergency re-opt failed: ' + e.message, 'err'); }
  };

  document.getElementById('whatif-btn').onclick = async ()=>{
    const out = document.getElementById('whatif-result');
    out.innerHTML = '<div class="small-muted" style="margin-top:8px;">Running 3 real solves (~60s total)...</div>';
    try{
      const r = await api('/api/decision/what-if?horizon=' + state.horizon, {method:'POST', body:[
        {name:'Current capacity (3)', corridor_capacity:3},
        {name:'Reduced capacity (1)', corridor_capacity:1},
        {name:'THK-KYN closed', exclude_corridors:['THK-KYN']},
      ]});
      out.innerHTML = `<div class="table-wrap" style="max-height:none;margin-top:8px;"><table><thead><tr><th>Scenario</th><th>Scheduled</th><th>Coordinated</th><th>Closures</th></tr></thead><tbody>
        ${r.scenarios.map(s=>`<tr><td>${escapeHtml(s.name)}</td><td class="mono">${s.scheduled_task_ids.length}</td><td class="mono">${s.metrics.coordinated_blocks}</td><td class="mono">${s.metrics.total_corridor_closures}</td></tr>`).join('')}
      </tbody></table></div>`;
      toast('What-if analysis complete', 'ok');
    }catch(e){ out.innerHTML = `<span class="row-errors">${escapeHtml(e.message)}</span>`; }
  };

  document.getElementById('shadow-btn').onclick = async ()=>{
    const corridor_id = document.getElementById('shadow-corridor').value.trim();
    const extra_hours = parseFloat(document.getElementById('shadow-hours').value);
    const out = document.getElementById('shadow-result');
    out.textContent = 'Computing (2 real solves, ~40s)...';
    try{
      const r = await api(`/api/decision/shadow-price?corridor_id=${encodeURIComponent(corridor_id)}&horizon=${state.horizon}&extra_hours=${extra_hours}`);
      out.innerHTML = `<b>${escapeHtml(r.statement)}</b>`;
      toast('Shadow price computed', 'ok');
    }catch(e){ out.innerHTML = `<span class="row-errors">${escapeHtml(e.message)}</span>`; }
  };
}

/* Loads/refreshes every panel that depends on the current plan: metrics
 * strip, unscheduled-tasks (filterable/sortable), plan approval + export,
 * and (if a plan exists) the default corridor timeline. Called on initial
 * COA render, after a scheduler run, and after a successful drag-reschedule
 * — so every dependent panel stays in sync with the authoritative plan. */
async function loadPlanDependentPanels(){
  let plan;
  try{
    plan = await fetchCurrentPlanOrNull();
  }catch(e){
    const msg = `<div class="state-box error"><div class="state-icon">&#9888;</div><div class="state-msg">${escapeHtml(e.message)}</div><button class="btn secondary small" id="plan-panels-retry">Retry</button></div>`;
    ['metrics-strip-wrap','unscheduled-table-wrap','plan-approval-body'].forEach(id=>{
      const el = document.getElementById(id); if(el) el.innerHTML = msg;
    });
    document.querySelectorAll('#plan-panels-retry').forEach(b=>b.onclick = loadPlanDependentPanels);
    return;
  }

  const metricsWrap = document.getElementById('metrics-strip-wrap');
  if(metricsWrap){
    if(!plan){
      metricsWrap.innerHTML = '';
    } else {
      // The strip's DOM is only (re)built once — repeat calls (e.g. right
      // after a scheduler run, without leaving this view) find it already
      // there and just tween the existing numbers to their new values,
      // which is what makes the KPI count-up visible instead of a snap.
      if(!metricsWrap.querySelector('.metrics-strip')){
        metricsWrap.innerHTML = `
          <div class="metrics-strip">
            <div class="metric-cell good"><div class="val mono" id="mv-scheduled">0</div><div class="lbl">Scheduled</div></div>
            <div class="metric-cell warn"><div class="val mono" id="mv-unscheduled">0</div><div class="lbl">Unscheduled</div></div>
            <div class="metric-cell good"><div class="val mono" id="mv-coordinated">0</div><div class="lbl">Coordinated Blocks</div></div>
            <div class="metric-cell"><div class="val mono" id="mv-solvetime">0.0s</div><div class="lbl">Solve Time</div></div>
            <div class="metric-cell"><div class="val mono" id="mv-engine" style="font-size:13px;">&mdash;</div><div class="lbl">Engine</div></div>
          </div>`;
      }
      tweenNumber(document.getElementById('mv-scheduled'), plan.metrics.scheduled_count, {duration:700});
      tweenNumber(document.getElementById('mv-unscheduled'), plan.metrics.unscheduled_count, {duration:700});
      tweenNumber(document.getElementById('mv-coordinated'), plan.metrics.coordinated_blocks, {duration:700});
      tweenNumber(document.getElementById('mv-solvetime'), plan.metrics.solve_time_seconds, {duration:700, decimals:2, suffix:'s'});
      document.getElementById('mv-engine').textContent = plan.metrics.engine_used;
    }
  }

  const resourceWrap = document.getElementById('resource-strip-wrap');
  if(resourceWrap){
    resourceWrap.innerHTML = plan && plan.resource_summary ? resourceStripHtml(plan) : '';
    resourceWrap.querySelectorAll('.rs-cell').forEach(btn=>{
      // Feature 10 -> 11 hook: only when the Network Map view is present.
      btn.onclick = ()=>{ if(typeof renderNetworkMapView === 'function') showGangsOnMap(plan, btn.dataset.dept); };
    });
  }

  const unschedWrap = document.getElementById('unscheduled-table-wrap');
  const unschedFilters = document.getElementById('unscheduled-filters');
  if(unschedWrap){
    if(!plan){
      unschedFilters.innerHTML = '';
      unschedWrap.innerHTML = `<div class="state-box"><div class="state-icon">&#9675;</div><div class="state-msg">No plan yet.</div><div class="state-hint">Run the scheduler above to produce one.</div></div>`;
    } else if(!plan.unscheduled.length){
      unschedFilters.innerHTML = '';
      unschedWrap.innerHTML = `<div class="state-box"><div class="state-icon">&#10003;</div><div class="state-msg">None &mdash; everything fit.</div></div>`;
    } else {
      renderFilterBar('unscheduled-filters', plan.unscheduled, {showDepartment:true}, (rows)=>{
        renderSortableTable('unscheduled-table-wrap', rows, {
          rowKey: r=>r.task_id, defaultSortKey: 'priority_score', searchFields: ['task_id','corridor_id','reason'],
          emptyMessage: 'No unscheduled tasks match the current filters.',
          columns: [
            {key:'task_id', label:'Task', sortable:true, render:u=>`<span class="mono">${escapeHtml(u.task_id)}</span>`},
            {key:'department', label:'Dept', sortable:true, render:u=>`<span class="badge dept-${u.department}">${u.department}</span>`},
            {key:'corridor_id', label:'Corridor', sortable:true, render:u=>`<span class="mono">${escapeHtml(u.corridor_id)}</span>`},
            {key:'priority_score', label:'Score', sortable:true, render:u=>`<span class="mono" style="color:${TIER_COLOR[priorityTier(u.priority_score)]}">${u.priority_score.toFixed(1)}</span>`},
            {key:'reason', label:'Reason', render:u=> u.reason_code === 'crew_capacity'
              ? `<span class="crew-reason-badge" title="Left out for want of a gang — add crew in the Admin panel, not corridor time">CREW</span>${escapeHtml(u.reason)}`
              : (u.reason && u.reason.startsWith('No weather-safe')
                ? `<span class="wx-reason-badge" style="margin-right:5px;">WEATHER</span>${escapeHtml(u.reason)}`
                : escapeHtml(u.reason))},
          ],
        });
      });
    }
  }

  const approvalWrap = document.getElementById('plan-approval-body');
  if(approvalWrap){
    if(!plan){
      approvalWrap.innerHTML = `<p class="small-muted">Run the scheduler first.</p>`;
    } else {
      approvalWrap.innerHTML = `
        <p>Plan <span class="accent mono">${plan.plan_id}</span> &middot; Status: <span class="badge ${plan.status}">${plan.status}</span> &middot; version <span class="mono">${plan.version}</span>
        ${plan.approved_by ? `&middot; approved by <span class="mono">${plan.approved_by}</span> at <span class="mono">${fmtDt(plan.approved_at)}</span>` : ''}
        ${plan.modified_after_publication ? `&middot; <span class="override-chip" title="A manual override was applied after this plan was published — it no longer exactly matches what was approved.">&#9995; MODIFIED AFTER PUBLICATION</span>` : ''}</p>
        <div class="btn-row">
          ${plan.status === 'draft' ? `
            <button class="btn" id="approve-btn">Approve &amp; Publish <kbd style="font-family:var(--mono);background:rgba(255,255,255,0.25);color:#fff;padding:1px 5px;border-radius:3px;margin-left:4px;">A</kbd></button>
            <button class="btn danger" id="reject-btn">Reject</button>
          ` : `<span class="small-muted">Only a draft plan can be approved or rejected. Run the scheduler to produce a new draft.</span>`}
        </div>
        <div class="btn-row">
          <button class="btn secondary small" id="export-csv-btn">Export CSV</button>
          <button class="btn secondary small" id="export-pdf-btn">Export PDF</button>
        </div>
      `;
      if(plan.status === 'draft'){
        document.getElementById('approve-btn').onclick = async ()=>{
          // Publishing closes a real corridor — this is the one interaction
          // in the app that should NOT feel light or snappy. Two explicit
          // steps, an accurate summary computed from the actual plan
          // entries (not just the aggregate metrics), and a deliberate
          // pause before the second click can even be pressed.
          const corridors = new Set(plan.entries.map(e=>e.corridor_id));
          const departments = new Set(plan.entries.map(e=>e.department));
          const blocks = plan.entries.length;

          const step1 = await confirmDialog({
            title: 'Publish this plan?',
            weighty: true, danger: false, confirmLabel: 'Review & Continue',
            bodyHtml: `
              <p>This will publish <b>${escapeHtml(plan.plan_id)}</b> for the <b>${state.horizon}</b> horizon
              to every affected department's dashboard, and supersede whatever is currently published for this horizon.</p>
              <div class="summary-line"><span>Blocks (real corridor closures)</span><span class="mono">${blocks}</span></div>
              <div class="summary-line"><span>Corridors affected</span><span class="mono">${corridors.size} (${[...corridors].join(', ')})</span></div>
              <div class="summary-line"><span>Departments affected</span><span class="mono">${[...departments].join(', ') || '—'}</span></div>
              <div class="summary-line"><span>Coordinated blocks</span><span class="mono">${plan.metrics.coordinated_blocks}</span></div>
              <div class="summary-line"><span>Tasks left unscheduled</span><span class="mono">${plan.metrics.unscheduled_count}</span></div>
            `,
          });
          if(!step1) return;

          const step2 = await confirmDialog({
            title: 'Confirm: this closes a real corridor',
            weighty: true, danger: false, confirmLabel: 'Publish Now', confirmDelayMs: 1200,
            bodyHtml: `<p>This is the final step. Once published, <b>${blocks}</b> block(s) across
              <b>${corridors.size}</b> corridor(s) are committed for every affected department to act on.
              This cannot be quietly undone from here — a new scheduler run would be needed to change it.</p>`,
          });
          if(!step2) return;

          try{
            await api('/api/schedule/approve', {method:'POST', body:{plan_id: plan.plan_id, decision:'approve'}});
            await loadPlanDependentPanels();
            await showPublishSuccessModal({
              planId: plan.plan_id, horizon: state.horizon, blocks,
              corridors: corridors.size, departments: [...departments].join(', ') || '—',
            });
          }catch(e){ toast('Publish failed: ' + e.message, 'err'); }
        };
        document.getElementById('reject-btn').onclick = async ()=>{
          const ok = await confirmDialog({
            title: 'Reject this draft?',
            danger: true, confirmLabel: 'Reject Draft',
            bodyHtml: `<p>This discards draft <b>${escapeHtml(plan.plan_id)}</b> permanently. You would need to run the scheduler again to produce a new one.</p>`,
          });
          if(ok) decidePlan(plan.plan_id, 'reject');
        };
      }
      document.getElementById('export-csv-btn').onclick = ()=>exportPlan('csv');
      document.getElementById('export-pdf-btn').onclick = ()=>exportPlan('pdf');
    }
  }

  if(plan && plan.entries.length){
    // Re-render whichever corridor is (or becomes) current with a staggered
    // block entrance — this is what makes "the plan returns" visibly show
    // blocks settling into position rather than the timeline popping in
    // whole, whether this is the very first render or a refresh right after
    // a scheduler run changed the plan underneath an already-open timeline.
    const corridorToShow = tlState.corridorId || plan.entries[0].corridor_id;
    if(!tlState.corridorId) document.getElementById('tl-corridor').value = corridorToShow;
    tlState.staggerEntrance = true;
    await renderMainTimeline(corridorToShow);
    tlState.staggerEntrance = false;
  }
  if(plan) loadComparison();
}

/* ---------- Feature 10: crew utilization strip (Control Office) ----------
 * One cell per department: peak simultaneous gangs vs the capacity in force
 * at that moment. Green < 75%, amber 75-100%, red when the optimizer had to
 * leave tasks unscheduled for want of a gang (or the plan now exceeds a
 * since-lowered capacity). Clicking a cell shows on the Network Map where
 * that department's gangs are working. */
function resourceStripHtml(plan){
  const cells = plan.resource_summary.map(r=>{
    const cap = r.capacity_at_peak != null ? r.capacity_at_peak : r.gangs_available;
    const limited = r.crew_limited_unscheduled.length;
    const overrides = r.date_overrides.length
      ? ` &middot; ${r.date_overrides.map(o=>`${o.date.slice(5)}: ${o.gangs}`).join(', ')}` : '';
    const title = `${r.department}: peak ${r.peak_concurrent} simultaneous gang(s)` +
      (r.peak_at ? ` at ${fmtDt(r.peak_at, {noLabel:true})} IST` : '') +
      ` against ${cap} available; ${r.gangs_used} distinct gang(s) used across the plan; ` +
      `${r.utilization_pct}% peak utilization` + (limited ? `; ${limited} task(s) unscheduled for lack of crew: ${r.crew_limited_unscheduled.join(', ')}` : '') +
      (r.over_capacity ? '; the plan EXCEEDS the capacity now configured — re-run the scheduler' : '') +
      '. Click to see where these gangs work on the Network Map.';
    return `<button type="button" class="rs-cell rs-${r.status}" data-dept="${r.department}" title="${escapeHtml(title)}">
      <div><span class="badge dept-${r.department}">${r.department}</span> <span class="rs-val">${r.peak_concurrent}/${cap}</span> <span class="small-muted">gangs peak</span></div>
      <div class="rs-sub">${r.utilization_pct}% &middot; ${r.gangs_used} gang(s) used${overrides}${limited ? ` &middot; <b style="color:var(--red);">${limited} crew-limited</b>` : ''}${r.over_capacity ? ' &middot; <b style="color:var(--red);">over capacity</b>' : ''}</div>
    </button>`;
  }).join('');
  return `<div class="resource-strip" role="group" aria-label="Crew utilization by department">
    <div class="rs-label">Crew / gang utilization</div>${cells}</div>`;
}

// Strip -> map: opens the Network Map on the first date (today or later) on
// which this department has gang work, with that department's gangs labelled.
function showGangsOnMap(plan, dept){
  const todayStr = istDateStr(new Date());
  const dates = plan.entries.filter(e=>e.department === dept)
    .map(e=>istDateStr(e.assigned_window_start)).filter(d=>d >= todayStr).sort();
  if(!dates.length){ toast(`No upcoming ${dept} gang work in this plan to show on the map.`, 'info'); }
  openNetworkMap({highlightDept: dept, date: dates[0] || todayStr});
}

async function exportPlan(format){
  try{
    const res = await fetch(`/api/schedule/plan/export?horizon=${encodeURIComponent(state.horizon)}&format=${format}`, {
      headers: {'Authorization': 'Bearer ' + state.accessToken},
    });
    if(res.status === 401){ handleSessionExpired(); throw new Error('Session expired — please log in again.'); }
    if(!res.ok){ const j = await res.json().catch(()=>({})); throw new Error(j.detail || ('HTTP ' + res.status)); }
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `abps_plan_${state.horizon}.${format}`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
    toast(`Exported plan as ${format.toUpperCase()}`, 'ok');
  }catch(e){ toast('Export failed: ' + e.message, 'err'); }
}

/* ---------- keyboard shortcuts (Control Office view) ---------- */
function installCOAShortcuts(){
  if(_coaKeyHandler) document.removeEventListener('keydown', _coaKeyHandler);
  _coaKeyHandler = (ev)=>{
    if(!state.currentUser || state.currentUser.role !== 'COA') return;
    const tag = (ev.target && ev.target.tagName || '').toLowerCase();
    if(tag === 'input' || tag === 'textarea' || tag === 'select') return;
    if(ev.key === '?'){ ev.preventDefault(); showShortcutsOverlay(); return; }
    if(ev.key.toLowerCase() === 'r'){
      const btn = document.getElementById('run-btn');
      if(btn && !btn.disabled){ ev.preventDefault(); btn.click(); }
    }
    if(ev.key.toLowerCase() === 'a'){
      const btn = document.getElementById('approve-btn');
      if(btn){ ev.preventDefault(); btn.click(); }
    }
  };
  document.addEventListener('keydown', _coaKeyHandler);
}
function showShortcutsOverlay(){
  confirmDialog({
    title: 'Keyboard Shortcuts',
    confirmLabel: 'Close', cancelLabel: 'Close',
    bodyHtml: `<table class="shortcuts-table">
      <tr><td><kbd>R</kbd></td><td>Run the scheduler</td></tr>
      <tr><td><kbd>A</kbd></td><td>Approve &amp; publish the current draft</td></tr>
      <tr><td><kbd>?</kbd></td><td>Show this shortcuts overlay</td></tr>
      <tr><td><kbd>Esc</kbd></td><td>Close any open dialog</td></tr>
      <tr><td><kbd>Tab</kbd> / <kbd>Shift+Tab</kbd></td><td>Move between fields and buttons</td></tr>
    </table>`,
  });
}

async function loadComparison(){
  const body = document.getElementById('cmp-body');
  if(!body) return;
  body.innerHTML = `<div class="skeleton-line w80"></div><div class="skeleton-line w60"></div>`;

  let cmp;
  try{
    cmp = await api('/api/schedule/comparison?horizon=' + state.horizon);
  }catch(e){
    if(!body.isConnected) return; // the view was navigated away while this was loading
    body.innerHTML = `
      <div class="state-box error"><div class="state-icon">&#9888;</div>
      <div class="state-msg">${escapeHtml(e.message)}</div>
      <button class="btn secondary small" id="cmp-retry-btn">Retry</button></div>`;
    document.getElementById('cmp-retry-btn').onclick = loadComparison;
    return;
  }
  if(!body.isConnected) return;

  const LOWER_BETTER = new Set(['total_corridor_closures', 'total_downtime_hours']);
  const HIGHER_BETTER = new Set(['tasks_completed', 'priority_weighted_completion', 'block_utilization_pct', 'coordinated_blocks']);
  const LABELS = {
    tasks_completed: 'Tasks Completed',
    total_corridor_closures: 'Corridor Closures',
    total_downtime_hours: 'Downtime Hours',
    priority_weighted_completion: 'Priority-Weighted Completion',
    block_utilization_pct: 'Block Utilization %',
    coordinated_blocks: 'Coordinated Blocks',
    avg_overdue_days_of_scheduled_tasks: 'Avg Overdue Days (scheduled)',
    tasks_total: 'Total Tasks Considered',
  };
  const ORDER = ['tasks_completed', 'total_corridor_closures', 'total_downtime_hours', 'priority_weighted_completion',
    'block_utilization_pct', 'coordinated_blocks', 'avg_overdue_days_of_scheduled_tasks', 'tasks_total'];

  function deltaClass(key, abs){
    if(!abs) return 'delta-neutral';
    if(LOWER_BETTER.has(key)) return abs < 0 ? 'delta-good' : 'delta-bad';
    if(HIGHER_BETTER.has(key)) return abs > 0 ? 'delta-good' : 'delta-bad';
    return 'delta-neutral';
  }

  const closuresAvoided = cmp.baseline.total_corridor_closures - cmp.optimized.total_corridor_closures;
  const downtimeSaved = cmp.baseline.total_downtime_hours - cmp.optimized.total_downtime_hours;
  const defaultCorridor = (cmp.baseline_entries[0] && cmp.baseline_entries[0].corridor_id) || document.getElementById('tl-corridor')?.value || 'THK-KYN';

  body.innerHTML = `
    <div class="metrics-strip" style="margin-top:14px;">
      <div class="metric-cell ${closuresAvoided >= 0 ? 'good' : 'warn'}"><div class="val mono">${closuresAvoided >= 0 ? closuresAvoided : 0}</div><div class="lbl">Corridor Closures Avoided</div></div>
      <div class="metric-cell ${downtimeSaved >= 0 ? 'good' : 'warn'}"><div class="val mono">${downtimeSaved.toFixed(1)}h</div><div class="lbl">Downtime Hours Saved</div></div>
      <div class="metric-cell"><div class="val mono">${cmp.baseline.tasks_completed} &rarr; ${cmp.optimized.tasks_completed}</div><div class="lbl">Tasks Completed (Before &rarr; After)</div></div>
      <div class="metric-cell"><div class="val mono">${cmp.baseline.coordinated_blocks} &rarr; ${cmp.optimized.coordinated_blocks}</div><div class="lbl">Coordinated Blocks (Before &rarr; After)</div></div>
    </div>
    <div class="table-wrap" style="max-height:none;">
      <table>
        <thead><tr><th>Metric</th><th>Before (Manual)</th><th>After (ABPS)</th><th>Delta</th></tr></thead>
        <tbody>
          ${ORDER.map(key=>{
            const b = cmp.baseline[key];
            const o = cmp.optimized[key];
            const d = cmp.delta[key];
            const cls = deltaClass(key, d.absolute);
            const sign = d.absolute > 0 ? '+' : '';
            return `<tr>
              <td>${LABELS[key]}</td>
              <td class="mono">${b}</td>
              <td class="mono">${o}</td>
              <td class="mono ${cls}">${sign}${d.absolute} (${sign}${d.percent}%)</td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>
    <div style="margin-top:16px;">
      <h2 style="margin-bottom:8px;">Corridor Timeline &mdash; Before vs After</h2>
      <div class="corridor-picker">
        <div>
          <label>Corridor to visualize</label>
          <input type="text" id="cmp-corridor" placeholder="e.g. THK-KYN" value="${escapeHtml(defaultCorridor)}" />
        </div>
        <div style="flex:none;"><button class="btn secondary" id="cmp-tl-render-btn" style="margin-top:0;">Render</button></div>
      </div>
      <div style="margin-top:10px;">
        <div class="small-muted" style="margin-bottom:4px;">BASELINE &mdash; manual process (before)</div>
        <div id="cmp-timeline-baseline"></div>
        <div class="small-muted" style="margin:12px 0 4px 0;">OPTIMIZED &mdash; ABPS (after)</div>
        <div id="cmp-timeline-optimized"></div>
      </div>
    </div>
  `;

  const corridorInput = document.getElementById('cmp-corridor');
  document.getElementById('cmp-tl-render-btn').onclick = () => renderComparisonTimelines(corridorInput.value.trim(), cmp);
  renderComparisonTimelines(defaultCorridor, cmp);
}

async function decidePlan(plan_id, decision){
  try{
    await api('/api/schedule/approve', {method:'POST', body:{plan_id, decision}});
    toast(`Plan ${decision === 'approve' ? 'approved & published' : 'rejected'}`, 'ok');
    loadPlanDependentPanels();
