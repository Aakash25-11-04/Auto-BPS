// The backend ALWAYS returns an explicit UTC offset on every timestamp
// (e.g. "2026-09-12T02:00:00+00:00" — see tz_utils.install_global_json_
// encoder / ensure_utc_out) specifically so this can never be ambiguous.
// This is still the one, single place that parses a server datetime
// string, as a defensive fallback for any value that somehow arrives
// without an offset: append 'Z' rather than letting `new Date(...)` parse
// it as the VIEWING BROWSER's local time (which would silently shift
// every timestamp by hours depending on where the browser happens to be —
// exactly the class of bug this whole IST fix exists to eliminate).
function parseServerDt(s){
  const iso = String(s).replace(' ', 'T');
  return new Date(/[Zz]|[+-]\d\d:?\d\d$/.test(iso) ? iso : iso + 'Z');
}

// IST is a FIXED UTC+5:30 offset — no daylight saving, ever (see backend
// tz_utils.py for the identical rationale). Every display path in this app
// converts to IST via this exact constant, NEVER via the browser's own
// locale/timezone (Date.toLocaleString() etc.) — a reviewer opening this
// app from outside India must see exactly the same IST time an operator in
// India sees.
const IST_OFFSET_MIN = 5 * 60 + 30;

// Returns a Date object whose getUTC*() accessors read out IST WALL-CLOCK
// fields. This is a deliberate trick (shift the underlying instant by the
// IST offset, then always read it back via the UTC-suffixed accessors) —
// not a real timezone conversion via Intl/toLocaleString — so it can never
// depend on the browser's timezone database, ICU data, or locale.
function toIST(input){
  const d = (input instanceof Date) ? input : parseServerDt(input);
  return new Date(d.getTime() + IST_OFFSET_MIN * 60000);
}

function _pad2(n){ return String(n).padStart(2, '0'); }

// "YYYY-MM-DD" — the IST CALENDAR date of a server timestamp (or now).
// This is the one function every "which day does this belong to" check in
// the timeline uses; taking the UTC calendar date directly here is exactly
// the near-midnight bug this whole fix targets (a train at 00:15 IST is
// 18:45 UTC the PREVIOUS day).
function istDateStr(input){
  const p = toIST(input);
  return `${p.getUTCFullYear()}-${_pad2(p.getUTCMonth()+1)}-${_pad2(p.getUTCDate())}`;
}
// "HH:MM" (or "HH:MM:SS") — the IST wall-clock time of a server timestamp.
function istTimeStr(input, withSeconds){
  const p = toIST(input);
  const hh = _pad2(p.getUTCHours()), mm = _pad2(p.getUTCMinutes());
  return withSeconds ? `${hh}:${mm}:${_pad2(p.getUTCSeconds())}` : `${hh}:${mm}`;
}

function _tlMinutesOfDay(iso){
  const p = toIST(iso);
  return p.getUTCHours()*60 + p.getUTCMinutes();
}
function _tlPct(mins){ return (mins/1440*100).toFixed(2) + '%'; }

/* ============================== time axis (Gantt) ==============================
 * Every day row in this timeline shares one 00:00-24:00 IST scale, so a
 * single axis lines up with every track beneath it. Tick DENSITY is chosen
 * from the measured pixel width rather than from the zoom level: the same
 * 24 hours can be 1800px wide (day zoom) or 900px (month zoom, narrow
 * window), and the only thing that actually matters is whether two adjacent
 * labels would collide. Fewer, well-spaced ticks always beat crammed ones. */
const TL_TICK_STEPS = [1, 2, 3, 4, 6, 8, 12];   // hours
const TL_MIN_TICK_PX = 56;                       // "00:00" plus breathing room

/* Vertical geometry inside one day's track. Blocks are stacked into LANES:
 * concurrent work on the same corridor is the entire point of this system
 * (up to `corridor_capacity` crews at once), and drawing those chips on top
 * of each other hid both their times and their hover/click targets. Each
 * overlapping block gets its own lane, and the track grows to fit. */
const TL_TRAIN_TOP = 3, TL_TRAIN_H = 4;
const TL_SLOT_TOP = 9, TL_SLOT_H = 8;
const TL_BLOCK_TOP = 20, TL_LANE_H = 18, TL_LANE_GAP = 2;

function tlTrackHeight(laneCount){
  return TL_BLOCK_TOP + Math.max(1, laneCount) * (TL_LANE_H + TL_LANE_GAP) + 2;
}

// First-fit lane packing: each item takes the lowest lane whose last block
// has already finished. Returns the items (sorted) with .lane set, plus how
// many lanes were needed.
function assignLanes(items){
  const sorted = items.slice().sort((a, b)=> (a.startMs - b.startMs) || (a.endMs - b.endMs));
  const laneEnds = [];
  sorted.forEach(it=>{
    let lane = laneEnds.findIndex(end => end <= it.startMs);
    if(lane === -1){ lane = laneEnds.length; laneEnds.push(it.endMs); }
    else laneEnds[lane] = it.endMs;
    it.lane = lane;
  });
  return {items: sorted, laneCount: Math.max(1, laneEnds.length)};
}
// Gang-lane packing for the timeline "Gang lanes" mode: lanes are the
// distinct gangs working this corridor that day, ordered by department then
// gang number. Entries without a gang label share an "unassigned" lane.
function assignGangLanes(items){
  const gangNum = g => parseInt(String(g).split('-').pop(), 10) || 0;
  const labels = [...new Set(items.map(it=>it.e.gang_id || 'unassigned'))]
    .sort((a,b)=> a.split('-')[0].localeCompare(b.split('-')[0]) || gangNum(a) - gangNum(b));
  const sorted = items.slice().sort((a,b)=> a.startMs - b.startMs);
  sorted.forEach(it=>{ it.lane = labels.indexOf(it.e.gang_id || 'unassigned'); });
  return {items: sorted, laneCount: Math.max(1, labels.length), laneLabels: labels};
}
// How wide the 24h track is at each zoom level. Wider at day zoom so blocks
// are fat and their times comfortably readable; the container scrolls
// horizontally when this exceeds the panel width.
const TL_TRACK_MIN_PX = {day: 1800, week: 1150, month: 900};

function tlTickStepHours(trackPx){
  for(const step of TL_TICK_STEPS){
    if((trackPx / (24 / step)) >= TL_MIN_TICK_PX) return step;
  }
  return TL_TICK_STEPS[TL_TICK_STEPS.length - 1];
}

// Ticks at 00:00, step, 2*step ... plus a final 24:00 marker. A tick is
// "major" at midnight and midday, which is what keeps a wide view readable.
function tlTicks(stepHours){
  const out = [];
  for(let h = 0; h <= 24; h += stepHours){
    out.push({hour: h, pct: (h / 24) * 100, major: (h % 12 === 0)});
  }
  return out;
}

function buildTimeAxisHtml(stepHours, opts){
  opts = opts || {};
  const ticks = tlTicks(stepHours);
  let inner = '';
  ticks.forEach(t=>{
    const label = t.hour === 24 ? '24:00' : `${_pad2(t.hour)}:00`;
    // The last tick sits exactly on the right edge; nudge its label inward
    // so it isn't clipped by the container.
    const shift = t.hour === 24 ? 'transform:translateX(-100%);' : (t.hour === 0 ? 'transform:translateX(0);' : '');
    inner += `<div class="tl-tick${t.major?' major':''}" style="left:${t.pct.toFixed(3)}%;"></div>`;
    inner += `<div class="tl-tick-label${t.major?' major':''}" style="left:${t.pct.toFixed(3)}%;${shift}">${label}</div>`;
  });
  if(opts.nowPct != null){
    inner += `<div class="tl-axis-now" style="left:${opts.nowPct}" title="Current time: ${escapeHtml(opts.nowLabel || '')}"></div>`;
  }
  return `<div class="tl-axis-row">
      <div class="tl-axis-spacer">${escapeHtml(opts.spacerLabel || 'DATE (IST)')}</div>
      <div class="tl-axis-col">${inner}</div>
    </div>`;
}

// Gridlines drawn at the SAME positions as the axis ticks, so a chip edge
// can be traced straight up to a readable time label.
function buildGridlinesHtml(stepHours){
  return '<div class="timeline-hour-grid">' + tlTicks(stepHours).map(t=>
    `<div class="tl-grid-line${t.major?' major':''}" style="left:${t.pct.toFixed(3)}%;"></div>`
  ).join('') + '</div>';
}

// "12 Sep\nSat" — the per-row date, which is this layout's equivalent of a
// date header above the hour ticks (each row IS one IST calendar day, so a
// row boundary IS the midnight boundary).
const TL_MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const TL_DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function tlDayLabelHtml(dayStr){
  const d = new Date(dayStr + 'T00:00:00Z');
  return `<span class="tl-dow">${d.getUTCDate()} ${TL_MONTHS[d.getUTCMonth()]}</span><br/>${TL_DOW[d.getUTCDay()]} &middot; IST`;
}

/* Chips carry their own start-end time as text. Whether the full range,
 * just the start, or an external label above fits can only be decided from
 * the MEASURED width, so this runs after the DOM exists (and again on
 * resize) rather than guessing from percentages. */
function fitBlockLabels(root){
  if(!root) return;
  root.querySelectorAll('.tl-block').forEach(b=>{
    const full = b.dataset.tFull || '';
    const short = b.dataset.tShort || '';
    if(!full && !short) return;
    const lab = b.querySelector('.tl-block-label');
    const old = b.querySelector('.tl-block-extlabel');
    if(old) old.remove();
    if(!lab) return;

    // MEASURE rather than guess at pixel thresholds: try the full range,
    // then just the start, and only fall back to an external label if even
    // that would be clipped. scrollWidth > clientWidth is the exact
    // "this text does not fit" test, and it stays correct at any font,
    // zoom level or browser text-size setting.
    lab.style.display = '';
    lab.textContent = full;
    if(lab.scrollWidth <= lab.clientWidth) return;

    lab.textContent = short;
    if(lab.scrollWidth <= lab.clientWidth) return;

    // Too narrow for any legible inner text — show the start time just
    // above the chip instead of dropping it.
    lab.textContent = '';
    lab.style.display = 'none';
    const ext = document.createElement('span');
    ext.className = 'tl-block-extlabel';
    ext.textContent = short;
    b.appendChild(ext);
  });
}

/* ---------- rich hover tooltip ---------- */
function tlTooltipEl(){
  let el = document.getElementById('tl-tooltip');
  if(!el){
    el = document.createElement('div');
    el.id = 'tl-tooltip';
    el.setAttribute('role', 'tooltip');
    document.body.appendChild(el);
  }
  return el;
}
function tlTooltipShow(html, ev){
  const el = tlTooltipEl();
  el.innerHTML = html;
  el.classList.add('visible');
  tlTooltipMove(ev);
}
function tlTooltipMove(ev){
  const el = document.getElementById('tl-tooltip');
  if(!el || !el.classList.contains('visible')) return;
  const pad = 14;
  const r = el.getBoundingClientRect();
  let x = ev.clientX + pad, y = ev.clientY + pad;
  if(x + r.width > window.innerWidth - 8) x = ev.clientX - r.width - pad;
  if(y + r.height > window.innerHeight - 8) y = ev.clientY - r.height - pad;
  el.style.left = Math.max(8, x) + 'px';
  el.style.top = Math.max(8, y) + 'px';
}
function tlTooltipHide(){
  const el = document.getElementById('tl-tooltip');
  if(el) el.classList.remove('visible');
}

function tlDurationText(startIso, endIso){
  const mins = Math.round((parseServerDt(endIso) - parseServerDt(startIso)) / 60000);
  const h = Math.floor(mins / 60), m = mins % 60;
  return h ? (m ? `${h}h ${m}m` : `${h}h`) : `${m}m`;
}

// Full detail for a scheduled block — everything a controller needs without
// having to click through to the side panel.
function blockTooltipHtml(e){
  const shared = e.co_scheduled_departments || [];
  const rows = [
    ['Start', `${fmtDt(e.assigned_window_start, {noLabel:true})} IST`],
    ['End', `${fmtDt(e.assigned_window_end, {noLabel:true})} IST`],
    ['Duration', tlDurationText(e.assigned_window_start, e.assigned_window_end)],
    ['Department', e.department],
    ['Corridor', e.corridor_id],
  ];
  if(e.gang_id) rows.push(['Gang', e.gang_id]);
  if(e.asset_id) rows.push(['Asset', e.asset_id]);
  if(e.defect_type) rows.push(['Defect', e.defect_type]);
  if(e.priority_score != null) rows.push(['Priority', `${e.priority_score.toFixed(1)} (${priorityTier(e.priority_score)})`]);
  if(e.severity != null) rows.push(['Severity', `${e.severity}/5`]);
  return `<div class="tt-title">${escapeHtml(e.task_id)}${e.override?' &#9995;':''}</div>` +
    rows.map(([k,v])=>`<div class="tt-row"><span class="tt-k">${escapeHtml(k)}</span><span class="tt-v">${escapeHtml(String(v))}</span></div>`).join('') +
    `<div class="tt-sep"></div>` +
    (shared.length
      ? `<div class="tt-row"><span class="tt-k">Shares window with</span><span class="tt-v">${shared.map(escapeHtml).join(', ')}</span></div>`
      : `<div class="tt-row"><span class="tt-k">Coordination</span><span class="tt-v">solo block</span></div>`) +
    (e.override
      ? `<div class="tt-sep"></div><div class="tt-row"><span class="tt-k">Manually assigned by</span><span class="tt-v">${escapeHtml(e.override_by || '—')} at ${e.override_at ? escapeHtml(fmtDt(e.override_at, {noLabel:true})) : '—'}</span></div>`
        + `<div class="tt-row"><span class="tt-k">Reason</span><span class="tt-v">${escapeHtml(e.override_reason || '—')}</span></div>`
      : '');
}

// Shared renderer: real trains (background layer) + available slots + a set
// of scheduled entries, positioned and sized by their REAL assigned times
// (not the enclosing window's times) so multiple tasks packed into one
// window visibly sit at different offsets. Used both by the main Corridor
// Timeline panel and by the Before/After dual timeline.
function buildTimelineDaysHtml(corridorId, templates, slots, entries, horizonDays){
  // "today" is today's IST CALENDAR date, not the UTC or browser-local one
  // — see istDateStr(). The 'Z' anchor trick below (constructing a Date at
  // literal UTC midnight of that Y-M-D string) is purely bookkeeping so the
  // existing day-stepping/.toISOString().slice(0,10) pattern keeps working
  // unchanged; it does not represent a real UTC instant.
  const today = new Date(istDateStr(new Date()) + 'T00:00:00Z');
  const days = [];
  for(let i=0;i<Math.min(horizonDays,14);i++){
    days.push(new Date(today.getTime() + i*86400000));
  }

  // Same axis machinery as the main timeline, so the two panels read
  // identically and a tick means the same thing in both.
  const stepHours = tlTickStepHours(TL_TRACK_MIN_PX.week);
  const gridHtml = buildGridlinesHtml(stepHours);
  const nowDayStr = istDateStr(new Date());
  const nowMinutes = _tlMinutesOfDay(new Date());
  const nowMs = Date.now();

  let html = buildTimeAxisHtml(stepHours, {spacerLabel: 'DATE (IST)'});
  days.forEach(day=>{
    const dayStr = day.toISOString().slice(0,10); // an IST calendar date, per the anchor above
    let inner = gridHtml;
    let trackHeight = tlTrackHeight(1);

    templates.forEach(t=>{
      const startMin = _tlMinutesOfDay(t.scheduled_departure);
      let durMin = (parseServerDt(t.scheduled_arrival) - parseServerDt(t.scheduled_departure)) / 60000;
      if(durMin <= 0) durMin = 5;
      const widthPct = Math.max(0.3, (durMin/1440*100));
      inner += `<div class="tl-train" style="left:${_tlPct(startMin)};width:${widthPct}%;top:${TL_TRAIN_TOP}px;height:${TL_TRAIN_H}px;" title="Train ${t.train_id} ${t.train_name}: dep ${istTimeStr(t.scheduled_departure)} IST"></div>`;
    });

    slots.forEach(s=>{
      // dayStr/startMin must both be IST — compare IST calendar dates, not
      // the UTC date of the raw stored instant (which can differ near
      // midnight IST).
      if(istDateStr(s.start_time) !== dayStr) return;
      const startMin = _tlMinutesOfDay(s.start_time);
      const widthPct = Math.max(0.3, (s.duration_hours*60/1440*100));
      inner += `<div class="tl-slot" style="left:${_tlPct(startMin)};width:${widthPct}%;top:${TL_SLOT_TOP}px;height:${TL_SLOT_H}px;" title="Available slot ${s.slot_id}: ${s.duration_hours}h (${s.derived_from})"></div>`;
    });

    // Lane-packed exactly like the main timeline — this panel's whole point
    // is comparing packing density, which is unreadable if overlapping
    // chips are drawn on top of one another.
    const dayEntries = entries
      .filter(e=>e.corridor_id===corridorId && istDateStr(e.assigned_window_start) === dayStr)
      .map(e=>({e, startMs: parseServerDt(e.assigned_window_start).getTime(), endMs: parseServerDt(e.assigned_window_end).getTime()}));
    const packed = assignLanes(dayEntries);
    trackHeight = Math.max(trackHeight, tlTrackHeight(packed.laneCount));

    packed.items.forEach(({e, lane, endMs})=>{
      const startMin = _tlMinutesOfDay(e.assigned_window_start);
      const durMin = (parseServerDt(e.assigned_window_end) - parseServerDt(e.assigned_window_start)) / 60000;
      const widthPct = Math.max(0.4, (durMin/1440*100));
      const shared = e.co_scheduled_departments && e.co_scheduled_departments.length;
      const tStart = istTimeStr(e.assigned_window_start), tEnd = istTimeStr(e.assigned_window_end);
      const isPast = endMs < nowMs;
      const laneTop = TL_BLOCK_TOP + lane * (TL_LANE_H + TL_LANE_GAP);
      const tip = `${e.task_id} (${e.department}) ${tStart}–${tEnd} IST · ${tlDurationText(e.assigned_window_start, e.assigned_window_end)}`
        + (shared ? ` · shared with ${e.co_scheduled_departments.join(', ')}` : ' · solo block');
      inner += `<div class="tl-block dept-${e.department}${isPast?' past':''}" style="left:${_tlPct(startMin)};width:${widthPct}%;top:${laneTop}px;height:${TL_LANE_H}px;"
        data-t-full="${tStart}&ndash;${tEnd}" data-t-short="${tStart}"
        title="${escapeHtml(tip)}"><span class="tl-block-label"></span></div>`;
    });

    if(dayStr === nowDayStr){
      inner += `<div class="tl-now-marker" style="left:${_tlPct(nowMinutes)};" title="Current time ${istTimeStr(new Date())} IST"></div>`;
    }

    html += `<div class="timeline-day"><div class="timeline-day-label">${tlDayLabelHtml(dayStr)}</div><div class="tl-day-col"><div class="timeline-track" style="height:${trackHeight}px;">${inner}</div></div></div>`;
  });
  return html;
}

/* ============================== main corridor timeline (interactive) ==============================
 * FR-COA-03: click a block for full task detail; drag a block to adjust its
 * time (COA + draft plan only, backend re-validates and rejects invalid
 * moves with a specific reason, and a rejected drag snaps back); zoom
 * between day/week/month granularity with prev/next paging; a live "now"
 * marker. Real train movements render as the background layer (unchanged
 * from before) so it stays visible that every block sits in a genuine gap. */
const tlState = {corridorId: '', granularity: 'week', dayOffset: 0, templates: [], slots: [], entries: [], planId: null, planStatus: null, selectedKey: null, staggerEntrance: false, weather: {}, gangLanes: false};
let _tlBlockCounter = 0;
let _tlResizeHandler = null;

function computeTimelineDays(granularity, dayOffset){
  // today's IST calendar date, anchored as literal UTC midnight purely for
  // day-stepping bookkeeping — see buildTimelineDaysHtml's identical note.
  const today = new Date(istDateStr(new Date()) + 'T00:00:00Z');
  const count = granularity === 'day' ? 1 : (granularity === 'month' ? 30 : 7);
  const start = new Date(today.getTime() + dayOffset * count * 86400000);
  const days = [];
  for(let i=0;i<count;i++) days.push(new Date(start.getTime() + i*86400000));
  return days;
}

function entryKey(e){ return e.id != null ? ('id:'+e.id) : ('tk:'+e.task_id+':'+e.assigned_window_start); }

    ${entry.id != null ? `<div class="dp-row"><div class="dp-label">Adjust</div><p class="small-muted" style="margin:0;">${state.currentUser.role==='COA' && tlState.planStatus==='draft' ? 'Drag this block left/right to change its time. Every move is re-validated against real trains, corridor capacity, and mutual exclusion — an invalid move snaps back with the reason.' : 'Only the Control Office can drag-adjust a block, and only while its plan is still a draft.'}</p></div>` : ''}

// Everything this block's gang does in the plan, on ANY corridor, in time
// order — so "GANG-1 does A then C while GANG-2 does B elsewhere" is visible
// from the one corridor the timeline happens to be showing.
function gangScheduleHtml(entry){
  const work = tlState.entries.filter(e=>e.gang_id === entry.gang_id)
    .sort((a,b)=>parseServerDt(a.assigned_window_start) - parseServerDt(b.assigned_window_start));
  return `<span class="gang-chip dept-${entry.department}">${escapeHtml(entry.gang_id)}</span>
    <div class="small-muted" style="margin-top:4px;">${work.length} task(s) for this gang in the plan:</div>
    <ol style="margin:2px 0 0 0;padding-left:16px;font-size:10.5px;line-height:1.55;">${work.map(w=>`
      <li style="${w.task_id===entry.task_id?'font-weight:700;':''}">
        <span class="mono">${escapeHtml(w.corridor_id)}</span> ${istDateStr(w.assigned_window_start).slice(5)}
        ${istTimeStr(w.assigned_window_start)}&ndash;${istTimeStr(w.assigned_window_end)} IST
        <span class="small-muted">${escapeHtml(w.task_id)}</span></li>`).join('')}</ol>`;
}

// Detail-panel action buttons only exist for a real, selected entry with
// manual-override permission — a no-op for the placeholder/no-selection
// state or a read-only viewer, called unconditionally after every
// detailPanelHtml render since it's cheap to check.
function wireDetailPanelActions(entry){
  const unschedBtn = document.getElementById('dp-unschedule-btn');
  const swapBtn = document.getElementById('dp-swap-btn');
  if(unschedBtn) unschedBtn.onclick = ()=>openUnscheduleModal(entry);
  if(swapBtn) swapBtn.onclick = ()=>openSwapModal(entry);
}

function buildInteractiveTimelineHtml(days, stepHours){
  const now = new Date();
  const nowDayStr = istDateStr(now);      // IST calendar date, not UTC/server-local
  const nowMinutes = _tlMinutesOfDay(now); // IST minutes-of-day
  const nowMs = now.getTime();
  const canDrag = state.currentUser.role === 'COA' && tlState.planStatus === 'draft';
  _tlBlockCounter = 0; // staggered-entrance delay counter, reset per draw
  const gridHtml = buildGridlinesHtml(stepHours || 2);

  let html = '';
  days.forEach(day=>{
    const dayStr = day.toISOString().slice(0,10);
    let inner = gridHtml;
    let trackHeight = tlTrackHeight(1);

    tlState.templates.forEach(t=>{
      const startMin = _tlMinutesOfDay(t.scheduled_departure);
      let durMin = (parseServerDt(t.scheduled_arrival) - parseServerDt(t.scheduled_departure)) / 60000;
      if(durMin <= 0) durMin = 5;
      const widthPct = Math.max(0.3, (durMin/1440*100));
      inner += `<div class="tl-train" style="left:${_tlPct(startMin)};width:${widthPct}%;top:${TL_TRAIN_TOP}px;height:${TL_TRAIN_H}px;" title="Train ${t.train_id} ${t.train_name}: dep ${istTimeStr(t.scheduled_departure)} IST"></div>`;
    });

    tlState.slots.forEach(s=>{
      // Compare IST calendar dates (istDateStr), not the raw stored UTC
      // instant's own date — those differ near IST midnight.
      if(istDateStr(s.start_time) !== dayStr) return;
      const startMin = _tlMinutesOfDay(s.start_time);
      const widthPct = Math.max(0.3, (s.duration_hours*60/1440*100));
      inner += `<div class="tl-slot" style="left:${_tlPct(startMin)};width:${widthPct}%;top:${TL_SLOT_TOP}px;height:${TL_SLOT_H}px;" title="Available slot ${s.slot_id}: ${s.duration_hours}h (${s.derived_from})"></div>`;
    });

    // Lane-pack this day's blocks so concurrent work never covers its
    // neighbour's time text (or its hover/click target).
    const dayEntries = tlState.entries
      .filter(e=>e.corridor_id===tlState.corridorId && istDateStr(e.assigned_window_start) === dayStr)
      .map(e=>({e, startMs: parseServerDt(e.assigned_window_start).getTime(), endMs: parseServerDt(e.assigned_window_end).getTime()}));
    // Gang lanes (optional, default off): one lane per assigned gang instead
    // of first-fit packing. A gang never overlaps itself, so each gang's
    // sequential work reads left-to-right along its own labelled lane.
    const packed = tlState.gangLanes ? assignGangLanes(dayEntries) : assignLanes(dayEntries);
    trackHeight = Math.max(trackHeight, tlTrackHeight(packed.laneCount));
    if(tlState.gangLanes){
      packed.laneLabels.forEach((label, lane)=>{
        const top = TL_BLOCK_TOP + lane * (TL_LANE_H + TL_LANE_GAP);
        inner += `<div class="tl-gang-lane" style="top:${top - 1}px;"></div><div class="tl-gang-label" style="top:${top + 3}px;">${escapeHtml(label)}</div>`;
      });
    }

    packed.items.forEach(({e, lane, endMs})=>{
      const startMin = _tlMinutesOfDay(e.assigned_window_start);
      const durMin = (parseServerDt(e.assigned_window_end) - parseServerDt(e.assigned_window_start)) / 60000;
      const widthPct = Math.max(0.4, (durMin/1440*100));
      const shared = e.co_scheduled_departments && e.co_scheduled_departments.length;
      const key = entryKey(e);
      const laneTop = TL_BLOCK_TOP + lane * (TL_LANE_H + TL_LANE_GAP);
      const label = `${e.task_id} (${e.department}) ${fmtDt(e.assigned_window_start)} to ${fmtDt(e.assigned_window_end)}${shared ? ', shared with '+e.co_scheduled_departments.join(', ') : ''}`;

      // Coordinated (2+ department) blocks get a diagonal color blend of every
      // department sharing that physical window, so sharing reads at a
      // glance instead of only on hover — the hover-link behavior (see
      // drawMainTimeline) is a second, complementary way to feel it.
      let colorClass = `dept-${e.department}`;
      let colorVars = '';
      if(shared){
        const allDepts = uniqueDeptOrder([e.department, ...e.co_scheduled_departments]);
        colorClass = allDepts.length >= 3 ? 'coord-3' : 'coord-2';
        allDepts.forEach((d,i)=>{ colorVars += `--c${i+1}:${DEPT_COLORS[d]};`; });
      }
      const cursorStyle = (e.id!=null && canDrag) ? '' : 'cursor:pointer;';
      const delay = (_tlBlockCounter++ * 45) % 900; // staggered entrance, capped so a long list doesn't take forever to finish appearing
      // Times printed ON the chip. fitBlockLabels() picks full/short/above
      // from the measured width after this HTML is in the DOM.
      const tStart = istTimeStr(e.assigned_window_start);
      const tEnd = istTimeStr(e.assigned_window_end);
      const isPast = endMs < nowMs;

      inner += `<div class="tl-block ${colorClass}${tlState.selectedKey===key?' selected':''}${isPast?' past':''}${e.override?' override':''}${tlState.staggerEntrance ? ' entering' : ''}"
        style="left:${_tlPct(startMin)};width:${widthPct}%;top:${laneTop}px;height:${TL_LANE_H}px;${cursorStyle}${colorVars}animation-delay:${delay}ms;"
        data-key="${escapeHtml(key)}" data-day="${dayStr}" data-slot-id="${escapeHtml(e.slot_id || '')}"
        data-t-full="${tStart}&ndash;${tEnd}" data-t-short="${tStart}"
        role="button" tabindex="0" aria-label="${escapeHtml(label)}${e.override?' (manually overridden)':''}"><span class="tl-block-label"></span></div>`;
    });

    if(dayStr === nowDayStr){
      inner += `<div class="tl-now-marker" style="left:${_tlPct(nowMinutes)};" title="Current time ${istTimeStr(now)} IST"></div>`;
    }

    html += `<div class="timeline-day"><div class="timeline-day-label">${tlDayLabelHtml(dayStr)}</div><div class="tl-day-col">${weatherStripHtml(dayStr)}<div class="timeline-track" data-day="${dayStr}" style="height:${trackHeight}px;">${inner}</div></div></div>`;
  });
  return html;
}

/* Weather overlay (Layer 6): a thin band directly above each day's track
 * showing the SAME WeatherForecastEntry rows the optimizer itself reads
 * (fetched from GET /api/weather/forecast, identical data path to
 * weather_service.get_forecast_rows) — so what's shown here can never drift
 * from what's actually enforced. Severity coloring mirrors the DEFAULT
 * hard/soft thresholds (lightning/wind>50/heat>45 = severe/red;
 * rain>60%/fog = elevated/amber) purely as a visual cue — the authoritative
 * per-task decision is always the backend's configurable rule table. */
function weatherSeverity(fc){
  if(!fc) return 'none';
  if(fc.lightning_risk || fc.wind_speed_kmh > 50 || fc.temperature_max_c > 45) return 'severe';
  if(fc.precipitation_probability_pct > 60 || fc.fog_risk) return 'elevated';
  return 'clear';
}
function weatherStripHtml(dayStr){
  const fc = (tlState.weather || {})[dayStr];
  const sev = weatherSeverity(fc);
  if(!fc){
    // Explicitly UNAVAILABLE, never "assumed clear" — the system has no
    // synthetic weather to fall back on by design (see adapters/weather.py).
    return `<div class="weather-strip wx-none" title="No Open-Meteo forecast has been ingested for this corridor/day, or the provider was unreachable. Weather is UNAVAILABLE here — it is not being assumed clear, and no values are fabricated.">weather unavailable &mdash; not assumed clear</div>`;
  }
  const parts = [];
  parts.push(`&#9748; ${fc.precipitation_probability_pct.toFixed(0)}%`);
  parts.push(`&#128168; ${fc.wind_speed_kmh.toFixed(0)}km/h`);
  if(fc.lightning_risk) parts.push('&#9889; lightning');
  if(fc.fog_risk) parts.push('&#127787; fog');
  parts.push(`${fc.temperature_max_c.toFixed(0)}&deg;C`);
  const title = `${dayStr} forecast (${fc.source}${fc.provider ? ', '+fc.provider : ''}): `+
    `precipitation ${fc.precipitation_probability_pct}%, wind ${fc.wind_speed_kmh}km/h, `+
    `visibility ${fc.visibility_km}km, lightning risk ${fc.lightning_risk}, temp ${fc.temperature_min_c}-${fc.temperature_max_c}°C`+
    (fc.reliable_forecast ? '' : ' — beyond the ~7-day reliable forecast horizon: advisory only, never a hard exclusion');
  const srcBadge = fc.source === 'synthetic' ? `<span class="wx-src-badge">SYNTHETIC</span>` : '';
  return `<div class="weather-strip wx-${sev}" title="${escapeHtml(title)}">${parts.join(' &middot; ')}${srcBadge}</div>`;
}

async function renderMainTimeline(corridorId){
  const body = document.getElementById('timeline-body');
  if(!corridorId){ body.innerHTML = '<div class="small-muted">Enter a corridor ID.</div>'; return; }
  body.innerHTML = `<div class="skeleton-line w80"></div><div class="skeleton-line w60"></div><div class="skeleton-line w40"></div>`;

  let templates, slots, plan;
  try{
    templates = await api('/api/timetable?corridor_id=' + encodeURIComponent(corridorId) + '&limit=2000');
    slots = await api('/api/corridor-availability?corridor_id=' + encodeURIComponent(corridorId) + '&horizon=' + state.horizon);
    plan = await fetchCurrentPlanOrNull();
  }catch(e){
    if(!body.isConnected) return;
    body.innerHTML = `
      <div class="state-box error"><div class="state-icon">&#9888;</div>
      <div class="state-msg">${escapeHtml(e.message)}</div>
      <button class="btn secondary small" id="tl-retry-btn">Retry</button></div>`;
    document.getElementById('tl-retry-btn').onclick = ()=>renderMainTimeline(corridorId);
    return;
  }

  // Weather overlay data — fetched separately and tolerated as optional
  // (no forecast ingested yet for this corridor is a normal, common state,
  // not an error that should block the rest of the timeline from showing).
  tlState.weather = {};
  try{
    const forecast = await api('/api/weather/forecast?corridor_id=' + encodeURIComponent(corridorId) + '&horizon=' + state.horizon);
    // forecast_date_ist is the IST calendar date this forecast covers,
    // computed server-side (see weather_service.forecast_date_ist) —
    // matches the IST dayStr keys buildInteractiveTimelineHtml uses.
    // Slicing the raw forecast_date (a UTC instant) would silently give
    // the wrong day near the IST/UTC boundary.
    forecast.forEach(f=>{ tlState.weather[f.forecast_date_ist] = f; });
  }catch(e){ /* weather overlay is advisory UI — a fetch failure just means no band renders */ }
  if(!body.isConnected) return; // navigated away while the timeline data was loading

  if(!templates.length){
    body.innerHTML = `
      <div class="state-box"><div class="state-icon">&#9675;</div>
      <div class="state-msg">No timetable entries for corridor "${escapeHtml(corridorId)}".</div>
      <div class="state-hint">Load the timetable and check the spelling — see the corridor chips above.</div></div>`;
    return;
  }

  tlState.corridorId = corridorId;
  tlState.templates = templates;
  tlState.slots = slots;
  tlState.entries = plan ? plan.entries : [];
  tlState.planId = plan ? plan.plan_id : null;
  tlState.planStatus = plan ? plan.status : null;
  tlState.modifiedAfterPublication = plan ? plan.modified_after_publication : false;
  drawMainTimeline();
}

function drawMainTimeline(){
  const body = document.getElementById('timeline-body');
  if(!body) return;
  const days = computeTimelineDays(tlState.granularity, tlState.dayOffset);
  const selected = tlState.entries.find(e=>entryKey(e)===tlState.selectedKey) || null;

  body.innerHTML = `
    <div class="tl-toolbar">
      <div class="tl-zoom-group" role="group" aria-label="Timeline granularity">
        ${['day','week','month'].map(g=>`<button type="button" class="btn secondary small ${tlState.granularity===g?'active':''}" data-gran="${g}">${g[0].toUpperCase()+g.slice(1)}</button>`).join('')}
      </div>
      <div class="btn-row" style="margin-top:0;align-items:center;">
        <span class="mono" style="font-weight:700;">${escapeHtml(tlState.corridorId)}</span>
        <button type="button" class="btn secondary small" id="tl-show-on-map" title="Open the Network Map zoomed to this corridor">&#9673; Show on map</button>
        <label class="small-muted" style="display:inline-flex;align-items:center;gap:4px;margin:0 6px;" title="Group blocks by assigned gang instead of packing them into the fewest lanes">
          <input type="checkbox" id="tl-gang-lanes" ${tlState.gangLanes?'checked':''} style="width:auto;" /> Gang lanes</label>
      </div>
      <div class="btn-row" style="margin-top:0;">
        <button type="button" class="btn secondary small" id="tl-prev">&larr; Earlier</button>
        <button type="button" class="btn secondary small" id="tl-today">Today</button>
        <button type="button" class="btn secondary small" id="tl-next">Later &rarr;</button>
      </div>
    </div>
    <div id="tl-drag-status" class="small-muted mono" aria-live="polite" style="min-height:16px;margin-bottom:6px;"></div>
    <div class="timeline-split">
      <div class="tl-main">
        <div class="tl-scroll" id="tl-scroll">
          <div id="tl-axis"></div>
          <div id="tl-days"></div>
        </div>
      </div>
      <div class="tl-detail-panel" id="tl-detail" aria-live="polite">${detailPanelHtml(selected)}</div>
    </div>
  `;
  wireDetailPanelActions(selected);

  // Track width per zoom level, then tick density from the width actually
  // available — never from the zoom level alone, so labels can't collide on
  // a narrow window (see tlTickStepHours).
  const scroller = document.getElementById('tl-scroll');
  const trackMinPx = TL_TRACK_MIN_PX[tlState.granularity] || 900;
  scroller.style.setProperty('--tl-track-min', trackMinPx + 'px');
  const availablePx = Math.max(0, scroller.clientWidth - 78 - 20); // minus date column + padding
  const trackPx = Math.max(trackMinPx, availablePx);
  const stepHours = tlTickStepHours(trackPx);

  // The axis NOW marker is only meaningful when today is actually one of the
  // rows on screen — on a paged-forward view it would just be a floating red
  // line at an unrelated time-of-day.
  const todayStr = istDateStr(new Date());
  const todayVisible = days.some(d=>d.toISOString().slice(0,10) === todayStr);
  document.getElementById('tl-axis').innerHTML = buildTimeAxisHtml(stepHours, {
    spacerLabel: 'DATE (IST)',
    nowPct: todayVisible ? _tlPct(_tlMinutesOfDay(new Date())) : null,
    nowLabel: `${todayStr} ${istTimeStr(new Date())} IST`,
  });
  document.getElementById('tl-days').innerHTML = buildInteractiveTimelineHtml(days, stepHours);
  fitBlockLabels(document.getElementById('tl-days'));

  // Re-fit on resize: the chips are percentage-width, so what text fits
  // changes with the viewport.
  if(_tlResizeHandler) window.removeEventListener('resize', _tlResizeHandler);
  _tlResizeHandler = ()=>fitBlockLabels(document.getElementById('tl-days'));
  window.addEventListener('resize', _tlResizeHandler);

  document.querySelectorAll('[data-gran]').forEach(btn=>{
    btn.onclick = ()=>{ tlState.granularity = btn.dataset.gran; tlState.dayOffset = 0; drawMainTimeline(); };
  });
  document.getElementById('tl-prev').onclick = ()=>{ tlState.dayOffset -= 1; drawMainTimeline(); };
  document.getElementById('tl-next').onclick = ()=>{ tlState.dayOffset += 1; drawMainTimeline(); };
  document.getElementById('tl-today').onclick = ()=>{ tlState.dayOffset = 0; drawMainTimeline(); };
  const showOnMapBtn = document.getElementById('tl-show-on-map');
  if(typeof renderNetworkMapView === 'function') showOnMapBtn.onclick = ()=>openNetworkMap({focusCorridor: tlState.corridorId});
  else showOnMapBtn.hidden = true;
  document.getElementById('tl-gang-lanes').onchange = (ev)=>{ tlState.gangLanes = ev.target.checked; drawMainTimeline(); };

  const canDrag = state.currentUser.role === 'COA' && tlState.planStatus === 'draft';
  document.querySelectorAll('#tl-days .tl-block').forEach(blockEl=>{
    const key = blockEl.dataset.key;
    const entry = tlState.entries.find(e=>entryKey(e)===key);
    if(!entry) return;

    function select(){ tlState.selectedKey = key; document.getElementById('tl-detail').innerHTML = detailPanelHtml(entry); wireDetailPanelActions(entry); document.querySelectorAll('#tl-days .tl-block.selected').forEach(b=>b.classList.remove('selected')); blockEl.classList.add('selected'); }
    blockEl.addEventListener('click', select);
    blockEl.addEventListener('keydown', (ev)=>{ if(ev.key==='Enter' || ev.key===' '){ ev.preventDefault(); select(); } });

    // Rich hover tooltip — full detail (exact IST start/end, duration, task,
    // asset, department, priority, coordination) without needing a click.
    // Hidden during a drag so it never covers the block being moved.
    blockEl.addEventListener('mouseenter', (ev)=>{
      if(blockEl.classList.contains('dragging')) return;
      tlTooltipShow(blockTooltipHtml(entry), ev);
    });
    blockEl.addEventListener('mousemove', tlTooltipMove);
    blockEl.addEventListener('mouseleave', tlTooltipHide);
    blockEl.addEventListener('pointerdown', tlTooltipHide);
    blockEl.addEventListener('blur', tlTooltipHide);

    // Timeline hover linking: every block sharing this block's physical
    // window (same slot_id — a genuine coordinated closure, not just any
    // block) highlights together; everything else dims, so a coordinated
    // closure is felt on hover, not only visible in the diagonal blend.
    const slotId = blockEl.dataset.slotId;
    if(slotId){
      blockEl.addEventListener('mouseenter', ()=>{
        if(blockEl.classList.contains('dragging')) return;
        const all = document.querySelectorAll('#tl-days .tl-block');
        const linked = document.querySelectorAll(`#tl-days .tl-block[data-slot-id="${CSS.escape(slotId)}"]`);
        const linkedSet = new Set(linked);
        all.forEach(b=>{ if(linkedSet.has(b)) b.classList.add('linked'); else b.classList.add('dimmed'); });
      });
      blockEl.addEventListener('mouseleave', ()=>{
        document.querySelectorAll('#tl-days .tl-block').forEach(b=>{ b.classList.remove('linked'); b.classList.remove('dimmed'); });
      });
      blockEl.addEventListener('focus', ()=>blockEl.dispatchEvent(new Event('mouseenter')));
      blockEl.addEventListener('blur', ()=>blockEl.dispatchEvent(new Event('mouseleave')));
    }

    if(canDrag && entry.id != null){
      wireBlockDrag(blockEl, entry);
    }

    // Right-click an existing block -> unschedule / swap / override history
    // (see onTimelineBlockContextMenu). stopPropagation so the track's own
    // empty-space contextmenu handler below doesn't also fire for the same click.
    blockEl.addEventListener('contextmenu', (ev)=>{
      ev.stopPropagation();
      onTimelineBlockContextMenu(ev, entry);
    });
  });

  // Right-click empty track space -> "Manually schedule a task here".
  document.querySelectorAll('#tl-days .timeline-track').forEach(trackEl=>{
    trackEl.addEventListener('contextmenu', (ev)=>{
      onTimelineTrackContextMenu(ev, trackEl.dataset.day, tlState.corridorId);
    });
  });
}

// Client-side APPROXIMATE re-check of the exact three constraints
// scheduler.reschedule_entry() enforces authoritatively server-side (real
// train safety, corridor-window containment, corridor capacity — mutual
// exclusion is skipped here since the plan payload doesn't carry each
// task's exclusion list, and is still fully enforced on drop). This is
// what makes the drag outline live (green/red) DURING the drag; the
// server's response on drop is always the real, final answer — this is
// only ever a preview, and a "valid-looking" drag can still be rejected on
// drop if the approximation missed something (e.g. mutual exclusion).
const CLIENT_CORRIDOR_CAPACITY = 3; // mirrors scheduler.DEFAULT_CORRIDOR_CAPACITY
function approxValidateMove(entry, candStart, candEnd){
  // candStart/candEnd are genuine UTC-correct Date objects (see
  // candidateFromLeftPct) — same space as parseServerDt(...) below, so
  // reducing both to minutes-of-day and comparing is an apples-to-apples
  // approximate overlap check (the real, authoritative check happens
  // server-side in scheduler.reschedule_entry on drop).
  const candStartMin = candStart.getUTCHours()*60 + candStart.getUTCMinutes();
  const candEndMin = candStartMin + Math.round((candEnd - candStart)/60000);
  for(const t of tlState.templates){
    const dep = parseServerDt(t.scheduled_departure), arr = parseServerDt(t.scheduled_arrival);
    const depMin = dep.getUTCHours()*60 + dep.getUTCMinutes();
    let arrMin = arr.getUTCHours()*60 + arr.getUTCMinutes();
    if(arrMin <= depMin) arrMin += 1440; // overnight leg
    if(depMin < candEndMin && candStartMin < arrMin){
      return {valid:false, reason:`would overlap real train ${t.train_id} (${istTimeStr(t.scheduled_departure)}–${istTimeStr(t.scheduled_arrival)} IST)`};
    }
  }
  const fitsWindow = tlState.slots.some(s=>{
    const sStart = parseServerDt(s.start_time), sEnd = parseServerDt(s.end_time);
    return candStart >= sStart && candEnd <= sEnd;
  });
  if(!fitsWindow) return {valid:false, reason:'does not fit fully inside any available corridor window'};
  const overlapping = tlState.entries.filter(o=>{
    if(o.corridor_id !== entry.corridor_id) return false;
    if(entryKey(o) === entryKey(entry)) return false;
    const os = parseServerDt(o.assigned_window_start), oe = parseServerDt(o.assigned_window_end);
    return os < candEnd && candStart < oe;
  });
  if(overlapping.length + 1 > CLIENT_CORRIDOR_CAPACITY) return {valid:false, reason:`would exceed corridor capacity (${CLIENT_CORRIDOR_CAPACITY})`};
  return {valid:true, reason:''};
}
function setDragStatus(text, isError){
  const el = document.getElementById('tl-drag-status');
  if(!el) return;
  el.textContent = text;
  el.style.color = isError ? 'var(--red)' : '';
}

function wireBlockDrag(blockEl, entry){
  let dragging = false, startX = 0, startLeftPct = 0, trackWidth = 0;
  const track = blockEl.closest('.timeline-track');
  const durationMin = Math.round((parseServerDt(entry.assigned_window_end) - parseServerDt(entry.assigned_window_start)) / 60000);

  function candidateFromLeftPct(leftPct){
    const dayStr = blockEl.dataset.day; // an IST calendar date (see buildInteractiveTimelineHtml)
    const startMin = Math.round((leftPct/100) * 1440 / 5) * 5; // IST minutes-of-day, snapped to 5min
    const hh = _pad2(Math.floor(startMin/60)), mm = _pad2(startMin%60);
    // Build the instant as an EXPLICIT-OFFSET IST string ("...+05:30") so
    // `new Date(...)` parses it into a genuinely correct UTC instant —
    // directly comparable to parseServerDt(...) output elsewhere in this
    // file, and sendable to the backend as-is (its IstIn validator honors
    // an explicit offset exactly, no reinterpretation).
    const candStart = new Date(`${dayStr}T${hh}:${mm}:00+05:30`);
    const candEnd = new Date(candStart.getTime() + durationMin*60000);
    return {candStart, candEnd};
  }

  blockEl.addEventListener('pointerdown', (ev)=>{
    if(ev.button !== 0) return;
    dragging = true;
    blockEl.setPointerCapture(ev.pointerId);
    blockEl.classList.add('dragging');
    startX = ev.clientX;
    trackWidth = track.getBoundingClientRect().width;
    startLeftPct = parseFloat(blockEl.style.left);
    setDragStatus('');
  });
  blockEl.addEventListener('pointermove', (ev)=>{
    if(!dragging) return;
    const deltaPct = ((ev.clientX - startX) / trackWidth) * 100;
    const widthPct = parseFloat(blockEl.style.width);
    const newLeftPct = Math.max(0, Math.min(100 - widthPct, startLeftPct + deltaPct));
    blockEl.style.left = newLeftPct + '%';

    // Live validation feedback, evaluated continuously as the pointer moves —
    // not only on drop.
    const {candStart, candEnd} = candidateFromLeftPct(newLeftPct);
    const check = approxValidateMove(entry, candStart, candEnd);
    blockEl.classList.toggle('drag-valid', check.valid);
    blockEl.classList.toggle('drag-invalid', !check.valid);
    const timeLabel = `${istTimeStr(candStart)}–${istTimeStr(candEnd)} IST`;
    setDragStatus(check.valid ? `Would move to ${timeLabel} — looks valid` : `Would move to ${timeLabel} — ${check.reason}`, !check.valid);
  });
  blockEl.addEventListener('pointerup', async (ev)=>{
    if(!dragging) return;
    dragging = false;
    blockEl.classList.remove('dragging', 'drag-valid', 'drag-invalid');
    try{ blockEl.releasePointerCapture(ev.pointerId); }catch(_e){}

    const newLeftPct = parseFloat(blockEl.style.left);
    if(Math.round(startLeftPct*100) === Math.round(newLeftPct*100)){ setDragStatus(''); return; } // no real move — don't call the API for a click-release

    const {candStart} = candidateFromLeftPct(newLeftPct);
    // candStart is a genuinely correct UTC instant (see candidateFromLeftPct)
    // — send its full explicit-offset ISO form, not a bare/truncated string.
    const newStartIso = candStart.toISOString();

    try{
      const result = await api(`/api/schedule/entries/${entry.id}/reschedule`, {method:'POST', body:{new_start: newStartIso}});
      setDragStatus('');
      toast(`Block moved to ${fmtDt(result.assigned_window_start)}`, 'ok');
      await renderMainTimeline(tlState.corridorId); // redraw from authoritative server state
      loadPlanDependentPanels(); // metrics/unscheduled/plan-approval all depend on the plan too
    }catch(e){
      setDragStatus('Move rejected, snapped back: ' + e.message, true);
      toast('Move rejected — snapped back: ' + e.message, 'err');
      drawMainTimeline(); // snap back: redraw from the last-known-good (unmutated) tlState
    }
  });
}

/* ============================== Manual Overrides (FR-COA-03) ==============================
 * COA/ADMIN bypass the optimizer entirely for one task at a time: place an
 * unscheduled task into a specific window (manual-assign), pull a placed
 * one out (manual-unschedule), or swap one placed task for another
 * (manual-swap) — each individually reasoned and audit-logged. Reachable
 * two ways on the timeline: right-click empty space to schedule something
 * there, or right-click an existing block to unschedule/swap/view history.
 * Overrides work on a DRAFT or a PUBLISHED plan (unlike drag-reschedule,
 * which is draft-only) — overriding a published plan doesn't need
 * re-approval, it just flags the plan modified_after_publication. */

function canManuallyOverride(){
  return (state.currentUser.role === 'COA' || state.currentUser.role === 'ADMIN')
    && (tlState.planStatus === 'draft' || tlState.planStatus === 'published');
}

// Tasks with no current place in the plan — the picker pool for manual-assign
// and the "incoming" side of a swap. manually_removed/displaced are included
// alongside unscheduled: all three mean "not currently in this plan", just
// with a different reason (optimizer couldn't place it vs. a human chose to
// pull it out vs. bumped by a swap) — a COA re-placing one of these is
// exactly what the status distinction exists to make findable.
async function fetchOverridableTaskPool(corridorId){
  const tasks = await api('/api/tasks');
  return tasks
    .filter(t => ['unscheduled', 'manually_removed', 'displaced'].includes(t.status))
    .filter(t => !corridorId || t.corridor_id === corridorId)
    .sort((a, b) => b.priority_score - a.priority_score);
}

function taskPickListHtml(tasks, selectedId){
  if(!tasks.length) return `<div class="small-muted" style="padding:8px;">No unscheduled/removed tasks on this corridor.</div>`;
  return `<div class="task-pick-list">` + tasks.map(t => `
    <div class="task-pick-row${t.task_id===selectedId?' selected':''}" data-task-id="${escapeHtml(t.task_id)}">
      <span class="badge dept-${t.department}">${t.department}</span>
      <span class="mono">${escapeHtml(t.task_id)}</span>
      <span class="small-muted" style="flex:1;">${escapeHtml(t.defect_type)}</span>
      <span class="mono" style="color:${TIER_COLOR[priorityTier(t.priority_score)]}">${t.priority_score.toFixed(1)}</span>
      <span class="badge ${t.status}">${t.status}</span>
    </div>`).join('') + `</div>`;
}

function impactPreviewHtml(impact){
  if(!impact) return '';
  let html = '';
  if(impact.hard_safety_violation){
    html += `<div class="override-hard-error">&#9888; Cannot proceed &mdash; hard safety violation: ${escapeHtml(impact.hard_safety_violation)}</div>`;
  } else if(impact.soft_warnings && impact.soft_warnings.length){
    html += `<ul class="override-warning-list">` + impact.soft_warnings.map(w=>`<li>&#9888; ${escapeHtml(w)}</li>`).join('') + `</ul>`;
  } else {
    html += `<div class="small-muted" style="padding:4px 0;">No soft-constraint warnings &mdash; a clean placement.</div>`;
  }
  if(impact.displacement_required){
    html += `<div class="override-hard-error">Would exceed the absolute capacity ceiling &mdash; specify a task to displace via "Swap with another task" instead. Candidates: ${escapeHtml((impact.displaceable_candidates||[]).join(', '))}</div>`;
  }
  if(impact.optimizer_reasoning && impact.optimizer_reasoning.explanation){
    html += `<div class="justification" style="margin-top:8px;"><b>Optimizer's own reasoning:</b> ${escapeHtml(impact.optimizer_reasoning.explanation)}</div>`;
  }
  if(impact.weather){
    const w = impact.weather;
    html += `<div class="small-muted" style="margin-top:6px;">Weather for this window (${w.granularity}): ${w.precipitation_probability_pct}% precip, ${w.wind_speed_kmh}km/h wind, visibility ${w.visibility_km}km${w.lightning_risk?', <b>lightning risk</b>':''}${w.fog_risk?', fog':''}.</div>`;
  }
  return html;
}

// Opens the "Manually schedule a task here" panel — from right-clicking
// empty timeline space. corridorId/prefillStartIso come from where the user
// clicked; slotId is resolved from whichever available slot contains that
// instant, if any (the picker also lets them choose a different slot).
async function openManualScheduleModal({corridorId, prefillStartIso}){
  const root = document.getElementById('modal-root');
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay weighty';
  const planId = tlState.planId;
  const slots = tlState.slots.filter(s => s.corridor_id === corridorId);
  const defaultSlot = slots.find(s => {
    const st = parseServerDt(s.start_time), en = parseServerDt(s.end_time);
    const t = new Date(prefillStartIso);
    return t >= st && t < en;
  }) || slots[0];

  overlay.innerHTML = `
    <div class="modal-card weighty" role="dialog" aria-modal="true" aria-labelledby="ms-title" style="max-width:640px;width:95vw;max-height:88vh;overflow-y:auto;text-align:left;">
      <h3 id="msov-title">Manually Schedule a Task &mdash; ${escapeHtml(corridorId)}</h3>
      <p class="small-muted" style="margin-top:-6px;">Bypasses the optimizer entirely for this one task. Hard safety constraints still apply; everything else is a warning, not a block.</p>
      <div class="grid-2" style="margin-top:10px;">
        <div>
          <label for="msov-slot">Corridor window</label>
          <select id="msov-slot">${slots.map(s=>`<option value="${escapeHtml(s.slot_id)}" ${defaultSlot && s.slot_id===defaultSlot.slot_id?'selected':''}>${fmtDt(s.start_time,{noLabel:true})} &rarr; ${fmtDt(s.end_time,{noLabel:true})} (${s.duration_hours}h, ${s.derived_from})</option>`).join('') || '<option value="">No available windows on this corridor</option>'}</select>
        </div>
        <div>
          <label for="msov-start">Start time (IST)</label>
          <input type="datetime-local" id="msov-start" step="60" value="${istDateStr(prefillStartIso)}T${istTimeStr(prefillStartIso)}" />
        </div>
      </div>
      <label for="msov-task-search" style="margin-top:10px;">Unscheduled tasks on this corridor (sorted by priority)</label>
      <input type="text" id="msov-task-search" placeholder="Search task ID, defect type..." autocomplete="off" />
      <div id="msov-task-list"></div>
      <div id="msov-impact"></div>
      <label for="msov-reason" style="margin-top:10px;">Reason for override <span class="small-muted">(mandatory)</span></label>
      <textarea id="msov-reason" rows="2" required placeholder="Why override the optimizer here?"></textarea>
      <div class="btn-row">
        <button class="btn secondary" id="msov-cancel">Cancel</button>
        <button class="btn override" id="msov-confirm" disabled>Confirm Override</button>
      </div>
      <div id="msov-error" class="row-errors"></div>
    </div>`;
  root.appendChild(overlay);

  let selectedTaskId = null;
  let lastImpact = null;

  async function refreshTaskList(){
    const listEl = document.getElementById('msov-task-list');
    listEl.innerHTML = `<div class="skeleton-line w80"></div>`;
    let tasks;
    try{ tasks = await fetchOverridableTaskPool(corridorId); }
    catch(e){ listEl.innerHTML = `<div class="row-errors">${escapeHtml(e.message)}</div>`; return; }
    const q = (document.getElementById('msov-task-search').value || '').toLowerCase();
    const filtered = q ? tasks.filter(t => (t.task_id+t.defect_type+t.asset_id).toLowerCase().includes(q)) : tasks;
    listEl.innerHTML = taskPickListHtml(filtered, selectedTaskId);
    listEl.querySelectorAll('.task-pick-row').forEach(row=>{
      row.onclick = ()=>{ selectedTaskId = row.dataset.taskId; refreshTaskList(); refreshImpact(); };
    });
  }

  async function refreshImpact(){
    const impactEl = document.getElementById('msov-impact');
    const confirmBtn = document.getElementById('msov-confirm');
    const slotId = document.getElementById('msov-slot').value;
    const startIso = document.getElementById('msov-start').value; // naive IST wall-clock string — the backend's IstIn validator interprets it as IST, same convention as the existing manual-slot-form
    if(!selectedTaskId || !slotId){ impactEl.innerHTML = ''; confirmBtn.disabled = true; return; }
    impactEl.innerHTML = `<div class="small-muted" style="padding:6px 0;">Checking impact&hellip;</div>`;
    try{
      lastImpact = await api(`/api/schedule/override-impact?plan_id=${encodeURIComponent(planId)}&task_id=${encodeURIComponent(selectedTaskId)}&slot_id=${encodeURIComponent(slotId)}&start_time_ist=${encodeURIComponent(startIso)}`);
      impactEl.innerHTML = impactPreviewHtml(lastImpact);
      confirmBtn.disabled = !lastImpact.would_succeed;
    }catch(e){
      impactEl.innerHTML = `<div class="row-errors">${escapeHtml(e.message)}</div>`;
      confirmBtn.disabled = true;
    }
  }

  refreshTaskList();
  document.getElementById('msov-task-search').addEventListener('input', refreshTaskList);
  document.getElementById('msov-slot').addEventListener('change', refreshImpact);
  document.getElementById('msov-start').addEventListener('change', refreshImpact);

  function close(){ closeContextMenu(); root.contains(overlay) && root.removeChild(overlay); }
  document.getElementById('msov-cancel').onclick = close;
  overlay.addEventListener('click', (ev)=>{ if(ev.target === overlay) close(); });

  document.getElementById('msov-confirm').onclick = async ()=>{
    const reason = document.getElementById('msov-reason').value.trim();
    const errEl = document.getElementById('msov-error');
    if(!reason){ errEl.textContent = 'A reason is required for a manual override.'; return; }
    const slotId = document.getElementById('msov-slot').value;
    const startIso = document.getElementById('msov-start').value; // naive IST wall-clock string — the backend's IstIn validator interprets it as IST, same convention as the existing manual-slot-form
    errEl.textContent = '';
    try{
      const result = await api('/api/schedule/manual-assign', {method:'POST', body:{
        plan_id: planId, task_id: selectedTaskId, slot_id: slotId, start_time_ist: startIso, reason,
      }});
      close();
      toast(
        result.warnings && result.warnings.length
          ? `Manually scheduled ${result.task_id} &mdash; ${result.warnings.length} warning(s) acknowledged`
          : `Manually scheduled ${result.task_id}`,
        result.warnings && result.warnings.length ? 'warn' : 'ok',
        {title: 'Manual override applied'}
      );
      await renderMainTimeline(tlState.corridorId);
      loadPlanDependentPanels();
    }catch(e){ errEl.textContent = e.message; }
  };
}

// Right-click an EXISTING block -> swap with another (currently unplaced) task.
async function openSwapModal(outgoingEntry){

  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay weighty';
  const planId = tlState.planId;

  overlay.innerHTML = `
    <div class="modal-card weighty" role="dialog" aria-modal="true" aria-labelledby="sw-title" style="max-width:640px;width:95vw;max-height:88vh;overflow-y:auto;text-align:left;">
      <h3 id="sw-title">Swap Out ${escapeHtml(outgoingEntry.task_id)}</h3>
      <p class="small-muted" style="margin-top:-6px;">Displaces this block and places a different task in its exact window (${fmtDt(outgoingEntry.assigned_window_start,{noLabel:true})} &rarr; ${fmtDt(outgoingEntry.assigned_window_end,{noLabel:true})} on ${escapeHtml(outgoingEntry.corridor_id)}).</p>

    </div>`;

  let selectedTaskId = null;

  async function refreshTaskList(){
    const listEl = document.getElementById('sw-task-list');
    listEl.innerHTML = `<div class="skeleton-line w80"></div>`;
    let tasks;
    try{ tasks = await fetchOverridableTaskPool(outgoingEntry.corridor_id); }
    catch(e){ listEl.innerHTML = `<div class="row-errors">${escapeHtml(e.message)}</div>`; return; }
    const q = (document.getElementById('sw-task-search').value || '').toLowerCase();
    const filtered = (q ? tasks.filter(t => (t.task_id+t.defect_type+t.asset_id).toLowerCase().includes(q)) : tasks)
      .filter(t => t.task_id !== outgoingEntry.task_id);
    listEl.innerHTML = taskPickListHtml(filtered, selectedTaskId);
    listEl.querySelectorAll('.task-pick-row').forEach(row=>{
      row.onclick = ()=>{ selectedTaskId = row.dataset.taskId; refreshTaskList(); refreshImpact(); };

    const impactEl = document.getElementById('sw-impact');
    const confirmBtn = document.getElementById('sw-confirm');
    if(!selectedTaskId){ impactEl.innerHTML = ''; confirmBtn.disabled = true; return; }
    impactEl.innerHTML = `<div class="small-muted" style="padding:6px 0;">Checking impact&hellip;</div>`;
    try{
      const startIso = new Date(outgoingEntry.assigned_window_start).toISOString();
      const impact = await api(`/api/schedule/override-impact?plan_id=${encodeURIComponent(planId)}&task_id=${encodeURIComponent(selectedTaskId)}&slot_id=${encodeURIComponent(outgoingEntry.slot_id)}&start_time_ist=${encodeURIComponent(startIso)}`);
      impactEl.innerHTML = impactPreviewHtml(impact);
      confirmBtn.disabled = false; // hard-safety re-checked authoritatively by the swap endpoint itself on submit
    }catch(e){
      impactEl.innerHTML = `<div class="row-errors">${escapeHtml(e.message)}</div>`;

        plan_id: planId, incoming_task_id: selectedTaskId, outgoing_task_id: outgoingEntry.task_id,

      tlState.selectedKey = null;

  };

// Right-click dispatch: empty timeline track space -> schedule; an existing
// block -> unschedule/swap/history. `dayStr`/`leftPct` locate the click on
// the track in the same coordinate space wireBlockDrag already uses.
function onTimelineTrackContextMenu(ev, dayStr, corridorId){
  if(!canManuallyOverride()) return;
  ev.preventDefault();
  const track = ev.currentTarget;
  const rect = track.getBoundingClientRect();
  const leftPct = ((ev.clientX - rect.left) / rect.width) * 100;
  const startMin = Math.round((leftPct/100) * 1440 / 5) * 5;
  const hh = _pad2(Math.floor(startMin/60)), mm = _pad2(startMin%60);
  const prefillStartIso = new Date(`${dayStr}T${hh}:${mm}:00+05:30`).toISOString();
  showContextMenu(ev.clientX, ev.clientY, [
    {label_only: corridorId},
    {label: 'Manually schedule a task here', onSelect: ()=>openManualScheduleModal({corridorId, prefillStartIso})},
  ]);
}
function onTimelineBlockContextMenu(ev, entry){
  tlTooltipHide();
  if(!canManuallyOverride()){
    if(entry.override){
      ev.preventDefault();
      showContextMenu(ev.clientX, ev.clientY, [{label: 'View override history', onSelect: ()=>openOverrideHistoryModal(entry)}]);
    }
    return;
  }
  ev.preventDefault();
  const items = [
    {label_only: entry.task_id},
    {label: 'Unschedule this task', danger: true, onSelect: ()=>openUnscheduleModal(entry)},
    {label: 'Swap with another task', onSelect: ()=>openSwapModal(entry)},
  ];
  if(entry.override) items.push({separator: true}, {label: 'View override history', onSelect: ()=>openOverrideHistoryModal(entry)});
  showContextMenu(ev.clientX, ev.clientY, items);
}

async function renderComparisonTimelines(corridorId, comparison){
  const baseWrap = document.getElementById('cmp-timeline-baseline');
  const optWrap = document.getElementById('cmp-timeline-optimized');
  if(!baseWrap || !optWrap) return;
  if(!corridorId){
    baseWrap.innerHTML = optWrap.innerHTML = '<div class="small-muted">Enter a corridor ID.</div>';
    return;
  }
  baseWrap.innerHTML = optWrap.innerHTML = '<div class="small-muted">Loading...</div>';
  const horizonDays = state.horizon === 'monthly' ? 30 : 7;

  let templates = [], slots = [], plan = null;
  try{
    templates = await api('/api/timetable?corridor_id=' + encodeURIComponent(corridorId) + '&limit=2000');
    slots = await api('/api/corridor-availability?corridor_id=' + encodeURIComponent(corridorId) + '&horizon=' + state.horizon);
    plan = await api('/api/schedule/plan?horizon=' + state.horizon).catch(()=>null);
  }catch(e){
    baseWrap.innerHTML = optWrap.innerHTML = `<div class="row-errors">${escapeHtml(e.message)}</div>`;
    return;
  }
  if(!templates.length){
    const msg = `<div class="small-muted">No timetable entries for corridor "${escapeHtml(corridorId)}".</div>`;
    baseWrap.innerHTML = optWrap.innerHTML = msg;
    return;
  }

  // baseline_entries use {start,end}; reshape to the {assigned_window_start,
  // assigned_window_end, co_scheduled_departments} field names the shared
  // renderer expects. Baseline coordination is always empty by construction
  // (whole-window exclusive claim), which the timeline will visibly show as
  // one solid single-department block per window versus the optimized
  // timeline's tightly packed, multi-department blocks below it.
  const baselineEntries = (comparison.baseline_entries || []).map(e => ({
    task_id: e.task_id, department: e.department, corridor_id: e.corridor_id,
    assigned_window_start: e.start, assigned_window_end: e.end, co_scheduled_departments: [],
  }));
  const optimizedEntries = plan ? plan.entries : [];

  baseWrap.innerHTML = buildTimelineDaysHtml(corridorId, templates, slots, baselineEntries, horizonDays);
  optWrap.innerHTML = buildTimelineDaysHtml(corridorId, templates, slots, optimizedEntries, horizonDays);
  // Same geometry + chip-label fitting as the main timeline, so the two
  // panels are directly comparable tick for tick.
  [baseWrap, optWrap].forEach(w=>{
    w.classList.add('tl-scroll');
    w.style.setProperty('--tl-track-min', TL_TRACK_MIN_PX.week + 'px');
    fitBlockLabels(w);
  });
}
