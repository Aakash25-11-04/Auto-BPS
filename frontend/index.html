/* ============================== Feature 11: LIVE RAILWAY NETWORK MAP ==============================
 * Leaflet + OpenStreetMap tiles (no API key). Real corridor polylines and
 * real station coordinates from /api/map/*, coloured by the chosen IST
 * date's block status.
 *
 * Rendering / performance rules:
 *   - ONE canvas renderer draws every corridor line and station marker.
 *     Canvas keeps thousands of shapes cheap, and a single canvas avoids the
 *     stacked-renderer trap where an upper canvas swallows clicks meant for
 *     layers underneath. Station markers are kept above lines by
 *     re-fronting them after new lines are added.
 *   - Only the pulsing glow under ACTIVE corridors and the status-change
 *     flash use SVG (CSS animation needs real DOM paths); that SVG pane sits
 *     BELOW the canvas and is non-interactive.
 *   - Zoom tiers: 5-7 shows only major stations (junction/terminal or de
 *     facto terminal) and only active/upcoming corridors; 8-10 adds regular
 *     stations and the full corridor network in view; 11+ adds halts.
 *     Everything is culled to the (padded) viewport on every move.
 *   - Geometry is fetched once per session; the 60s refresh polls only the
 *     corridors/stations that have blocks (include_clear/include_quiet=false).
 */
const MAP_STATUS_STYLE = {
  clear:     {color:'#8F9BA4', weight:1.3, opacity:0.7},
  upcoming:  {color:'#D98E04', weight:3.6, opacity:0.95},
  active:    {color:'#D62B1F', weight:5.5, opacity:1},
  completed: {color:'#1E8E4F', weight:2.8, opacity:0.9},
};
const MAP_STATUS_RANK = {clear:0, completed:1, upcoming:2, active:3};
const MAP_COUNTRY_MAX_ZOOM = 7;   // 5-7: country/state view
const MAP_DIVISION_MAX_ZOOM = 10; // 8-10: division view; 11+: local view
const MAP_REFRESH_CHOICES = [30, 60, 120, 300, 0];

// Session-long geometry cache (survives leaving/returning to the map view).
const mapData = {corridors: null, corridorById: {}, stations: null, stationByCode: {}, statusProps: {}, stationActivity: {}, loadedFor: null, meta: {}};
const mapView = {map: null, renderer: null, glowRenderer: null, drawnCorridors: new Map(), glowLayers: new Map(), drawnStations: new Map(),
  overlays: [], timer: null, refreshSec: 60, date: null, horizon: 'weekly', lastUpdated: null, highlightDept: null, hoverId: null, busy: false};
window.abpsMapStats = {};

function teardownNetworkMap(){
  if(mapView.timer){ clearInterval(mapView.timer); mapView.timer = null; }
  if(mapView.map){ try{ mapView.map.remove(); }catch(e){} }
  mapView.map = null; mapView.renderer = null; mapView.glowRenderer = null;
  mapView.drawnCorridors = new Map(); mapView.glowLayers = new Map(); mapView.drawnStations = new Map(); mapView.overlays = [];
  mapView.hoverId = null;
  mapView.busy = false; // an in-flight refresh belongs to the old map; never let it block the next one
}

async function renderNetworkMapView(content, gen){
  const intent = state.mapIntent || {};
  state.mapIntent = null;
  mapView.date = intent.date || mapView.date || istDateStr(new Date());
  mapView.horizon = state.horizon || 'weekly';
  mapView.highlightDept = intent.highlightDept || null;

  content.classList.add('map-mode');
  content.innerHTML = `
    <div class="map-view">
      <div class="map-toolbar">
        <label for="map-date">Date (IST)</label><input type="date" id="map-date" value="${mapView.date}" />
        <label for="map-horizon">Plan</label>
        <select id="map-horizon"><option value="weekly" ${mapView.horizon==='weekly'?'selected':''}>Weekly</option><option value="monthly" ${mapView.horizon==='monthly'?'selected':''}>Monthly</option></select>
        <label for="map-refresh">Auto-refresh</label>
        <select id="map-refresh">${MAP_REFRESH_CHOICES.map(s=>`<option value="${s}" ${s===mapView.refreshSec?'selected':''}>${s ? (s < 60 ? s+'s' : (s/60)+' min') : 'off'}</option>`).join('')}</select>
        <button class="btn secondary small" id="map-refresh-now">Refresh now</button>
        <span class="map-updated" id="map-last-updated" aria-live="polite">Last updated: &mdash;</span>
        <span id="map-banner-slot"></span>
        <span class="map-meta" id="map-meta" style="margin-left:auto;"></span>
      </div>
      <div id="net-map" role="application" aria-label="Railway network map"></div>
    </div>`;

  if(typeof L === 'undefined'){
    document.getElementById('net-map').innerHTML = `<div class="state-box error" style="margin:30px;"><div class="state-icon">&#9888;</div>
      <div class="state-msg">The map library (Leaflet, loaded from unpkg.com) is unavailable — check the network connection and reload.</div></div>`;
    return;
  }

  const map = L.map('net-map', {center: [22.5, 82.0], zoom: 5, minZoom: 4, maxZoom: 18, preferCanvas: true, zoomControl: true});
  mapView.map = map;
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
  }).addTo(map);
  map.createPane('corridorGlow').style.zIndex = 390;   // SVG glow/flash, under the canvas, non-interactive
  map.getPane('corridorGlow').style.pointerEvents = 'none';
  mapView.glowRenderer = L.svg({pane: 'corridorGlow', padding: 0.5});
  mapView.renderer = L.canvas({padding: 0.4, tolerance: 5});
  addMapLegend(map);

  map.on('moveend zoomend', ()=>mapRedraw());

  document.getElementById('map-date').onchange = (ev)=>{ if(ev.target.value){ mapView.date = ev.target.value; mapRefresh({dateChanged: true}); } };
  document.getElementById('map-horizon').onchange = (ev)=>{ mapView.horizon = ev.target.value; mapRefresh({dateChanged: true}); };
  document.getElementById('map-refresh').onchange = (ev)=>{ mapView.refreshSec = parseInt(ev.target.value, 10); scheduleMapRefresh(); };
  document.getElementById('map-refresh-now').onclick = ()=>mapRefresh({});

  const t0 = performance.now();
  try{
    await mapRefresh({initial: true});
  }catch(e){
    if(mapView.map === map) toast('Map data failed to load: ' + e.message, 'err');
    return;
  }
  if(mapView.map !== map || (gen != null && !isCurrentRender(gen))) return; // navigated away mid-load
  window.abpsMapStats.initialLoadMs = Math.round(performance.now() - t0);
  scheduleMapRefresh();

  if(intent.focusCorridor) await mapFocusCorridor(intent.focusCorridor);
  if(mapView.highlightDept) mapApplyGangHighlight();
}

function scheduleMapRefresh(){
  if(mapView.timer){ clearInterval(mapView.timer); mapView.timer = null; }
  if(mapView.refreshSec > 0) mapView.timer = setInterval(()=>{ if(mapView.map) mapRefresh({}); }, mapView.refreshSec * 1000);
}

function _bboxOf(latlngs){
  let s=90, w=180, n=-90, e=-180;
  latlngs.forEach(([la, lo])=>{ if(la<s)s=la; if(la>n)n=la; if(lo<w)w=lo; if(lo>e)e=lo; });
  return [s, w, n, e];
}
function _ingestCorridorFeature(f){
  const latlngs = f.geometry.coordinates.map(([lon, lat])=>[lat, lon]);
  const rec = {id: f.id, kind: f.properties.kind, latlngs, bbox: _bboxOf(latlngs), base: {
    corridor_id: f.properties.corridor_id, kind: f.properties.kind, from_station: f.properties.from_station,
    to_station: f.properties.to_station, distance_km: f.properties.distance_km, zone: f.properties.zone}};
  mapData.corridorById[f.id] = rec;
  return rec;
}

// Fetch statuses (and geometry the first time), then redraw. Corridors whose
// status changed since the previous refresh of the SAME date get flashed.
async function mapRefresh(opts){
  opts = opts || {};
  if(mapView.busy) return;
  mapView.busy = true;
  const mapAtStart = mapView.map;
  const q = `date=${encodeURIComponent(mapView.date)}&horizon=${encodeURIComponent(mapView.horizon)}`;
  const firstLoad = !mapData.corridors;
  const t0 = performance.now();
  try{
    const [cor, sta] = await Promise.all([
      api(`/api/map/corridors?${q}${firstLoad ? '' : '&include_clear=false'}`),
      api(`/api/map/stations?${q}${mapData.stations ? '&include_quiet=false' : ''}`),
    ]);
    const tFetched = performance.now();
    if(mapView.map !== mapAtStart) return; // view was torn down / replaced while fetching
    const previous = {};
    Object.entries(mapData.statusProps).forEach(([id, p])=>{ previous[id] = p.status; });
    const sameDate = mapData.loadedFor === `${mapView.date}|${mapView.horizon}`;

    if(firstLoad){
      mapData.corridors = cor.features.map(_ingestCorridorFeature);
    }
    const statusProps = {};
    cor.features.forEach(f=>{
      if(f.properties.status === 'clear') return;
      if(!mapData.corridorById[f.id]){ mapData.corridors.push(_ingestCorridorFeature(f)); }
      statusProps[f.id] = f.properties;
    });
    mapData.statusProps = statusProps;

    if(!mapData.stations){
      mapData.stations = sta.features.map(f=>{
        const rec = {code: f.id, latlng: [f.geometry.coordinates[1], f.geometry.coordinates[0]], p: f.properties};
        mapData.stationByCode[f.id] = rec;
        return rec;
      });
    }
    const activity = {};
    sta.features.forEach(f=>{ if(f.properties.today_activity > 0) activity[f.id] = f.properties; });
    mapData.stationActivity = activity;
    mapData.meta = {corridors: cor.meta, stations: sta.meta};
    mapData.loadedFor = `${mapView.date}|${mapView.horizon}`;

    const changed = [];
    if(sameDate && !opts.initial && !opts.dateChanged){
      const ids = new Set([...Object.keys(previous), ...Object.keys(statusProps)]);
      ids.forEach(id=>{
        const before = previous[id] || 'clear', after = statusProps[id] ? statusProps[id].status : 'clear';
        if(before !== after) changed.push({id, before, after});
      });
    }

    mapView.lastUpdated = new Date();
    const upd = document.getElementById('map-last-updated');
    if(upd) upd.textContent = `Last updated: ${istTimeStr(mapView.lastUpdated)} IST`;
    window.abpsMapStats.lastFetchMs = Math.round(tFetched - t0);
    window.abpsMapStats.refreshCount = (window.abpsMapStats.refreshCount || 0) + 1;
    window.abpsMapStats.lastUpdatedIst = istTimeStr(mapView.lastUpdated, true);
    window.abpsMapStats.lastChanged = changed;

    mapRedraw({forceRestyle: true});
    changed.forEach(c=>mapFlashCorridor(c.id));
    if(changed.length) toast(`${changed.length} corridor status change(s): ` + changed.slice(0, 3).map(c=>`${c.id} ${c.before}→${c.after}`).join(', '), 'info');
    if(mapView.highlightDept && opts.dateChanged) mapApplyGangHighlight();
  } finally {
    if(mapView.map === mapAtStart) mapView.busy = false;
  }
}

function _corridorWanted(id, status, z, inView){
  const hl = mapView.highlightDept;
  if(z <= MAP_COUNTRY_MAX_ZOOM){
    if(status === 'active' || status === 'upcoming') return true;
    return !!(hl && status !== 'clear' && corridorHasDept(mapData.statusProps[id], hl));
  }
  return inView;
}
function corridorHasDept(props, dept){
  return !!(props && (props.blocks_today || []).some(b=>b.departments.includes(dept)));
}

function mapRedraw(opts){
  opts = opts || {};
  const map = mapView.map;
  if(!map || !mapData.corridors) return;
  const t0 = performance.now();
  const z = map.getZoom();
  const b = map.getBounds().pad(0.25);
  const S = b.getSouth(), N = b.getNorth(), W = b.getWest(), E = b.getEast();
  const inView = bb => !(bb[2] < S || bb[0] > N || bb[3] < W || bb[1] > E);

  // ---- corridors
  // Every physical section exists in BOTH directions (A-B and B-A) with the
  // same geometry. Drawing both would stack two identical lines, and the
  // later (often clear) one would steal hover/clicks from an active one — so
  // clear sections are de-duplicated per station pair, and a pair that
  // already has a status corridor gets no clear line at all.
  const pairKey = c => { const a = c.base.from_station, b = c.base.to_station; return a < b ? a + '|' + b : b + '|' + a; };
  const want = new Map();
  const takenPairs = new Set();
  Object.entries(mapData.statusProps).forEach(([id, p])=>{
    const c = mapData.corridorById[id];
    if(!c) return;
    takenPairs.add(pairKey(c));
    if(_corridorWanted(id, p.status, z, inView(c.bbox))) want.set(id, p.status);
  });
  if(z > MAP_COUNTRY_MAX_ZOOM){
    for(const c of mapData.corridors){
      if(c.kind !== 'section' || want.has(c.id) || mapData.statusProps[c.id] || !inView(c.bbox)) continue;
      const k = pairKey(c);
      if(takenPairs.has(k)) continue;
      takenPairs.add(k);
      want.set(c.id, 'clear');
    }
  }
  let added = 0;
  for(const [id, layer] of mapView.drawnCorridors){
    const st = want.get(id);
    if(st === undefined || (opts.forceRestyle && layer._abpsStatus !== st)) removeCorridorLayer(id);
  }
  for(const [id, st] of want){
    if(!mapView.drawnCorridors.has(id)){ addCorridorLayer(id, st); added++; }
  }

  // ---- stations
  const stationTier = z <= MAP_COUNTRY_MAX_ZOOM ? {major: true} : (z <= MAP_DIVISION_MAX_ZOOM ? {major: true, regular: true} : {major: true, regular: true, halt: true});
  const wantStations = new Set();
  for(const s of mapData.stations){
    if(!stationTier[s.p.tier]) continue;
    const [la, lo] = s.latlng;
    if(la < S || la > N || lo < W || lo > E) continue;
    wantStations.add(s.code);
  }
  for(const [code, layer] of mapView.drawnStations){
    if(!wantStations.has(code) || opts.forceRestyle) removeStationLayer(code);
  }
  for(const code of wantStations){
    if(!mapView.drawnStations.has(code)) addStationLayer(code, z);
    else syncStationLabel(code, z);
  }
  if(added){
    // z-order on the shared canvas = hit-test order: status corridors above
    // clear ones, station markers above everything.
    mapView.drawnCorridors.forEach(l=>{ if(l._abpsStatus !== 'clear') l.bringToFront(); });
    mapView.drawnStations.forEach(l=>l.bringToFront());
  }

  const stats = window.abpsMapStats;
  stats.zoom = z;
  stats.visibleStations = mapView.drawnStations.size;
  stats.visibleCorridors = mapView.drawnCorridors.size;
  stats.permanentLabels = document.querySelectorAll('#net-map .leaflet-tooltip.map-station-label').length;
  stats.lastRedrawMs = Math.round(performance.now() - t0);
  const counts = {};
  mapView.drawnCorridors.forEach(l=>{ counts[l._abpsStatus] = (counts[l._abpsStatus] || 0) + 1; });
  stats.visibleCorridorsByStatus = counts;
  const meta = document.getElementById('map-meta');
  if(meta){
    const sc = (mapData.meta.corridors || {}).status_counts || {};
    meta.textContent = `zoom ${z} · ${stats.visibleStations} stations · ${stats.visibleCorridors} corridor lines shown · today: ` +
      `${sc.active||0} active, ${sc.upcoming||0} upcoming, ${sc.completed||0} completed`;
  }
}

function corridorStyle(status){ return {...MAP_STATUS_STYLE[status], renderer: mapView.renderer}; }

function addCorridorLayer(id, status){
  const c = mapData.corridorById[id];
  const layer = L.polyline(c.latlngs, {...corridorStyle(status), interactive: true, bubblingMouseEvents: false});
  layer._abpsStatus = status;
  layer.bindTooltip(()=>corridorTooltipText(id), {sticky: true, direction: 'top', opacity: 0.95});
  layer.on('mouseover', ()=>mapHoverCorridor(id, true));
  layer.on('mouseout', ()=>mapHoverCorridor(id, false));
  layer.on('click', (ev)=>openCorridorPopup(id, ev.latlng));
  layer.addTo(mapView.map);
  mapView.drawnCorridors.set(id, layer);
  if(status === 'active'){
    const glow = L.polyline(c.latlngs, {renderer: mapView.glowRenderer, color: MAP_STATUS_STYLE.active.color, weight: 14, opacity: 0.25,
      className: 'map-corridor-glow', interactive: false});
    glow.addTo(mapView.map);
    mapView.glowLayers.set(id, glow);
  }
}
function removeCorridorLayer(id){
  const layer = mapView.drawnCorridors.get(id);
  if(layer){ layer.remove(); mapView.drawnCorridors.delete(id); }
  const glow = mapView.glowLayers.get(id);
  if(glow){ glow.remove(); mapView.glowLayers.delete(id); }
  if(mapView.hoverId === id) mapView.hoverId = null;
}

function corridorTooltipText(id){
  const p = mapData.statusProps[id];
  const base = mapData.corridorById[id].base;
  if(!p) return `${id} — clear${base.distance_km != null ? ` · ${base.distance_km} km` : ''}`;
  const ab = p.active_block;
  const when = ab ? ` · ${ab.start_ist}–${ab.end_ist} IST · ${ab.departments.join('+')}` : '';
  return `${id} — ${p.status.toUpperCase()}${when} · ${p.today_summary.total_blocks_today} block(s) today`;
}

// Hover: emphasise one corridor, dim every other drawn line.
function mapHoverCorridor(id, on){
  if(on){
    mapView.hoverId = id;
    mapView.drawnCorridors.forEach((l, oid)=>{
      const base = MAP_STATUS_STYLE[l._abpsStatus];
      l.setStyle(oid === id ? {weight: base.weight + 3, opacity: 1} : {opacity: base.opacity * 0.25});
    });
    const l = mapView.drawnCorridors.get(id);
    if(l) l.bringToFront();
  } else if(mapView.hoverId === id){
    mapView.hoverId = null;
    mapView.drawnCorridors.forEach(l=>{
      l.setStyle({weight: MAP_STATUS_STYLE[l._abpsStatus].weight, opacity: MAP_STATUS_STYLE[l._abpsStatus].opacity});
      if(l._abpsStatus !== 'clear') l.bringToFront();
    });
    mapView.drawnStations.forEach(s=>s.bringToFront());
  }
}

function mapFlashCorridor(id){
  const c = mapData.corridorById[id];
  if(!c || !mapView.map) return;
  const flash = L.polyline(c.latlngs, {renderer: mapView.glowRenderer, color: '#FFD400', weight: 16, opacity: 1, className: 'map-flash', interactive: false});
  flash.addTo(mapView.map);
  setTimeout(()=>flash.remove(), 2700);
}

function stationStyle(s, z){
  const act = mapData.stationActivity[s.code];
  const tier = s.p.tier;
  let radius = tier === 'major' ? (z <= MAP_COUNTRY_MAX_ZOOM ? 3.6 : 5.5) : (tier === 'halt' ? 2.6 : 3.4);
  if(z >= 12) radius += 1.5;
  const style = {radius, color: '#4A5762', weight: tier === 'major' ? 1.2 : 0.8, fillColor: '#9AA6AF', fillOpacity: 0.95, opacity: 0.9};
  if(act){
    const col = DEPT_COLORS[act.dominant_department] || '#4A5762';
    if(act.status === 'active'){ Object.assign(style, {fillColor: col, color: '#111', weight: 2, radius: radius + 1.8}); }
    else if(act.status === 'upcoming'){ Object.assign(style, {fillColor: '#FFFFFF', color: col, weight: 2.4, radius: radius + 1}); }
    else if(act.status === 'completed'){ Object.assign(style, {fillColor: col, fillOpacity: 0.45, color: col}); }
  }
  return style;
}
function _labelModeFor(s, z){
  const act = mapData.stationActivity[s.code];
  if(s.p.tier === 'major'){
    if(z > 6) return 'permanent';
    return (s.p.terminus_trains >= 60 || (act && (act.status === 'active' || act.status === 'upcoming'))) ? 'permanent' : 'hover';
  }
  if(s.p.tier === 'regular') return z >= 12 ? 'permanent' : 'hover';
  return z >= 13 ? 'permanent' : 'hover';
}
function addStationLayer(code, z){
  const s = mapData.stationByCode[code];
  const layer = L.circleMarker(s.latlng, {...stationStyle(s, z), renderer: mapView.renderer, bubblingMouseEvents: false});
  layer.on('click', (ev)=>openStationPopup(code, ev.latlng));
  layer.addTo(mapView.map);
  mapView.drawnStations.set(code, layer);
  syncStationLabel(code, z);
}
function removeStationLayer(code){
  const layer = mapView.drawnStations.get(code);
  if(layer){ layer.remove(); mapView.drawnStations.delete(code); }
}
function syncStationLabel(code, z){
  const s = mapData.stationByCode[code];
  const layer = mapView.drawnStations.get(code);
  const mode = _labelModeFor(s, z);
  if(layer._abpsLabel === mode) return;
  layer.unbindTooltip();
  if(mode === 'permanent'){
    layer.bindTooltip(code, {permanent: true, direction: 'right', offset: [5, 0], className: 'map-station-label'});
  } else {
    layer.bindTooltip(`${code} — ${s.p.station_name}`, {direction: 'top', offset: [0, -4]});
  }
  layer._abpsLabel = mode;
}

function addMapLegend(map){
  const Legend = L.Control.extend({
    options: {position: 'bottomright'},
    onAdd(){
      const div = L.DomUtil.create('div', 'map-legend');
      const line = (st, label)=>`<div class="ml-row"><span class="ml-line" style="height:${Math.max(2, MAP_STATUS_STYLE[st].weight)}px;background:${MAP_STATUS_STYLE[st].color};"></span>${label}</div>`;
      const dot = (fill, stroke, label)=>`<div class="ml-row"><span class="ml-dot" style="background:${fill};border:2px solid ${stroke};"></span>${label}</div>`;
      div.innerHTML = `<div class="ml-head" role="button" tabindex="0" aria-expanded="true"><span>Legend</span><span class="ml-caret">&#9662;</span></div>
        <div class="ml-body">
          ${line('clear', 'Clear — no block')}${line('upcoming', 'Upcoming block')}${line('active', 'Active block (pulsing)')}${line('completed', 'Completed today')}
          <div class="ml-row" style="margin-top:8px;font-weight:700;">Stations</div>
          ${dot('#9AA6AF', '#4A5762', 'No activity')}
          ${dot(DEPT_COLORS.ENG, '#111', 'ENG block active')}${dot(DEPT_COLORS.TD, '#111', 'TD block active')}${dot(DEPT_COLORS.SNT, '#111', 'SNT block active')}
          ${dot('#FFFFFF', DEPT_COLORS.ENG, 'Upcoming (dept ring)')}
          <div class="ml-row small-muted" style="max-width:190px;line-height:1.35;">Zoom 5–7: major stations &amp; active/upcoming corridors only · 8–10: full network · 11+: halts too</div>
        </div>`;
      const head = div.querySelector('.ml-head');
      const toggle = ()=>{ div.classList.toggle('collapsed'); head.setAttribute('aria-expanded', String(!div.classList.contains('collapsed'))); };
      head.onclick = toggle;
      head.onkeydown = (ev)=>{ if(ev.key === 'Enter' || ev.key === ' '){ ev.preventDefault(); toggle(); } };
      L.DomEvent.disableClickPropagation(div);
      L.DomEvent.disableScrollPropagation(div);
      return div;
    },
  });
  new Legend().addTo(map);
}

function _mapDateLabel(){ return mapView.date === istDateStr(new Date()) ? 'today' : mapView.date; }

function blocksListHtml(blocks, opts){
  opts = opts || {};
  if(!blocks.length) return `<div class="small-muted">No blocks ${_mapDateLabel() === 'today' ? 'today' : 'on ' + escapeHtml(mapView.date)}.</div>`;
  return blocks.map(b=>`<div class="mp-block">
    <div><span class="map-status-chip st-${b.status}">${b.status}</span>
      ${opts.showCorridor ? `<b class="mono">${escapeHtml(b.corridor_id)}</b>` : ''}
      <span class="mono">${b.start_ist}&ndash;${b.end_ist} IST</span>
      ${b.starts_on_date_ist !== mapView.date ? `<span class="small-muted">(from ${escapeHtml(b.starts_on_date_ist)})</span>` : ''}
      ${b.departments.map(d=>`<span class="badge dept-${d}">${d}</span>`).join(' ')}
      <span class="small-muted">${b.task_count} task(s)</span></div>
    ${b.tasks.map(t=>`<div class="mp-task">
      ${t.gang_id ? `<span class="gang-chip dept-${t.department}">${escapeHtml(t.gang_id)}</span>` : ''}
      ${t.redacted ? `<span class="badge dept-${t.department}">${t.department}</span><span class="small-muted">another department's task</span>`
        : `<span class="mono">${escapeHtml(t.task_id)}</span><span>${escapeHtml(t.defect_type || '')}</span>`}
      <span class="mono small-muted">${t.start_ist}&ndash;${t.end_ist}${t.active_now ? ' · working now' : ''}</span></div>`).join('')}
  </div>`).join('');
}

function weatherSummaryHtml(w){
  if(!w || !w.available){
    return `<div class="small-muted">Weather unavailable — ${escapeHtml((w && w.reason) || 'no forecast')}. Nothing is assumed or fabricated.</div>`;
  }
  const parts = [];
  if(w.nearest_hour && w.nearest_hour.temperature_c != null) parts.push(`${w.nearest_hour.temperature_c}&deg;C at ${w.nearest_hour.valid_ist} IST`);
  if(w.temperature_min_c != null) parts.push(`${w.temperature_min_c}&ndash;${w.temperature_max_c}&deg;C`);
  if(w.max_precipitation_probability_pct != null) parts.push(`&#9748; max ${w.max_precipitation_probability_pct}%`);
  if(w.max_wind_speed_kmh != null) parts.push(`&#128168; max ${w.max_wind_speed_kmh} km/h`);
  if(w.min_visibility_km != null) parts.push(`vis &ge; ${w.min_visibility_km} km`);
  const hazards = [];
  if(w.lightning_hours_ist && w.lightning_hours_ist.length) hazards.push(`&#9889; thunderstorm ${w.lightning_hours_ist.join(', ')} IST`);
  if(w.fog_hours_ist && w.fog_hours_ist.length) hazards.push(`&#127787; fog ${w.fog_hours_ist.join(', ')} IST`);
  return `<div>${parts.join(' &middot; ')}</div>
    ${hazards.length ? `<div style="color:var(--red);font-weight:600;">${hazards.join(' &middot; ')}</div>` : ''}
    <div class="small-muted" style="font-size:10px;">Source: ${escapeHtml(w.source)} &middot; ${w.hours} hourly rows</div>`;
}

async function openCorridorPopup(id, latlng){
  const map = mapView.map;
  const popup = L.popup({maxWidth: 380, minWidth: 280, autoPanPadding: [30, 30]}).setLatLng(latlng)
    .setContent('<div class="map-popup"><div class="small-muted">Loading corridor&hellip;</div></div>').openOn(map);
  try{
    const d = await api(`/api/map/corridors/${encodeURIComponent(id)}?date=${mapView.date}&horizon=${mapView.horizon}`);
    const canTimeline = state.currentUser && state.currentUser.role === 'COA';
    const ab = d.active_block;
    popup.setContent(`<div class="map-popup" data-corridor="${escapeHtml(id)}">
      <h4>${escapeHtml(d.corridor_id)} <span class="map-status-chip st-${d.status}">${d.status}</span> <span class="small-muted" style="font-family:var(--sans);font-weight:400;">${escapeHtml(d.kind)}</span></h4>
      <div class="mp-sub">${escapeHtml(d.from_station_name || d.from_station)} (${escapeHtml(d.from_station)}) &rarr; ${escapeHtml(d.to_station_name || d.to_station)} (${escapeHtml(d.to_station)})<br/>
        ${d.distance_km != null ? `<b>${d.distance_km} km</b>` : 'distance unknown'} &middot; ${d.stations.length} stations &middot; zone ${escapeHtml(d.zone || '—')} &middot; ${d.train_count} real trains</div>
      ${ab && ab.gang_assignments.length ? `<div class="mp-sec"><div class="mp-sec-title">${d.status === 'active' ? 'Working now' : 'Next block'}</div>
        ${ab.gang_assignments.map(g=>`<div class="mono" style="font-size:11px;">${escapeHtml(g)}</div>`).join('')}</div>` : ''}
      <div class="mp-sec"><div class="mp-sec-title">Blocks ${_mapDateLabel() === 'today' ? 'today' : 'on ' + escapeHtml(mapView.date)} (${d.today_summary.total_blocks_today} &middot; ${d.today_summary.total_hours_blocked} h)</div>
        ${blocksListHtml(d.blocks_today)}</div>
      <div class="mp-sec"><div class="mp-sec-title">Weather</div>${weatherSummaryHtml(d.weather)}</div>
      <div class="mp-sec">
        ${canTimeline ? `<button class="btn small" data-map-timeline="${escapeHtml(id)}">View timeline &rarr;</button>` : `<span class="small-muted">The corridor timeline lives in the Control Office view.</span>`}
        <button class="btn secondary small" data-map-zoom="${escapeHtml(id)}">Zoom to corridor</button>
      </div></div>`);
    wireMapPopupActions(popup.getElement());
  }catch(e){
    popup.setContent(`<div class="map-popup"><div class="row-errors">${escapeHtml(e.message)}</div></div>`);
  }
}

async function openStationPopup(code, latlng){
  const popup = L.popup({maxWidth: 380, minWidth: 280, autoPanPadding: [30, 30]}).setLatLng(latlng)
    .setContent('<div class="map-popup"><div class="small-muted">Loading station&hellip;</div></div>').openOn(mapView.map);
  try{
    const d = await api(`/api/map/stations/${encodeURIComponent(code)}?date=${mapView.date}&horizon=${mapView.horizon}`);
    const t = d.trains_today;
    popup.setContent(`<div class="map-popup" data-station="${escapeHtml(d.station_code)}">
      <h4>${escapeHtml(d.station_name)} <span class="small-muted" style="font-weight:400;">${escapeHtml(d.station_code)}</span></h4>
      <div class="mp-sub">Zone ${escapeHtml(d.zone || '—')}${d.state ? ` &middot; ${escapeHtml(d.state)}` : ''} &middot; ${escapeHtml(d.station_type)}
        &middot; <span class="mono">${d.lat.toFixed(4)}, ${d.lon.toFixed(4)}</span>${d.alias_applied ? ` &middot; (requested ${escapeHtml(d.requested_code)})` : ''}</div>
      <div class="mp-sec"><div class="mp-sec-title">Trains through this station (${escapeHtml(mapView.date)})</div>
        <div><b>${t.count}</b> real trains (${t.departing_count} departing) &middot; <span class="small-muted">${escapeHtml(t.basis)}:</span></div>
        ${t.next_departures.length ? t.next_departures.map(r=>`<div class="mp-task"><span class="mono"><b>${r.departure_ist} IST</b></span>
          <span class="mono">${escapeHtml(r.train_id)}</span><span>${escapeHtml(r.train_name || '')}</span><span class="small-muted">&rarr; ${escapeHtml(r.next_station)}</span></div>`).join('')
          : '<div class="small-muted">No further departures today.</div>'}</div>
      <div class="mp-sec"><div class="mp-sec-title">Blocks affecting this station</div>${blocksListHtml(d.blocks, {showCorridor: true})}</div>
      <div class="mp-sec"><div class="mp-sec-title">Weather</div>${weatherSummaryHtml(d.weather)}</div>
    </div>`);
  }catch(e){
    popup.setContent(`<div class="map-popup"><div class="row-errors">${escapeHtml(e.message)}</div></div>`);
  }
}

function wireMapPopupActions(root){
  if(!root) return;
  root.querySelectorAll('[data-map-timeline]').forEach(btn=>{
    btn.onclick = ()=>{ state.pendingTimelineCorridor = btn.dataset.mapTimeline; showHomeView(); };
  });
  root.querySelectorAll('[data-map-zoom]').forEach(btn=>{
    btn.onclick = ()=>{ const c = mapData.corridorById[btn.dataset.mapZoom]; if(c) mapView.map.fitBounds(L.latLngBounds(c.latlngs), {padding: [60, 60], maxZoom: 13}); };
  });
}

function clearMapOverlays(){
  mapView.overlays.forEach(o=>o.remove());
  mapView.overlays = [];
}

// Timeline "Show on map": zoom to the corridor, outline it, open its popup.
async function mapFocusCorridor(id){
  let c = mapData.corridorById[id];
  if(!c){
    try{
      const d = await api(`/api/map/corridors/${encodeURIComponent(id)}?date=${mapView.date}&horizon=${mapView.horizon}`);
      c = _ingestCorridorFeature({id, geometry: d.geometry, properties: {kind: d.kind, corridor_id: id, from_station: d.from_station, to_station: d.to_station, distance_km: d.distance_km, zone: d.zone}});
      mapData.corridors.push(c);
    }catch(e){ toast(`Cannot show ${id} on the map: ${e.message}`, 'err'); return; }
  }
  clearMapOverlays();
  const bounds = L.latLngBounds(c.latlngs);
  mapView.map.fitBounds(bounds, {padding: [80, 80], maxZoom: 13, animate: false});
  const outline = L.polyline(c.latlngs, {renderer: mapView.glowRenderer, color: '#111', weight: 11, opacity: 0.35, className: 'map-focus-outline', interactive: false});
  outline.addTo(mapView.map);
  mapView.overlays.push(outline);
  window.abpsMapStats.focus = {corridor: id, center: mapView.map.getCenter(), zoom: mapView.map.getZoom(), corridorBounds: bounds.toBBoxString()};
  const mid = c.latlngs[Math.floor(c.latlngs.length / 2)];
  await openCorridorPopup(id, L.latLng(mid[0], mid[1]));
}

// Resource strip -> map: label every corridor where the department's gangs
// work on the selected date, and dim nothing else away (the labels carry it).
function mapApplyGangHighlight(){
  clearMapOverlays();
  const dept = mapView.highlightDept;
  const slot = document.getElementById('map-banner-slot');
  if(!dept){ if(slot) slot.innerHTML = ''; return; }
  const hits = [];
  Object.entries(mapData.statusProps).forEach(([id, p])=>{
    const gangs = new Map();
    (p.blocks_today || []).forEach(b=>b.tasks.forEach(t=>{
      if(t.department === dept && t.gang_id){
        (gangs.get(t.gang_id) || gangs.set(t.gang_id, []).get(t.gang_id)).push(`${t.start_ist}–${t.end_ist}`);
      }
    }));
    if(gangs.size) hits.push({id, gangs});
  });
  const latlngs = [];
  hits.forEach(h=>{
    const c = mapData.corridorById[h.id];
    if(!c) return;
    const label = [...h.gangs.entries()].map(([g, times])=>`${g} ${times.join(', ')}`).join(' · ');
    const ov = L.polyline(c.latlngs, {renderer: mapView.glowRenderer, color: DEPT_COLORS[dept] || '#111', weight: 12, opacity: 0.45, interactive: false});
    ov.addTo(mapView.map);
    ov.bindTooltip(`${label} IST`, {permanent: true, direction: 'top', className: 'map-gang-label'}).openTooltip(L.latLng(c.latlngs[Math.floor(c.latlngs.length/2)]));
    mapView.overlays.push(ov);
    latlngs.push(...c.latlngs);
  });
  window.abpsMapStats.gangHighlight = {dept, date: mapView.date, corridors: hits.map(h=>({corridor: h.id, gangs: [...h.gangs.keys()]}))};
  if(slot){
    slot.innerHTML = `<span class="map-banner">${hits.length ? `Where ${escapeHtml(dept)} gangs work on ${escapeHtml(mapView.date)}: ${hits.length} corridor(s)` : `No ${escapeHtml(dept)} gang work on ${escapeHtml(mapView.date)}`}
      <button class="btn secondary small" id="map-clear-highlight" style="padding:1px 7px;">&times;</button></span>`;
    document.getElementById('map-clear-highlight').onclick = ()=>{ mapView.highlightDept = null; mapApplyGangHighlight(); mapRedraw({forceRestyle: true}); };
  }
  if(latlngs.length) mapView.map.fitBounds(L.latLngBounds(latlngs), {padding: [90, 90], maxZoom: 11});
  mapRedraw({forceRestyle: true});
}

boot();
</script>
